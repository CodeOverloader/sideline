          ${tableTwin([unit[0].toUpperCase() + unit.slice(1), 'Evaluations'], buckets.map(x => [x.title, x.value]))}
        </div>
        <div class="card">
          <h2>League average by skill</h2>
          <p class="sub">${lowest ? `Lowest: ${esc(lowest.label)}, ${fmtAvg(lowest.avg)}. ` : ''}Mixes every mentor and division in the filters.</p>
          <div class="chart" id="chSkills"></div>
          ${tableTwin(['Skill', 'Average', 'Ratings'], skills.map(r => [r.label, fmtAvg(r.avg), r.n]))}
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>Needs the most support</h2>
          <p class="sub">Lowest average over each referee’s last three evaluations.</p>
          ${support.length ? `<ul class="rlist">${support.map(g => refRow(g, avgPill(g.profile.recentAvg),
            `${plural(g.profile.count, 'evaluation')}${topConcern(g.profile) ? ' · ' + esc(topConcern(g.profile)) : ''}`)).join('')}</ul>
            <div class="more"><a href="#referees" data-sort="recent">See every referee</a></div>`
          : '<div class="empty">No ratings in these filters.</div>'}
        </div>
        <div class="card">
          <h2>Recommended to move up</h2>
          <p class="sub">Referees mentors said yes to moving up, most consistent first.</p>
          ${moveUp.length ? `<ul class="rlist">${moveUp.map(x => refRow(x.g, `yes in ${x.yes} of ${x.asked}`,
            `last three average ${fmtAvg(x.g.profile.recentAvg)} · last evaluated ${esc(prettyDate(x.g.profile.lastSeen) || '–')}`)).join('')}</ul>`
          : '<div class="empty">No move-up recommendations in these filters.</div>'}
        </div>
      </div>
      <div class="grid2">
        <div class="card">
          <h2>Most common things to work on</h2>
          <p class="sub">Notes mentors marked “to work on”, by how many referees got them. Useful for training topics.</p>
          ${topWork.length ? `<ul class="rlist">${topWork.map(w => `<li><div class="rrow"><span class="t"><span class="nm">${esc(w.text)}</span><br>
            <span class="d">${esc(own(CAT_SHORT, w.cat) || 'General')}</span></span>
            <span class="r">${plural(w.refs.size, 'referee')}<br>${plural(w.evals, 'evaluation')}</span></div></li>`).join('')}</ul>`
          : '<div class="empty">No “to work on” notes in these filters.</div>'}
        </div>
        <div class="card">
          <h2>Longest since last evaluated</h2>
          <p class="sub">Across all dates, so the date filter does not hide anyone. Referees appear once someone has evaluated them.</p>
          ${overdue.length ? `<ul class="rlist">${overdue.map(g => refRow(g, esc(sinceText(g.profile.lastSeen)),
            `last evaluated ${esc(prettyDate(g.profile.lastSeen))} · ${plural(g.profile.count, 'evaluation')} in all`)).join('')}</ul>`
          : '<div class="empty">No dated evaluations yet.</div>'}
        </div>
      </div>`;
    }

    /* ============================================================
       REFEREES
       ============================================================ */
    const REF_COLS = [
      {key: 'name', label: 'Referee', get: g => g.name.toLowerCase(), first: 1},
      {key: 'count', label: 'Evals', get: g => g.profile.count, n: 1, first: -1},
      {key: 'mentors', label: 'Mentors', get: g => g.profile.mentors, n: 1, first: -1, wide: 1, md: 1},
      {key: 'last', label: 'Last evaluated', get: g => g.profile.lastSeen || null, first: -1},
      {key: 'recent', label: 'Last 3 avg', get: g => g.profile.recentAvg, n: 1, avg: 1, first: 1},
      {key: 'overall', label: 'Overall', get: g => g.profile.overall, n: 1, avg: 1, first: 1, wide: 1, md: 1},
      ...RATED.map(c => ({key: c.id, label: c.short, get: g => catAvg(g, c.id), n: 1, avg: 1, first: 1, wide: 1})),
      {key: 'move', label: 'Move up', get: g => {const m = g.profile.moveUp; return m.yes + m.no ? m.yes / (m.yes + m.no) : null;}, n: 1, first: -1, wide: 1},
    ];
    const colClass = (c) => [c.n ? 'n' : '', c.wide ? 'hide-sm' : '', c.md ? 'hide-md' : ''].filter(Boolean).join(' ');

    function refList() {
      const q = fold(UI.refQ);
      let list = [...slice().groups.values()];
      if (q) list = list.filter(g => fold(g.name).includes(q) || g.spellings.includes(q));
      if (UI.refLow) list = list.filter(g => g.profile.recentAvg != null && g.profile.recentAvg <= LOW);
      const col = REF_COLS.find(c => c.key === UI.refSort.key) || REF_COLS[4], dir = UI.refSort.dir;
      return list.sort((a, z) => {
        const x = col.get(a), y = col.get(z);
        if (x == null || y == null) return (x == null) - (y == null) || a.name.localeCompare(z.name);
        return (x < y ? -1 : x > y ? 1 : 0) * dir || a.name.localeCompare(z.name);
      });
    }

    function viewReferees() {
      return `<div class="toolbar">
        <input type="search" class="inp" id="refQ" placeholder="Search referees, any spelling" aria-label="Search referees" value="${esc(UI.refQ)}" autocomplete="off" />
        <label class="chk"><input type="checkbox" id="refLow" ${UI.refLow ? 'checked' : ''} /> Last-three average ${LOW.toFixed(1)} or lower</label>
        <div class="spacer"></div>
        <button class="btn" id="exportRefs">Export CSV</button>
      </div>
      <div id="refTable">${refTableHTML()}</div>
      <p class="hint">Averages are on the form’s 1 to 4 scale and mix mentors and divisions, so read them next to the counts.
        Select a referee to see their full profile.</p>`;
    }
    function refTableHTML() {
      const list = refList();
      const th = (c) => {
        const cls = colClass(c);
        const on = UI.refSort.key === c.key;
        return `<th class="${cls}" ${on ? `aria-sort="${UI.refSort.dir > 0 ? 'ascending' : 'descending'}"` : ''}>
          <button data-refsort="${c.key}">${c.label}${on ? (UI.refSort.dir > 0 ? ' ▲' : ' ▼') : ''}</button></th>`;
      };
      if (!list.length) {
        return `<div class="card"><div class="empty">${UI.refQ || UI.refLow ? 'No referee matches.' : 'No evaluations match these filters.'}</div></div>`;
      }
      const cell = (c, g) => {
        const cls = colClass(c);
        if (c.key === 'name') {
          const w = topConcern(g.profile);
          return `<td><button class="linkbtn" data-ref="${esc(g.id)}">${esc(g.name)}</button>${w ? `<div class="wf" title="${esc(w)}">Watch for: ${esc(w)}</div>` : ''}</td>`;
        }
        if (c.key === 'last') return `<td class="num">${esc(prettyDate(g.profile.lastSeen) || '–')}</td>`;
        if (c.key === 'move') {const m = g.profile.moveUp; return `<td class="${cls}">${m.yes + m.no ? `${m.yes} of ${m.yes + m.no}` : '–'}</td>`;}
        const v = c.get(g);
        if (c.avg) return `<td class="${cls}${v != null && v <= LOW ? ' low' : ''}">${fmtAvg(v)}</td>`;
        return `<td class="${cls}">${v}</td>`;
      };
      return `<p class="hint" style="margin:0 0 8px">${plural(list.length, 'referee')} · ${esc(scopeText())}</p>
      <div class="tablewrap"><table class="data">
        <thead><tr>${REF_COLS.map(th).join('')}</tr></thead>
        <tbody>${list.map(g => `<tr class="click" data-ref="${esc(g.id)}">${REF_COLS.map(c => cell(c, g)).join('')}</tr>`).join('')}</tbody>
      </table></div>`;
    }
    function exportRefs() {
      const list = refList();
      if (!list.length) {flash('Nothing to export'); return;}
      const head = ['Referee', 'Evaluations', 'Mentors', 'Last evaluated', 'Last three average', 'Overall average',
        ...RATED.map(c => c.label), 'Move up: yes', 'Move up: no', 'Watch for', 'Filters'];
      const rows = list.map(g => [g.name, g.profile.count, g.profile.mentors, prettyDate(g.profile.lastSeen),
        fmtAvg(g.profile.recentAvg), fmtAvg(g.profile.overall), ...RATED.map(c => fmtAvg(catAvg(g, c.id))),
        g.profile.moveUp.yes, g.profile.moveUp.no, topConcern(g.profile), scopeText()]);
      downloadCSV(`sideline-referees-${todayISO()}.csv`, [head, ...rows]);
    }

    /* ============================================================
       EVALUATIONS
       ============================================================ */
    function evalList() {
      const q = fold(UI.evalQ), byId = mentorById();
      let list = slice().evals;
      if (q) list = list.filter(e => fold(e.referee).includes(q) || fold(mentorName(e, byId)).includes(q));
      return list.slice().sort((a, z) => (z.date || '').localeCompare(a.date || '') || z.savedAt - a.savedAt);
    }
    function viewEvaluations() {
      return `<div class="toolbar">
        <input type="search" class="inp" id="evalQ" placeholder="Search by referee or mentor" aria-label="Search evaluations" value="${esc(UI.evalQ)}" autocomplete="off" />
        <div class="spacer"></div>
        <button class="btn" id="exportEvals">Export CSV</button>
      </div>
      <div id="evalTable">${evalTableHTML()}</div>`;
    }
    function evalBody(e) {
      const notes = e.notes.map(n => {
        const p = own(POL, n.pol) || ['·', '', 'Note'], cat = own(CAT_SHORT, n.cat);
        return `<li><span class="pol ${p[1]}" title="${esc(p[2])}" aria-label="${esc(p[2])}">${p[0]}</span>${esc(n.text)}${cat ? ` <span class="muted">· ${esc(cat)}</span>` : ''}</li>`;
      }).join('');
      return `<div class="evalbody">
        <div class="scores">${RATED.map(c => `<span class="pill">${esc(c.short)} ${e.ratings[c.id] ?? '–'}</span>`).join('')}
          <span class="pill">Move up: ${esc(e.moveUp || '–')}</span></div>
        <div class="muted" style="font-size:var(--fs-xs)">${esc([e.field + (e.sub ? ' ' + e.sub : ''), pretty12(e.time), e.division, e.position,

    /* ============================================================
       CLEAN-UP
       ------------------------------------------------------------
       The same referee typed two ways ("Alex Smith", "Alexander Smith")
       becomes two profiles, each with half the history. The server already
       treats case, accents, spacing and "Last, First" as one name; this
       finds the rest for a person to decide. Nothing merges on its own.
       ============================================================ */
    function lev(a, b, max) {
      if (Math.abs(a.length - b.length) > max) return max + 1;
      let prev = Array.from({length: b.length + 1}, (_, j) => j);
      for (let i = 1; i <= a.length; i++) {
        const cur = [i];
        let best = i;
        for (let j = 1; j <= b.length; j++) {
          cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
          if (cur[j] < best) best = cur[j];
        }
        if (best > max) return max + 1;
        prev = cur;
      }
      return prev[b.length];
    }
    function whySimilar(a, b) {
      const ta = a.split(' '), tb = b.split(' ');
      if (a === b) return 'Same letters';
      if ([...ta].sort().join(' ') === [...tb].sort().join(' ')) return 'Same names in a different order';
      if (ta.length > 1 && tb.length > 1 && ta[ta.length - 1] === tb[tb.length - 1]) {
        const fa = ta[0], fb = tb[0];
        if (fa !== fb && (fa.startsWith(fb) || fb.startsWith(fa))) return 'Short and long first name';
      }
      const [sm, bg] = ta.length <= tb.length ? [ta, tb] : [tb, ta];
      if (sm.length >= 2 && sm.length < bg.length && sm.every(t => bg.includes(t))) return 'One has an extra name';
      const minLen = Math.min(a.length, b.length), max = minLen >= 9 ? 2 : minLen >= 5 ? 1 : 0;
      if (max && lev(a, b, max) <= max) return 'Spelled almost the same';
      return '';
    }
    const pairKey = (a, b) => [a, b].sort().join('|');
    function dupePairs() {
      const groups = [...slice().allGroups.values()].map(g => ({g, f: fold(g.name)})).filter(x => x.f);
      if (groups.length > 4000) return [];   // a guard, far beyond a league's size
      const out = [];
      for (let i = 0; i < groups.length; i++) {
        for (let j = i + 1; j < groups.length; j++) {
          const why = whySimilar(groups[i].f, groups[j].f);
          if (why && !UI.notSame.has(pairKey(groups[i].g.id, groups[j].g.id))) out.push({a: groups[i].g, b: groups[j].g, why});
        }
      }
      return out.sort((x, y) => (y.a.profile.count + y.b.profile.count) - (x.a.profile.count + x.b.profile.count)).slice(0, 60);
    }
    function refOptions(exclude) {
      const all = slice().allGroups;
      return [...DATA.referees.values()].filter(x => !x.merged_into && x.id !== exclude)
        .map(x => ({id: x.id, name: all.has(x.id) ? all.get(x.id).name : x.display_name, n: all.has(x.id) ? all.get(x.id).profile.count : 0}))
        .sort((a, z) => a.name.localeCompare(z.name))
        .map(x => `<option value="${esc(x.id)}">${esc(x.name)} (${plural(x.n, 'evaluation')})</option>`).join('');
    }
    function viewCleanup() {
      const pairs = dupePairs();
      const side = (g) => `<div><button class="linkbtn" data-ref="${esc(g.id)}">${esc(g.name)}</button>
        <div class="muted" style="font-size:var(--fs-xs)">${plural(g.profile.count, 'evaluation')} · ${plural(g.profile.mentors, 'mentor')} · last ${esc(prettyDate(g.profile.lastSeen) || '–')}</div></div>`;

      return `

      <div class="card">${pairs.length ? pairs.map(p => `<div class="dupe">${side(p.a)}${side(p.b)}
        <div class="acts">

          <button class="btn sm ghost" data-notsame="${esc(pairKey(p.a.id, p.b.id))}">Different people</button>
        </div><div class="why">${esc(p.why)}</div></div>`).join('')

        ${UI.notSame.size ? `<div class="more">${plural(UI.notSame.size, 'pair')} marked as different people in this browser.

      <h2 class="sec">Merge by hand</h2>

    }

        message: `“${nm(fromId)}” and its ${plural(n, 'evaluation')} become part of “${nm(intoId)}”. Later saves under either ` +
          'spelling land there too. This cannot be split apart again from here.', confirm: 'Merge'});

    /* ============================================================
       IMPORT FORM RESPONSES
       ------------------------------------------------------------
       Some mentors only fill in the Google Form. Its responses sheet is
       fetched here and brought into the database, so those evaluations count
       in the profiles too. The server decides what each row is - new, edited
       on the form since the last import, already imported, or already
       uploaded from the app (skipped: the app's copy has the notes) - first
       as a preview that saves nothing, then for real. The rules live in
       supabase/migrations/20260918140000_form_import.sql.
       ============================================================ */
    const IMPF = {link: store.get('sideline:adminFormSheet') || '', busy: '', error: '', items: null, status: null,
      result: null, showAll: false};

    // How the form's questions head the responses sheet, typos and all
    // ("Postion Referee was in"), after lower-casing and dropping punctuation.
    const FORM_COLS = [
      ['timestamp', /^timestamp$/], ['mentor', /^mentor/], ['date', /^date$/], ['field', /^field$/],
      ['time', /^time$/], ['division', /^division/], ['referee', /^referee being mentored|^referee( name)?$/],
      ['position', /^posi?tion/], ['appearance', /appearance/], ['workrate', /workrate/], ['commands', /commands/],
      ['teamwork', /teamwork/], ['fouls', /fouls/], ['offsides', /offside/], ['moveup', /move up/], ['comments', /^comments?$/],
    ];
    const FORM_STATUS = {
      error: ['Cannot import', 'pill low'], new: ['New', 'pill acc'], changed: ['Edited on the form', 'pill acc'],
      in_app: ['Uploaded from the app', 'pill'], same: ['Already imported', 'pill'],
    };

    /* The sheet's CSV link. gviz is the export endpoint that allows a browser
       to read it (the same one the mentor app's schedule import uses). */
    function sheetCsvUrl(idOrUrl) {
      const str = String(idOrUrl || '').trim();
      const m = str.match(/\/d\/([a-zA-Z0-9\-_]{20,})/);
      const gid = str.match(/[#&?]gid=(\d+)/);
      return `https://docs.google.com/spreadsheets/d/${encodeURIComponent(m ? m[1] : str)}/gviz/tq?tqx=out:csv&headers=1` +
        (gid ? '&gid=' + gid[1] : '');
    }
    /* RFC 4180 CSV: comments hold commas, quotes and line breaks. */
    function parseCSV(text) {
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') {if (text[i + 1] === '"') {cell += '"'; i++;} else inQ = false;}
          else cell += ch;
        } else if (ch === '"') inQ = true;
        else if (ch === ',') {row.push(cell); cell = '';}
        else if (ch === '\n') {row.push(cell); rows.push(row); row = []; cell = '';}
        else if (ch !== '\r') cell += ch;
      }
      if (cell.length || row.length) {row.push(cell); rows.push(row);}
      return rows;
    }
    // slice() counts UTF-16 units; half an emoji makes the database refuse the whole batch.
    const clip = (s, n) => (s.length > n && /[\ud800-\udbff]/.test(s[n - 1]) ? s.slice(0, n - 1) : s.slice(0, n));
    /* The sheet writes dates the US way (9/12/2026). Anything unreadable is
       sent as it is, and the server says it is not a date. */
    function formDate(v) {
      const t = String(v || '').trim();
      let m = t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${pad2(m[2])}-${pad2(m[3])}`;
      m = t.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2}|\d{4})\b/);
      if (m) return `${m[3].length === 2 ? '20' + m[3] : m[3]}-${pad2(m[1])}-${pad2(m[2])}`;
      return t;
    }
    function formTime(v) {   // "9:00:00 AM" -> "09:00"
      const t = String(v || '').trim();
      const m = t.match(/^(\d{1,2}):(\d{2})(?::\d{2})?\s*([ap])?/i);
      if (!m) return t;
      let h = Number(m[1]);
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
      return `${pad2(h)}:${m[2]}`;
    }
    function formStamp(v) {  // the response time, "9/12/2026 15:04:05", in this computer's time zone
      const m = String(v || '').trim().match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})\s+(\d{1,2}):(\d{2})(?::(\d{2}))?/);
      if (!m) return '';
      const d = new Date(+m[3], m[1] - 1, +m[2], +m[4], +m[5], +(m[6] || 0));
      return isNaN(d) ? '' : d.toISOString();
    }

    /* Sheet rows -> the items import_form_evaluations() takes. Throws when
       the columns it needs are not there. */
    function formItems(rows) {
      const head = rows[0].map(h => String(h).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim());
      const col = {};
      FORM_COLS.forEach(([k, re]) => {
        const i = head.findIndex((h, j) => re.test(h) && !Object.values(col).includes(j));
        if (i >= 0) col[k] = i;
      });
      const missing = [['mentor', 'Mentor/Monitor name'], ['date', 'Date'], ['referee', 'Referee being mentored'],
        ['position', 'Position']].filter(([k]) => !(k in col)).map(([, l]) => l);
      if (missing.length) {
        throw new Error(`This does not look like the form's responses: no ${missing.join(', ')} column. ` +
          'Check the link points at the responses tab (add its #gid=… if the sheet has several tabs).');
      }
      const get = (r, k) => (k in col ? String(r[col[k]] == null ? '' : r[col[k]]).trim() : '');
      const rating = (v) => (v === '' ? null : v.replace(/\.0+$/, ''));
      return rows.slice(1).map((r, i) => ({r, row: i + 2}))
        .filter(({r}) => r.some(c => String(c).trim()))
        .map(({r, row}) => {
          const mv = get(r, 'moveup');
          const item = {
            row, mentor_name: clip(get(r, 'mentor'), 80), eval_date: formDate(get(r, 'date')), kickoff: formTime(get(r, 'time')),
            field: clip(get(r, 'field'), 80), division: clip(get(r, 'division'), 40), referee_name: clip(get(r, 'referee'), 120),
            position: get(r, 'position').toUpperCase(), move_up: /^y/i.test(mv) ? 'Yes' : /^n/i.test(mv) ? 'No' : mv,
            comments: clip(get(r, 'comments'), 20000), saved_at: formStamp(get(r, 'timestamp'))
          };
          RATED.forEach(c => {item[c.id] = rating(get(r, c.id));});
          return item;
        });
    }

    /* Preview (apply = false) or import. The server takes 200 at a time. */
    async function formRun(apply) {
      const out = new Map();
      for (let i = 0; i < IMPF.items.length; i += 200) {
        const {data, error} = await sbc().rpc('import_form_evaluations', {p_items: IMPF.items.slice(i, i + 200), p_apply: apply});
        if (error) throw error;
        (data || []).forEach(d => out.set(d.out_row, {status: d.out_status, error: d.out_error || ''}));
      }
      return out;
    }
    function formCounts(st) {
      const n = {new: 0, changed: 0, same: 0, in_app: 0, error: 0};
      st.forEach(s => {if (s.status in n) n[s.status]++;});
      return n;
    }

    async function formFetch() {
      const link = String(IMPF.link || '').trim();
      if (!link) {flash('Paste the responses sheet link first'); return;}
      store.set('sideline:adminFormSheet', link);
      Object.assign(IMPF, {busy: 'Fetching the sheet…', error: '', items: null, status: null, result: null});
      paintView();
      try {
        let text;
        try {
          const res = await fetch(sheetCsvUrl(link), {cache: 'no-store'});
          if (!res.ok) throw new Error();
          text = await res.text();
        } catch (e) {
          // A private sheet fails here too: Google answers with a sign-in page
          // the browser is not allowed to read.
          throw new Error('Could not read that sheet. Check the link, and that the sheet is shared as ' +
            '"Anyone with the link" can view.');
        }
        if (/^\s*</.test(text)) throw new Error('Google sent a sign-in page instead of the sheet. Share it as "Anyone with the link" can view.');
        const rows = parseCSV(text);
        if (rows.length < 2) throw new Error('The sheet has no responses yet.');
        IMPF.items = formItems(rows);
        IMPF.busy = 'Checking the responses against the database…';
        paintView();
        IMPF.status = await formRun(false);
      } catch (e) {
        IMPF.error = friendly(e); IMPF.items = null; IMPF.status = null;
      }
      IMPF.busy = '';
      paintView();
    }

    async function formImport() {
      if (!IMPF.status) return;
      const n = formCounts(IMPF.status);
      if (!n.new && !n.changed) {flash('Nothing new to import'); return;}
      const ok = await confirmBox({title: 'Import these responses?',
        message: `${plural(n.new, 'new evaluation')} and ${plural(n.changed, 'edited one')} go into the database, credited ` +
          'to the mentor named on the form, and every approved mentor sees them in referee profiles. Responses already ' +
          'uploaded from the app are skipped.', confirm: 'Import'});
      if (!ok) return;
      IMPF.busy = 'Importing…'; IMPF.error = '';
      paintView();
      try {
        IMPF.result = formCounts(await formRun(true));
        IMPF.status = await formRun(false);   // what the sheet looks like against the database now
        flash(`${plural(IMPF.result.new, 'evaluation')} imported, ${IMPF.result.changed} updated`);
      } catch (e) {
        IMPF.error = friendly(e);
      }
      IMPF.busy = '';
      await refresh();   // reloads the league's data, and repaints this page
    }

    function viewImport() {
      const top = `<div class="card">
        <h2>The form’s responses sheet</h2>
        <p class="sub">Evaluations sent with the Google Form but never saved in the app come in here, so they count in the
          referee profiles. Nothing changes until you press Import, and importing again later only adds what is new or edited.</p>
        <div class="formrow">
          <label class="fld" style="flex:1 1 320px"><span>Link to the responses sheet</span>
            <input type="text" class="inp" id="fsLink" value="${esc(IMPF.link)}" autocomplete="off" spellcheck="false"
              placeholder="https://docs.google.com/spreadsheets/d/…" /></label>
          <button class="btn primary" id="fsFetch" ${IMPF.busy ? 'disabled' : ''}>${IMPF.status ? 'Fetch again' : 'Fetch responses'}</button>
        </div>
        <p class="hint">In the form’s Responses tab, open the linked sheet and copy its address. It has to be shared as
          <b>Anyone with the link can view</b> for this page to read it, which means anyone who gets hold of the link can read
          every response, so keep it among league leadership. The link is remembered in this browser only.</p>
      </div>`;
      if (IMPF.busy) return top + `<div class="card"><div class="empty">${esc(IMPF.busy)}</div></div>`;
      const err = IMPF.error ? `<div class="warn">${esc(IMPF.error)}</div>` : '';
      if (!IMPF.items || !IMPF.status) return top + err;

      const n = formCounts(IMPF.status);
      const done = IMPF.result ? `<div class="banner"><span><b>Imported ${plural(IMPF.result.new, 'evaluation')}</b>
        and updated ${IMPF.result.changed}.</span></div>` : '';
      const order = {error: 0, new: 1, changed: 2, in_app: 3, same: 4};
      const rows = IMPF.items.map(it => ({it, s: IMPF.status.get(it.row) || {status: 'error', error: 'No answer from the server'}}))
        .filter(x => IMPF.showAll || !['same', 'in_app'].includes(x.s.status))
        .sort((a, z) => order[a.s.status] - order[z.s.status] || a.it.row - z.it.row);
      const shown = rows.slice(0, 300);
      const table = shown.length ? `<div class="tablewrap"><table class="data"><thead><tr>
          <th class="n"><span>Row</span></th><th><span>Date</span></th><th><span>Referee</span></th><th><span>Pos</span></th>
          <th class="hide-sm"><span>Mentor</span></th><th><span>Status</span></th></tr></thead><tbody>
          ${shown.map(({it, s}) => {
            const [label, cls] = FORM_STATUS[s.status] || FORM_STATUS.error;
            return `<tr><td class="n">${it.row}</td><td class="num">${esc(prettyDate(ISO_RE.test(it.eval_date) ? it.eval_date : '') || it.eval_date || '–')}</td>
              <td>${esc(it.referee_name || '–')}</td><td>${esc(it.position || '–')}</td><td class="hide-sm">${esc(it.mentor_name || '–')}</td>
              <td><span class="${cls}">${esc(label)}</span>${s.error ? `<div class="muted" style="font-size:var(--fs-xs)">${esc(s.error)}</div>` : ''}</td></tr>`;
          }).join('')}</tbody></table></div>
          ${rows.length > shown.length ? `<p class="hint">Showing the first ${shown.length} of ${rows.length}.</p>` : ''}`
        : '<div class="card"><div class="empty">Every response is already in the database.</div></div>';
      const hidden = n.same + n.in_app;
      return top + err + done + `
      <div class="kpis">
        <div class="kpi"><div class="l">New</div><div class="v">${n.new}</div><div class="s">not in the database yet</div></div>
        <div class="kpi"><div class="l">Edited on the form</div><div class="v">${n.changed}</div><div class="s">imported before, changed since</div></div>
        <div class="kpi"><div class="l">Already in</div><div class="v">${n.same + n.in_app}</div><div class="s">${n.in_app} uploaded from the app, skipped</div></div>
        <div class="kpi"><div class="l">Cannot import</div><div class="v">${n.error}</div><div class="s">the reason is on each row</div></div>
      </div>
      <div class="toolbar">
        <button class="btn primary" id="fsImport" ${n.new + n.changed ? '' : 'disabled'}>Import ${plural(n.new + n.changed, 'response')}</button>
        <div class="spacer"></div>
        ${hidden ? `<label class="chk"><input type="checkbox" id="fsAll" ${IMPF.showAll ? 'checked' : ''} /> Show the ${hidden} already in</label>` : ''}
      </div>
      ${table}
      <p class="hint">A response counts as uploaded from the app when the app has an evaluation of the same referee, on the same date,
        in the same position, by a mentor with the same name. The app’s copy is kept because it has the notes.</p>`;
    }

    /* ============================================================
       REFEREE PANEL
       ============================================================ */
    let drawerReturn = null;
    function openDrawer(id) {
      if (!id) return;
      if (!ST.drawer) drawerReturn = document.activeElement;
      ST.drawer = id;
      // Shown before it is painted: the chart measures the panel's width.
      $('#drawer').hidden = false; $('#scrim').hidden = false;
      paintDrawer();
      const shell = $('#shell'); if (shell) shell.inert = true;
      document.body.style.overflow = 'hidden';
      $('#drBody').scrollTop = 0;
      $('#drClose').focus();
    }
    function closeDrawer(silent) {
      const was = ST.drawer;
      ST.drawer = '';
      CHARTS.delete('chTrend');
      $('#drawer').hidden = true; $('#scrim').hidden = true;
      const shell = $('#shell'); if (shell) shell.inert = false;
      document.body.style.overflow = '';
      if (was && !silent && drawerReturn && document.contains(drawerReturn)) drawerReturn.focus();
      hideTip();
    }

    function paintDrawer() {
      if (!DATA) return;
      const s = slice(), id = ST.drawer;
      let g = s.groups.get(id), outside = false;
      const all = s.allGroups.get(id);
      if (!g) {g = all; outside = true;}
      if (!g) {
        $('#drTitle').textContent = 'Referee';
        $('#drBody').innerHTML = '<div class="empty">There are no evaluations for this referee any more.</div>';
        return;
      }
      const p = g.profile, byId = mentorById();
      $('#drTitle').textContent = g.name;
      const extra = all && !outside ? all.profile.count - p.count : 0;
      const trendMark = (t) => t === 'up' ? ' <span title="Better in the last three ratings" aria-label="improving" style="color:var(--plus)">&uarr;</span>'
        : t === 'down' ? ' <span title="Worse in the last three ratings" aria-label="slipping" style="color:var(--minus)">&darr;</span>' : '';
      const list = (items) => `<ul class="plist">${items.join('')}</ul>`;
      const watch = p.watch.map(w => `<li>${esc(w.text)} <span class="muted">· in ${w.evals} evaluations</span></li>`)
        .concat(p.lowCats.map(c => `<li>${esc(c.label)} <span class="muted">· averages ${fmtAvg(c.avg)} over ${plural(c.n, 'rating')}</span></li>`));
      const notesCards = [
        watch.length ? `<div class="card"><h2>Watch for</h2>${list(watch)}</div>` : '',
        p.lastWork.length ? `<div class="card"><h2>Still to work on after the last evaluation</h2>${list(p.lastWork.map(n => `<li>${esc(n.text)}</li>`))}</div>` : '',
        p.improved.length ? `<div class="card"><h2>Fixed after being told</h2>${list(p.improved.slice(0, 8).map(n => `<li>${esc(n.text)}${n.evals > 1 ? ` <span class="muted">· ${n.evals} times</span>` : ''}</li>`))}</div>` : '',
        p.strengths.length ? `<div class="card"><h2>Consistent strengths</h2>${list(p.strengths.slice(0, 6).map(n => `<li>${esc(n.text)} <span class="muted">· in ${n.evals} evaluations</span></li>`))}</div>` : ''
      ].filter(Boolean).join('');
      const pts = p.evals.filter(e => e.avg != null).slice().reverse()
        .map(e => ({date: e.date, value: e.avg, label: `${prettyDate(e.date) || 'No date'} · ${mentorName(e, byId)} · ${e.division || 'no division'} ${e.position}`}));
      if (pts.length >= 2) CHARTS.set('chTrend', (el) => trendChart(el, pts)); else CHARTS.delete('chTrend');
      const tile = (l, v, sub) => `<div class="kpi"><div class="l">${l}</div><div class="v">${v}</div><div class="s">${sub}</div></div>`;

      $('#drBody').innerHTML = `
        <p class="hint" style="margin:0 0 12px">${plural(p.count, 'evaluation')} · ${plural(p.mentors, 'mentor')} · last evaluated
          ${esc(prettyDate(p.lastSeen) || '–')}${p.lastSeen ? ` (${esc(sinceText(p.lastSeen))})` : ''}<br>
          ${outside ? '<b>Nothing in the current filters</b>, so this shows every evaluation.' : esc(scopeText())}
          ${extra > 0 ? `· ${plural(extra, 'more evaluation')} outside these filters <button class="btn sm" data-allDates>Show all dates</button>` : ''}</p>
        <div class="drstats">
          ${tile('Overall average', fmtAvg(p.overall), plural(p.rated, 'rated evaluation'))}
          ${tile('Last three', fmtAvg(p.recentAvg), p.rated > 3 ? 'newest evaluations' : 'too few to differ')}
          ${tile('Move up', `${p.moveUp.yes}<span class="muted" style="font-size:1rem"> / ${p.moveUp.yes + p.moveUp.no}</span>`, 'said yes')}
        </div>
        ${pts.length >= 2 ? `<div class="card"><h2>Average per evaluation</h2><p class="sub">Oldest to newest, 1 to 4.</p>
          <div class="chart" id="chTrend"></div>
          ${tableTwin(['Evaluation', 'Average'], pts.map(x => [x.label, fmtAvg(x.value)]))}</div>` : ''}
        <div class="card"><h2>By skill</h2><p class="sub">(n) is how many ratings each average rests on. &uarr;&darr; compare the last three with earlier ones.</p>
          ${p.cats.map(c => `<div class="catrow"><span>${esc(c.short)}</span>
            <span class="bar" aria-hidden="true"><i class="${c.avg != null && c.avg <= LOW ? 'low' : ''}" style="width:${c.avg == null ? 0 : (c.avg / 4) * 100}%"></i></span>
            <span class="cv">${fmtAvg(c.avg)} <small>(${c.n})</small>${trendMark(c.trend)}</span></div>`).join('')}
        </div>
        ${notesCards ? `<div class="cols2">${notesCards}</div>` : ''}
        <h2 class="sec">Evaluations</h2>
        ${p.evals.map(e => `<details class="evald"><summary><b>${esc(prettyDate(e.date) || 'No date')}</b> · ${esc(e.division || 'no division')}
          · ${esc(e.position)} · avg ${fmtAvg(e.avg)} <span class="muted">· ${esc(mentorName(e, byId))}${fold(e.referee) !== fold(g.name) ? ` · as “${esc(e.referee)}”` : ''}</span></summary>
          ${evalBody(e)}</details>`).join('')}
        <h2 class="sec">Records</h2>
        <div class="card">
          <div class="formrow">
            <label class="fld"><span>Another spelling of this referee</span><select id="drMerge"><option value="">Choose a referee to merge in</option>${refOptions(id)}</select></label>
            <button class="btn" id="drMergeGo">Merge into ${esc(g.name)}</button>
          </div>
          <div style="border-top:1px solid var(--line);margin:16px 0"></div>
          <button class="btn danger" id="drDelete">Delete all records</button>
          <p class="hint">For deletion requests: removes every uploaded evaluation of this referee, from every mentor, across all dates.</p>
        </div>`;
      drawCharts();
    }

    /* ============================================================
       SIGN-IN SCREENS
       ============================================================ */
    function gateHTML() {
      const brand = '<div class="brand">SIDE<span>LINE</span> <small>ADMIN</small></div>';
      const box = (inner) => `<div class="gate"><div class="card">${brand}${inner}</div></div>`;
      const err = LOGIN.error ? `<div class="warn" style="margin-top:12px">${esc(LOGIN.error)}</div>` : '';
      switch (ST.auth) {
        case 'loading': return box('<p>Checking your sign-in…</p>');
        case 'off': return box('<h1>Accounts are off</h1><p>This copy of Sideline has no database connected, so there is nothing to administer.</p>');
        case 'error': return box(`<h1>Could not connect</h1><div class="warn">${esc(ST.authError)}</div>
          <div class="stack"><button class="btn primary" id="retryAuth">Try again</button></div>`);
        case 'notAdmin': {
          const pending = ST.me && ST.me.role === 'pending';
          return box(`<h1>This console is for league admins</h1>
            <p>You are signed in as <b>${esc(ST.me ? ST.me.email : '')}</b>, ${pending ? 'which is still waiting for approval' : 'a mentor account'}.
            ${pending ? '' : 'Mentors do everything they need in the mentor app. '}Ask the assignor if you need admin access.</p>
            <div class="stack"><a class="btn primary" href="../">Open the mentor app</a>
            <button class="btn ghost" id="recheck">Check again</button>
            <button class="btn ghost" id="signOutBtn">Sign out</button></div>`);
        }
        default:
          if (LOGIN.step === 'code') {
            return box(`<h1>Enter your code</h1><p>${esc(LOGIN.notice)}</p>
              <label class="fld"><span>Sign-in code</span><input type="text" id="loginCode" inputmode="numeric"
                autocomplete="one-time-code" maxlength="10" placeholder="123456" /></label>
              <button class="btn primary" id="verifyBtn" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? 'Checking…' : 'Sign in'}</button>
              <div class="stack"><button class="btn ghost" id="resendBtn" ${LOGIN.busy ? 'disabled' : ''}>Send a new code</button>
              <button class="btn ghost" id="backBtn">Different email</button></div>${err}`);
          }
          return box(`<h1>Admin console</h1>
            <p>For the assignor and league leadership: approve mentors, review referees and export reports.
              Sign in with the email you use in the mentor app.</p>
            <label class="fld"><span>Email</span><input type="email" id="loginEmail" autocomplete="email" autocapitalize="off"
              spellcheck="false" value="${esc(LOGIN.email)}" placeholder="you@example.com" /></label>
            <button class="btn primary" id="sendBtn" ${LOGIN.busy ? 'disabled' : ''}>${LOGIN.busy ? 'Sending…' : 'Email me a sign-in code'}</button>
            <p class="hint">Signing in here also signs this browser in to the mentor app.</p>${err}`);
      }
    }

    /* ============================================================
       EVENTS
       ============================================================ */
    window.addEventListener('hashchange', () => {
      const v = viewFromHash();
      if (v === ST.view) return;
      ST.view = v;
      if (ST.drawer) closeDrawer(true);
      paintView();
      window.scrollTo(0, 0);
    });

    document.addEventListener('click', async (e) => {
      const hit = (attr) => {const el = e.target.closest(`[${attr}]`); return el ? el.getAttribute(attr) : null;};
      if (e.target.closest('#scrim') || e.target.closest('#drClose')) {closeDrawer(); return;}

      const sortTo = hit('data-sort'); if (sortTo) {UI.refSort = {key: sortTo, dir: 1};}
      if (hit('data-alldates') !== null) {F.range = 'all'; filtersChanged(true); return;}
      const ref = hit('data-ref'); if (ref) {e.preventDefault(); openDrawer(ref); return;}
      const refSort = hit('data-refsort');
      if (refSort) {
        const col = REF_COLS.find(c => c.key === refSort);
        UI.refSort = UI.refSort.key === refSort ? {key: refSort, dir: -UI.refSort.dir} : {key: refSort, dir: col.first || 1};
        $('#refTable').innerHTML = refTableHTML();
        return;
      }
      const openEval = hit('data-openeval');
      if (openEval) {
        UI.openEval = UI.openEval === openEval ? '' : openEval;
        $('#evalTable').innerHTML = evalTableHTML();
        const b = $(`button[data-openeval="${CSS.escape(openEval)}"]`); if (b) b.focus();
        return;
      }
      const approve = hit('data-approve');
      if (approve) {mentorAction('set_mentor_role', {p_mentor: approve, p_role: 'mentor'}, `${personName(approve)} approved`); return;}
      const reject = hit('data-reject');
      if (reject) {
        if (await confirmBox({title: 'Reject this sign-up?', message: `Deletes the sign-in for ${personName(reject)}. They can ask again later.`,
          confirm: 'Reject', danger: true})) mentorAction('remove_mentor', {p_mentor: reject}, 'Sign-up removed');
        return;
      }
      const setRole = hit('data-setrole');
      if (setRole) {
        const [id, role] = setRole.split('|'), name = personName(id);
        const ok = role === 'admin'
          ? await confirmBox({title: `Make ${name} an admin?`, message: 'Admins can approve and remove people, merge referees, ' +
            'delete every record of a referee and use this console. Admin is meant for league leadership such as the assignor, not for mentors.',
            confirm: 'Make admin'})
          : await confirmBox({title: `Make ${name} a mentor?`, message: 'They keep the mentor app and every evaluation, but lose this console.', confirm: 'Make mentor'});
        if (ok) mentorAction('set_mentor_role', {p_mentor: id, p_role: role}, role === 'admin' ? `${name} is now an admin` : `${name} is now a mentor`);
        return;
      }
      const revoke = hit('data-revoke');
      if (revoke) {
        if (await confirmBox({title: `Revoke ${personName(revoke)}’s access?`, message: 'They can no longer upload or read shared evaluations ' +
          'until approved again. Evaluations they already uploaded stay.', confirm: 'Revoke', danger: true})) {
          mentorAction('set_mentor_role', {p_mentor: revoke, p_role: 'pending'}, 'Access revoked');
        }
        return;
      }
      const merge = hit('data-merge'); if (merge) {const [a, b] = merge.split('|'); doMerge(a, b); return;}
      const notSame = hit('data-notsame');
      if (notSame) {
        UI.notSame.add(notSame); store.set('sideline:adminNotSame', [...UI.notSame]);
        paintView(); return;
      }

      const btn = e.target.closest('button[id]');
      switch (btn ? btn.id : '') {
        case 'sendBtn': case 'resendBtn': {const i = $('#loginEmail'); if (i) LOGIN.email = i.value; sendCode(); return;}
        case 'verifyBtn': verifyCode(); return;
        case 'backBtn': Object.assign(LOGIN, {step: 'email', error: '', notice: ''}); render(); return;
        case 'retryAuth': ST.auth = 'loading'; render(); sb ? refresh() : startAuth(); return;
        case 'recheck': refresh(); return;
        case 'signOutBtn': signOut(); return;
        case 'refreshBtn': refresh(); return;
        case 'retryBtn': loadAll(); return;
        case 'themeBtn':
          themeMode = isDark() ? 'light' : 'dark'; store.set('sideline:adminTheme', themeMode);
          applyTheme(); paintAcct(); return;
        case 'exportRefs': exportRefs(); return;
        case 'exportEvals': exportEvals(); return;
        case 'evalMore': UI.evalLimit += 100; $('#evalTable').innerHTML = evalTableHTML(); return;
        case 'resetNotSame': UI.notSame.clear(); store.set('sideline:adminNotSame', []); paintView(); return;
        case 'mGo': doMerge($('#mFrom').value, $('#mInto').value); return;
        case 'delOpen': {const v = $('#delPick').value; if (v) openDrawer(v); else flash('Choose a referee'); return;}
        case 'fsFetch': formFetch(); return;
        case 'fsImport': formImport(); return;
        case 'drMergeGo': {const v = $('#drMerge').value; if (v) doMerge(v, ST.drawer); else flash('Choose a referee to merge in'); return;}
        case 'drDelete': deleteRecords(ST.drawer); return;
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && $('#dlg').open) {e.preventDefault(); $('#dlgNo').click(); return;}
      if (e.key === 'Escape' && ST.drawer) {closeDrawer(); return;}
      if (e.key === 'Enter' && e.target.id === 'loginEmail') {LOGIN.email = e.target.value; sendCode(); return;}
      if (e.key === 'Enter' && e.target.id === 'loginCode') verifyCode();
    });

    document.addEventListener('input', (e) => {
      const t = e.target;
      if (t.id === 'loginEmail') {LOGIN.email = t.value; return;}
      if (t.id === 'refQ') {UI.refQ = t.value; $('#refTable').innerHTML = refTableHTML(); return;}
      if (t.id === 'evalQ') {UI.evalQ = t.value; UI.evalLimit = 100; $('#evalTable').innerHTML = evalTableHTML(); return;}
      if (t.id === 'fsLink') {IMPF.link = t.value; return;}
    });

    document.addEventListener('change', (e) => {
      const t = e.target;
      switch (t.id) {
        case 'fRange':
          F.range = t.value;
          if (F.range === 'custom' && !F.from && !F.to) {const b = {from: addDays(todayISO(), -89), to: todayISO()}; F.from = b.from; F.to = b.to;}
          filtersChanged(true); return;
        case 'fFrom': F.from = ISO_RE.test(t.value) ? t.value : ''; filtersChanged(false); return;
        case 'fTo': F.to = ISO_RE.test(t.value) ? t.value : ''; filtersChanged(false); return;
        case 'fDiv': F.division = t.value; filtersChanged(false); return;
        case 'fPos': F.position = t.value; filtersChanged(false); return;
        case 'fsAll': IMPF.showAll = t.checked; paintView(); return;
        case 'refLow': UI.refLow = t.checked; $('#refTable').innerHTML = refTableHTML(); return;
      }
    });

    // Coming back to the tab after a while fetches what mentors uploaded since.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && ST.auth === 'admin' && DATA && !ST.loading && Date.now() - DATA.at > 5 * 60000) loadAll();
    });

    render();
    startAuth();
  </script>
</body>
