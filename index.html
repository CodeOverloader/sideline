<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sideline — Referee Evaluation Notes</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sideline" />

  <script>
    /* Set the theme before first paint, so someone using the sunlight theme
       never sees a flash of the dark UI. The full theme logic (and the toggle)
       lives in the main script; this only has to agree with it. */
    (function () {
      var mode = 'dark';
      try { mode = JSON.parse(localStorage.getItem('sideline:theme')) || 'dark'; } catch (e) { }
      var prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      var light = mode === 'light' || (mode === 'auto' && !prefersDark);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* ============================================================
   DESIGN TOKENS
   A "token" is just a named value you use everywhere instead of
   repeating a literal. Change --primary once and every button,
   ring, and active marker follows. Whistle is amber; Sideline is
   sky blue on purpose so the two home-screen icons and the two
   apps never get confused at a glance.
   ============================================================ */
    :root {
      /* color-scheme tells the browser to draw native controls (the date and
         time pickers, scrollbars) for a dark page. Without it the calendar
         icon in the date input is black on a near-black field. */
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #14181d;
      --panel2: #1b2127;
      --line: #242c34;
      --ink: #e9eef3;
      --mute: #8b98a5;
      --primary: #38bdf8;
      /* structure, active selection */
      --plus: #34d399;
      /* a strength */
      --minus: #fb923c;
      /* something to work on (orange, not red: not an error) */
      --grass: #0f1d17;
      /* pitch fill */
      --chalk: rgba(233, 238, 243, .22);
      /* text sitting on a filled primary / plus / minus surface */
      --on-primary: #06212e;
      --on-plus: #04241a;
      --on-minus: #251100;
      /* translucent accents, so tints follow the theme too */
      --primary-faint: rgba(56, 189, 248, .04);
      --primary-tint: rgba(56, 189, 248, .1);
      --primary-strong: rgba(56, 189, 248, .16);
      --primary-line: rgba(56, 189, 248, .38);
      --minus-tint: rgba(251, 146, 60, .1);
      --minus-line: rgba(251, 146, 60, .38);
      --glass: rgba(11, 13, 16, .94);
      --scrim: rgba(0, 0, 0, .62);
      --marker-ring: #e9eef3;
      --r: 12px;
      --pad: 14px;
    }

    /* SUNLIGHT theme. A dark screen washes out in direct sun, which is exactly
       where this app gets used. Same structure with the ground inverted, and
       every accent darkened until its text clears WCAG AA on white. */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef2f5;
      --panel: #ffffff;
      --panel2: #f4f7f9;
      --line: #c5d0d9;
      --ink: #0b1218;
      --mute: #4a5764;
      --primary: #0369a1;
      --plus: #047857;
      --minus: #c2410c;
      --grass: #d7ecdf;
      --chalk: rgba(11, 18, 24, .34);
      --on-primary: #ffffff;
      --on-plus: #ffffff;
      --on-minus: #ffffff;
      --primary-faint: rgba(3, 105, 161, .03);
      --primary-tint: rgba(3, 105, 161, .08);
      --primary-strong: rgba(3, 105, 161, .14);
      --primary-line: rgba(3, 105, 161, .45);
      --minus-tint: rgba(194, 65, 12, .07);
      --minus-line: rgba(194, 65, 12, .4);
      --glass: rgba(238, 242, 245, .95);
      --scrim: rgba(11, 18, 24, .45);
      --marker-ring: #0b1218;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.45;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: none;
      background: none
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    /* ---------- app chrome ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: calc(8px + env(safe-area-inset-top)) var(--pad) 0;
    }

    .brandrow {
      display: flex;
      align-items: center;
      gap: 10px
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 26px;
      letter-spacing: .06em;
      line-height: 1
    }

    .brand span {
      color: var(--primary)
    }

    .brandrow .spacer {
      flex: 1
    }

    .iconbtn {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: 17px;
    }

    /* the "now watching" bar: the single most important element in the app.
   Two fields of simultaneous refs is exactly how notes end up on the
   wrong person, so attribution is always on screen. */
    .watching {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 9px 11px;
      border-radius: var(--r);
      background: linear-gradient(90deg, var(--primary-strong), var(--primary-faint));
      border: 1px solid var(--primary-line);
    }

    .watching .who {
      font-weight: 650;
      font-size: 15px;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .watching .sub {
      font-size: 11.5px;
      color: var(--mute);
      line-height: 1.2
    }

    .watching .rolechip {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 700;
      background: var(--primary);
      color: var(--on-primary);
      padding: 3px 7px;
      border-radius: 6px;
    }

    .watching .clk {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: 14px;
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    /* "idle", not "empty": the generic .empty rule further down is for
       empty-state messages and was centring and re-padding this bar. */
    .watching.idle {
      background: var(--panel);
      border-color: var(--line)
    }

    .watching.idle .who {
      color: var(--mute);
      font-weight: 500
    }

    /* ---------- tabs / nav ---------- */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      max-width: 600px;
      margin: 0 auto;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }

    nav button {
      flex: 1;
      padding: 9px 2px 11px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--mute);
      font-size: 11px;
      font-weight: 600;
    }

    nav button .ico {
      font-size: 19px;
      line-height: 1
    }

    nav button[aria-current="page"] {
      color: var(--primary)
    }

    main {
      padding: 0 var(--pad)
    }

    .tab[hidden] {
      display: none
    }

    /* ---------- generic bits ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: var(--pad);
      margin: 12px 0
    }

    h2.sec {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 20px;
      letter-spacing: .04em;
      margin: 18px 0 4px;
      font-weight: 400
    }

    .hint {
      color: var(--mute);
      font-size: 12.5px;
      margin: 2px 0 10px
    }

    label.f {
      display: block;
      margin: 10px 0 0
    }

    label.f>span {
      display: block;
      font-size: 12.5px;
      color: var(--mute);
      margin-bottom: 4px
    }

    input[type=text],
    input[type=email],
    input[type=search],
    input[type=date],
    input[type=time],
    select,
    textarea {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 10px 11px;
      /* iOS Safari zooms the whole page into any input under 16px and does
         not zoom back out, which throws the layout off mid-game. */
      font-size: 16px;
    }

    textarea {
      resize: vertical;
      line-height: 1.5
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row>* {
      flex: 1;
      min-width: 0
    }

    .btn {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px 13px;
      font-weight: 600;
      text-align: center;
      display: block;
      width: 100%;
    }

    .btn.primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.danger {
      color: var(--minus);
      border-color: var(--minus-line)
    }

    .btn:disabled {
      opacity: .45;
      cursor: default
    }

    .btn.sm {
      padding: 8px 10px;
      font-size: 13px;
      font-weight: 600
    }

    .pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--panel2);
      color: var(--mute);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 14px -14px
    }

    .empty {
      color: var(--mute);
      font-size: 13.5px;
      text-align: center;
      padding: 22px 10px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 90;
      background: var(--ink);
      color: var(--bg);
      font-weight: 650;
      font-size: 13.5px;
      padding: 9px 15px;
      border-radius: 20px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
      display: flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100vw - 32px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s, transform .16s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px)
    }

    /* Only a toast that carries an action (Undo) takes taps; a plain one must
       not swallow touches on whatever sits under it. */
    .toast.act.show {
      pointer-events: auto
    }

    .toast button {
      color: inherit;
      font-weight: 800;
      font-size: 13px;
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 6px 2px 6px 12px;
      margin: -6px 0;
      border-left: 1px solid currentColor
    }

    /* ---------- pitch map ---------- */
    .fieldblock {
      margin: 12px 0 18px
    }

    .fieldhead {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .fieldhead .fname {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: .03em
    }

    .fieldhead .fmeta {
      font-size: 12px;
      color: var(--mute)
    }

    .fieldhead .spacer {
      flex: 1
    }

    svg.pitch {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--r);
      background: var(--grass);
      border: 1px solid var(--line);
      touch-action: manipulation
    }

    svg.pitch .mk {
      cursor: pointer
    }

    svg.pitch .mkbg {
      fill: var(--panel2);
      stroke: var(--mute);
      stroke-width: 1.6
    }

    svg.pitch .mk.on .mkbg {
      fill: var(--primary);
      stroke: var(--marker-ring);
      stroke-width: 2.4
    }

    svg.pitch .mk.unnamed .mkbg {
      stroke-dasharray: 3 3
    }

    svg.pitch .mklabel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none
    }

    svg.pitch .mk.on .mklabel {
      fill: var(--on-primary)
    }

    svg.pitch .mkname {
      font-family: Inter, sans-serif;
      font-size: 9px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
      font-weight: 600
    }

    svg.pitch .cnt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 8px;
      font-weight: 700;
      fill: var(--on-plus);
      text-anchor: middle;
      pointer-events: none
    }

    svg.pitch .cntbg {
      fill: var(--plus)
    }

    /* crew rows under each pitch */
    .crew {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .crewrow {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 9px;
    }

    .crewrow.on {
      border-color: var(--primary);
      background: var(--primary-tint)
    }

    .crewrow .slot {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11.5px;
      font-weight: 700;
      color: var(--primary);
      width: 30px;
      flex: none
    }

    .crewrow input {
      background: transparent;
      border: none;
      padding: 4px 0;
      font-weight: 600
    }

    .crewrow input::placeholder {
      color: var(--mute);
      font-weight: 400
    }

    .crewrow .prog {
      font-size: 11px;
      color: var(--mute);
      font-family: 'JetBrains Mono', monospace;
      flex: none;
      text-align: right;
      line-height: 1.25
    }

    .crewrow .go {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 36px;
      padding: 0 12px;
      font-size: 12.5px;
      font-weight: 700;
      background: var(--panel2)
    }

    /* ---------- observe ---------- */
    .minimap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px;
      scrollbar-width: none
    }

    .minimap::-webkit-scrollbar {
      display: none
    }

    .mini {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 9px;
      padding: 6px 9px;
      font-size: 12px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute);
    }

    .mini.on {
      border-color: var(--primary);
      background: var(--primary-strong);
      color: var(--ink)
    }

    .mini .m1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--primary)
    }

    .cats {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: none
    }

    .cats::-webkit-scrollbar {
      display: none
    }

    .cat {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 20px;
      padding: 7px 12px;
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute);
    }

    .cat.on {
      background: var(--ink);
      color: var(--bg);
      border-color: var(--ink)
    }

    .chipgrid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 9px;
      padding: 8px 10px;
      font-size: 13px;
      text-align: left;
      line-height: 1.25;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .chip .m {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: none
    }

    .chip.p {
      border-left: 3px solid var(--plus)
    }

    .chip.p .m {
      color: var(--plus)
    }

    .chip.m- {
      border-left: 3px solid var(--minus)
    }

    .chip.m- .m {
      color: var(--minus)
    }

    /* With the arrow selected every chip logs as "improved", so the chips say
       so instead of still showing their own + or - */
    .chip.b {
      border-left: 3px solid var(--primary)
    }

    .chip.b .m {
      color: var(--primary)
    }

    .chip:active {
      background: var(--panel2)
    }

    .noteadd {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: stretch
    }

    .noteadd input {
      flex: 1
    }

    .polset {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      flex: none
    }

    .polset button {
      width: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 16px;
      background: var(--panel2);
      color: var(--mute)
    }

    .polset button[data-pol="1"][aria-pressed="true"] {
      background: var(--plus);
      color: var(--on-plus)
    }

    .polset button[data-pol="-1"][aria-pressed="true"] {
      background: var(--minus);
      color: var(--on-minus)
    }

    .polset button[data-pol="2"][aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary)
    }

    .timeline {
      margin-top: 12px;
      border-left: 2px solid var(--line);
      padding-left: 11px
    }

    .nrow {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 7px 0;
      border-bottom: 1px solid var(--line)
    }

    .nrow:last-child {
      border-bottom: none
    }

    .nrow .t {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--mute);
      flex: none;
      width: 48px;
      padding-top: 2px
    }

    .nrow .bd {
      flex: 1;
      min-width: 0;
      font-size: 13.5px;
      line-height: 1.35
    }

    .nrow .bd .cn {
      font-size: 11px;
      color: var(--mute);
      display: block
    }

    .nrow .mk2 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: none
    }

    .nrow.p .mk2 {
      color: var(--plus)
    }

    .nrow.n .mk2 {
      color: var(--minus)
    }

    .nrow.b .mk2 {
      color: var(--primary)
    }

    .nrow.o .mk2 {
      color: var(--mute)
    }

    /* Was a ~20px target sitting right beside the "improved" arrow. Deleting
       is now undoable, but it should still be hard to hit by accident. */
    .nrow .del {
      flex: none;
      color: var(--mute);
      width: 36px;
      height: 36px;
      margin: -6px -4px -6px 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: 17px
    }

    .nrow .del:active {
      background: var(--panel2)
    }

    /* ---------- score ---------- */
    .ratewrap {
      margin: 14px 0
    }

    .ratewrap .rlabel {
      font-size: 14px;
      font-weight: 600
    }

    .ratewrap .rhint {
      font-size: 11.5px;
      color: var(--mute);
      margin: 2px 0 7px
    }

    .scale {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .scale .end {
      font-size: 10.5px;
      color: var(--mute);
      flex: none;
      width: 26px
    }

    .scale .end.r {
      text-align: right
    }

    .scale .nums {
      display: flex;
      gap: 6px;
      flex: 1
    }

    .scale .nums button {
      flex: 1;
      padding: 11px 0;
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: 15px;
    }

    .scale .nums button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary)
    }

    .switchrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: 13.5px
    }

    .switchrow input {
      width: auto;
      flex: none;
      width: 20px;
      height: 20px;
      accent-color: var(--primary)
    }

    .yesno {
      display: flex;
      gap: 8px
    }

    .yesno button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 10px;
      font-weight: 700
    }

    .yesno button[aria-pressed="true"][data-move="Yes"] {
      background: var(--plus);
      color: var(--on-plus);
      border-color: var(--plus)
    }

    .yesno button[aria-pressed="true"][data-move="No"] {
      background: var(--minus);
      color: var(--on-minus);
      border-color: var(--minus)
    }

    .charcount {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      color: var(--mute);
      text-align: right;
      margin-top: 4px
    }

    /* ---------- confirm dialog ---------- */
    .dlg {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 22px;

    .dlgbox {

    .dlgbox p {
      margin: 0 0 16px;
      font-size: 14.5px;
      line-height: 1.45
    }

    /* ---------- game picker ---------- */
    .nowgame {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 9px 11px;
      margin: 10px 0
    }

    .nowgame .g1 {
      font-weight: 650;
      font-size: 14px;
      line-height: 1.2
    }

    .nowgame .g2 {
      font-size: 11.5px;
      color: var(--mute);
      line-height: 1.3
    }

    .nowgame .chev {

      color: var(--mute);
      font-size: 18px;

      margin: 14px 0 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: 19px;
      letter-spacing: .04em;
      color: var(--primary)
    }

    .grow {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 11px;
      margin: 6px 0
    }

    .grow.on {
      border-color: var(--primary);
      background: var(--primary-tint)
    }

    .grow.done {
      opacity: .55
    }

    .grow .body {
      flex: 1;
      min-width: 0
    }

    .grow .t1 {
      font-weight: 650;
      font-size: 14px;
      line-height: 1.25
    }

    .grow .t2 {
      font-size: 11.5px;
      color: var(--mute);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .grow .meter {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      color: var(--mute);
      text-align: right;
      flex: none;
      line-height: 1.3
    }

    .grow .meter b {
      color: var(--plus)
    }

    .iconsm {
      flex: none;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: grid;
      place-items: center;
      font-size: 14px;
      color: var(--mute)
    }

    /* ---------- sheet (settings) ---------- */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--scrim);
      backdrop-filter: blur(2px)
    }

    .scrim[hidden] {
      display: none
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 61;
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg);
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      max-height: 88vh;
      /* dvh tracks the mobile browser bars; vh stays as the fallback */
      max-height: 88dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px var(--pad) calc(24px + env(safe-area-inset-bottom));
    }

    .sheet[hidden] {
      display: none
    }

    .grab {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 8px auto 4px
    }

    .sheethead {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 6px
    }

    .sheethead h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: 21px;
      margin: 0;
      font-weight: 400;
      letter-spacing: .03em
    }

    .sheethead .spacer {
      flex: 1
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }

    .seg button {
      flex: 1;
      padding: 9px 0;
      font-weight: 600;
      background: var(--panel2);
      color: var(--mute);
      font-size: 13.5px
    }

    .seg button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary)
    }

    .saved {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 11px;
      margin: 8px 0;
      background: var(--panel)
    }

    .saved .sh {
      display: flex;
      gap: 8px;
      align-items: baseline
    }

    .saved .sh b {
      font-size: 14px
    }

    .saved .sh .spacer {
      flex: 1
    }

    .saved pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Inter, sans-serif;
      font-size: 12.5px;
      color: var(--mute);
      margin: 8px 0 0
    }

    /* ---------- many fields ---------- */
    .fieldstrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: none
    }

    .fieldstrip::-webkit-scrollbar {
      display: none
    }

    .fchip {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 9px;
      padding: 7px 10px;
      font-size: 12.5px;
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute)
    }

    .fchip.on {
      border-color: var(--primary);
      background: var(--primary-strong);
      color: var(--ink)
    }

    .fchip .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10.5px;
      font-weight: 700;
      color: var(--plus)
    }

    .fchip .n.todo {
      color: var(--minus)
    }

    .cov {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 12.5px;
      color: var(--mute)
    }

    .cov b {
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: 15px
    }

    /* ---------- import ---------- */
    .scrollx {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .tbl {
      border-collapse: collapse;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace
    }

    .tbl th,
    .tbl td {
      border: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tbl th {
      color: var(--primary);
      background: var(--panel2);
      font-weight: 700
    }

    .map2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px
    }

    .map2 label.f {
      margin: 0
    }

    .gamerow {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 6px 0
    }

    .gamerow.off {
      opacity: .45
    }

    .gamerow input[type=checkbox] {
      width: 21px;
      height: 21px;
      accent-color: var(--primary);

    }

    .gamerow .g1 {
      font-weight: 650;
      font-size: 13.5px;
      line-height: 1.2
    }

    .gamerow .g2 {
      font-size: 11.5px;
      color: var(--mute);
      line-height: 1.3
    }

    .warn {
      background: var(--minus-tint);
      border: 1px solid var(--minus-line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12.5px;
      margin: 8px 0
    }

    .okbox {
      background: var(--primary-tint);
      border: 1px solid var(--primary-line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: 12.5px;
      margin: 8px 0
    }

    /* compact text button for per-pitch actions (Done / Delete) */
    .minibtn {
      flex: none;
      min-height: 34px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-size: 12.5px;
      font-weight: 650;
      color: var(--ink)
    }

    .minibtn.danger {
      color: var(--minus);
      border-color: var(--minus-line)
    }

    details.more {
      margin-top: 12px
    }

    details.more summary {
      cursor: pointer;
      font-size: 12.5px;
      color: var(--mute);
      padding: 6px 0
    }

    .sheet:focus {
      outline: none
    }

    /* stop the page behind an open sheet from scrolling under your thumb */
    body.locked {
      overflow: hidden
    }

    /* ---------- accounts ---------- */
    /* a dot on the settings cog: green when signed in, orange while pending */
    #openSettings {
      position: relative
    }

    #openSettings[data-acct]::after {
      content: '';
      position: absolute;
      top: 5px;
      right: 5px;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--plus);
      box-shadow: 0 0 0 2px var(--panel)
    }

    #openSettings[data-acct="pending"]::after {
      background: var(--minus)
    }

    .acctline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
      margin-bottom: 6px
    }

    /* ---------- referee profiles ---------- */
    .histline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      align-items: center;
      font-size: 12.5px;
      line-height: 1.35;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--primary);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 8px 0
    }

    .histline>div {
      grid-column: 1;
      min-width: 0
    }

    .histline .minibtn {
      grid-column: 2;
      grid-row: 1 / span 2
    }

    .watching .minibtn {
      margin-left: auto
    }

    .refrow {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 12px;
      margin: 6px 0

    .refrow .rr1 {

      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 14.5px
    }

    .refrow .rr2,
    .refrow .rr3 {
      font-size: 12px;
      color: var(--mute);
      margin-top: 2px
    }

    .refrow .rr3 {
      color: var(--minus)
    }

    .pill.low {
      background: var(--minus-tint);
      color: var(--minus)
    }

    .catrow {
      display: grid;
      grid-template-columns: 84px 1fr 86px;
      align-items: center;
      gap: 8px;
      margin: 7px 0;
      font-size: 13px
    }

    .catrow .bar {
      height: 8px;
      border-radius: 4px;
      background: var(--panel2);
      overflow: hidden
    }

    .catrow .bar i {
      display: block;
      height: 100%;
      background: var(--primary)
    }

    .catrow .bar i.low {
      background: var(--minus)
    }

    .catrow .cv {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12.5px;
      text-align: right;
      white-space: nowrap
    }

    .catrow .cv small {
      color: var(--mute)
    }

    .profhead {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px
    }

    .bigavg {
      font-family: 'JetBrains Mono', monospace;
      font-size: 30px;
      font-weight: 700;
      line-height: 1
    }

    .plist {
      margin: 6px 0 0;
      padding-left: 18px;
      font-size: 13.5px
    }

    .plist li {
      margin: 4px 0
    }

    .muted {
      color: var(--mute)
    }

    details.evald {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 9px 11px;
      margin: 6px 0
    }

    details.evald summary {
      cursor: pointer;
      font-size: 13px;
      line-height: 1.45
    }

    details.evald pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Inter, sans-serif;
      font-size: 12.5px;
      color: var(--mute);
      margin: 8px 0 0
    }
  </style>
</head>

<body>

  <header>
    <div class="brandrow">
      <div class="brand">SIDE<span>LINE</span></div>
      <div class="spacer"></div>
      <button class="iconbtn" id="themeToggle" title="Switch to sunlight theme"
        aria-label="Switch to sunlight theme">&#9728;&#xFE0E;</button>
      <button class="iconbtn" id="openPicker" title="Choose a game" aria-label="Choose a game">&#9776;</button>
      <button class="iconbtn" id="openForm" title="Open the Google Form" aria-label="Open the Google Form">&#9873;</button>
      <button class="iconbtn" id="openSettings" title="Settings" aria-label="Settings">&#9881;</button>
    </div>
    <div class="watching idle" id="watching" aria-live="polite">
      <div style="min-width:0">
        <div class="who">No referee selected</div>
        <div class="sub">Pick a position on a field to start</div>
      </div>
    </div>
  </header>

  <main>
    <!-- ============ FIELDS TAB: the pitch map ============ -->
    <section class="tab" id="tab-fields">
      <div id="fieldsWrap"></div>
    </section>

    <!-- ============ OBSERVE TAB ============ -->
    <section class="tab" id="tab-observe" hidden>
      <div id="minimap"></div>
      <div id="observeBody"></div>
    </section>

    <!-- ============ SCORE TAB ============ -->
    <section class="tab" id="tab-score" hidden>
      <div id="scoreBody"></div>
    </section>

    <!-- ============ SAVED TAB ============ -->
    <!-- ============ REFS TAB: referee profiles ============ -->
    <section class="tab" id="tab-refs" hidden>
      <div id="refsBody"></div>
    </section>

    <section class="tab" id="tab-saved" hidden>
      <h2 class="sec">Saved evaluations</h2>
      <div id="savedBody"></div>
    </section>
  </main>

  <nav aria-label="Sections">
    <button data-tab="fields" aria-current="page"><span class="ico" aria-hidden="true">&#9917;</span>Fields</button>
    <button data-tab="observe"><span class="ico" aria-hidden="true">&#9998;</span>Observe</button>
    <button data-tab="score"><span class="ico" aria-hidden="true">&#9878;</span>Score</button>
    <button data-tab="refs"><span class="ico" aria-hidden="true">&#128101;</span>Refs</button>
    <button data-tab="saved"><span class="ico" aria-hidden="true">&#128193;</span>Saved</button>
  </nav>

  <div class="scrim" id="scrim" hidden></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1" hidden>
    <div class="grab"></div>
    <div class="sheethead">
      <h3 id="sheetTitle">Settings</h3>
      <div class="spacer"></div>
      <button class="btn sm ghost" style="width:auto" id="closeSheet">Done</button>
    </div>
    <div id="sheetBody"></div>
  </div>

  <div class="dlg" id="dlg" role="alertdialog" aria-modal="true" aria-describedby="dlgMsg" hidden>
    <div class="dlgbox">
      <p id="dlgMsg"></p>
      <div class="row">
        <button class="btn sm ghost" id="dlgNo">Cancel</button>
        <button class="btn sm danger" id="dlgYes">Delete</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"><span id="toastMsg"></span><button
      id="toastAct" hidden></button></div>

  <script>
    "use strict";
    /* ============================================================
       SIDELINE — field-side notes for LSSA referee evaluations
       ------------------------------------------------------------
       Mirrors the "Referee Evaluation" Google Form, but built around
       the actual job: one mentor watching several referees across two
       fields at the same time. Each referee is a separate form
       submission, so each referee owns their own notes, ratings,
       move-up answer and comments.
       ============================================================ */

    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSd-Hc5iO0ygjxnme1FirULuMauqI1JFCG_vYob_pYAfAZZPOg/viewform';

    /* ---------- mentor accounts (optional) ----------
       Fill in both values to switch on sign-in, shared evaluations and
       league-wide referee profiles. Leave either empty and Sideline stays
       the offline, single-device app it always was.
       Both values are PUBLIC by design: the database's access rules protect
       the data, not this key. Use the "publishable" key (sb_publishable_...).
       NEVER put a secret key (sb_secret_...) or the legacy service_role key
       here: those bypass every access rule. Setup steps: README.md. */
    const SUPABASE_URL = 'https://kgilrxcboicdxjbxldgw.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VuoFX_hWHaODI-BBWa0uiQ_Uduxp-TQ';
    const ACCOUNTS_ON = !!(SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY) && !/^sb_secret_/.test(SUPABASE_PUBLISHABLE_KEY);
    // Pinned with a Subresource Integrity hash: if the CDN ever serves
    // different bytes for this version, the browser refuses to run them.
    const SUPABASE_JS = {
      src: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
      integrity: 'sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP'
    };

    /* Field and division lists copied verbatim from the form's dropdowns,
       in the form's order. Matching exactly means the value you pick here
       is the value you pick there — no translating in your head at 9pm. */
    const FIELDS = ['Tigers - Field 1', 'Titans - Field 1', 'Broncos - Field 1', 'Field 2A', 'Field 2B',
      'Field 2C', 'Field 3A', 'Field 3B', 'Field 3C', 'Field 4', 'Field 5', 'Field 6', 'Field 7', 'Field 8',
      'Field 9', 'Field 10', 'Field 11A', 'Field 11B', 'Field 12A', 'Field 12B'];

    /* Field 1 is not one pitch - it is Tigers, Titans and Broncos. Same for the
       lettered complexes. When you are monitoring you cover every field with a
       game on it, so these groups exist to add a whole complex in one tap
       instead of picking sub-pitches one at a time. */
    const FIELD_GROUPS = [
      {label: 'Field 1', members: ['Tigers - Field 1', 'Titans - Field 1', 'Broncos - Field 1']},
      {label: 'Field 2', members: ['Field 2A', 'Field 2B', 'Field 2C']},
      {label: 'Field 3', members: ['Field 3A', 'Field 3B', 'Field 3C']},
      {label: 'Field 11', members: ['Field 11A', 'Field 11B']},
      {label: 'Field 12', members: ['Field 12A', 'Field 12B']},
    ];

    /* Chips and pitch headers need a short name: "Tigers - Field 1" reads as
       "Tigers", "Field 2A" as "2A". */
    /* Tigers, Titans and Broncos are each TWO pitches sharing one entry on the
       form's dropdown, with a single referee on each. So "Tigers - Field 1" at
       8:00 is two games and two centers, and the form has no way to say which
       pitch - both submissions carry the identical Field value.
    
       That is handled with a `sub` on each field entry: an internal A/B label
       used everywhere in the app and deliberately absent from the block you
       paste into the form. Default crew is 1, since each pitch has one official. */
    const DIVISION_RULES = [
      // Matched in order against the sheet's division name.
      // pitches:2 means two simultaneous games sharing one field, one official each.
      {re: /^pre-?k/i, form: 'PK', pitches: 2, crew: 1},
      {re: /^kinder/i, form: 'Kindergarten', pitches: 2, crew: 1},
      {re: /^1st/i, form: '1st', pitches: 1, crew: 2},
      {re: /^2nd/i, form: '2nd', pitches: 1, crew: 2},
      {re: /^3rd/i, form: '3rd', pitches: 1, crew: 3},
      {re: /^4th/i, form: '4th', pitches: 1, crew: 3},
      {re: /^5th/i, form: '5th', pitches: 1, crew: 3},
      {re: /^6th/i, form: '6th', pitches: 1, crew: 3},
      {re: /^middle\s*school/i, form: 'Middle School', pitches: 1, crew: 3},
      {re: /^high\s*school/i, form: 'High School', pitches: 1, crew: 3},
      {re: /^adult/i, form: 'Adult', pitches: 1, crew: 3},
    ];
    /* The schedule fills CR 1 + CR 2 with no ARs for Pre-K, Kindergarten, 1st AND
       2nd grade - the rows are indistinguishable. Only the division says whether
       that means two pitches with one referee each (Pre-K, Kindergarten) or one
       game with a dual-referee crew (1st, 2nd). So splitting keys off division,
       never off "there are no ARs". */
    function divisionRule(v) {
      const t = String(v || '');
      return DIVISION_RULES.find(r => r.re.test(t)) || null;
    }

    const SUBS = ['A', 'B', 'C', 'D'];

    /* Compact kickoff for chips: "8a", "9:15a", "6p". Monitoring one pitch
       all morning puts the same field on the strip three or four times, so
       the chip has to carry the time or every chip reads "2A". */
    function shortTime(hm) {
      if (!hm) return '';
      let [h, m] = hm.split(':').map(Number);
      const suffix = h >= 12 ? 'p' : 'a';
      h = h % 12 || 12;
      return m ? `${h}:${String(m).padStart(2, '0')}${suffix}` : `${h}${suffix}`;
    }

    /* Only appends the time when that field actually appears more than once
       on the board - no point cluttering a chip that is already unique. */
    function fieldLabel(f) {
      const base = shortField(f.name);
      // Count distinct kickoffs for this name, not entries: the two Tigers pitches
      // at 8:00 are one group and must not make the chip read "Tigers 8a" twice.
      const kickoffs = new Set(S.fields.filter(x => x.name === f.name).map(groupKey)).size;
      return kickoffs > 1 && f.time ? `${base} ${shortTime(f.time)}` : base;
    }
    /* "Tigers A" for display, never for the form. */
    function pitchLabel(f) {
      return f.sub ? `${shortField(f.name)} ${f.sub}` : shortField(f.name);
    }

    function shortField(name) {
      if (!name) return 'Field';
      const t = name.match(/^(Tigers|Titans|Broncos)/i);
      return t ? t[1] : name.replace(/^Field\s*/i, '');
    }

    const DIVISIONS = ['PK', 'Kindergarten', '1st', '2nd', '3rd', '4th', '5th', '6th', 'Middle School', 'High School', 'Adult'];

    /* The six rated questions, in form order, plus a seventh bucket that
       feeds COMMENTS only. `rated:false` is what keeps "general" out of
       the 1-4 scoring UI while still letting it carry notes. */
    const CATS = [
      {id: 'appearance', label: 'Professional appearance', short: 'Appearance', rated: true},
      {id: 'workrate', label: 'Workrate - position/movement', short: 'Workrate', rated: true},
      {id: 'commands', label: 'Verbal and non-verbal commands', short: 'Commands', rated: true},
      {id: 'teamwork', label: 'Teamwork', short: 'Teamwork', rated: true},
      {id: 'fouls', label: 'Recognition of fouls', short: 'Fouls', rated: true},
      {id: 'offsides', label: 'Recognition of offsides', short: 'Offsides', rated: true},
      {id: 'general', label: 'Game management and other', short: 'General', rated: false},
    ];
    const RATED = CATS.filter(c => c.rated);

    /* Quick-tap observations. pol = polarity: +1 strength, -1 work on.
       `pos` restricts a chip to one role so an AR never has to scroll past
       eight center-referee chips to reach the flag ones. */
    const CHIPS = [
      // appearance
      ['appearance', 1, 'Looks confident, good posture'],
      ['appearance', -1, 'No coin for captains'],
      ['appearance', -1, 'Shirt untucked'],
      ['appearance', -1, 'Wrong socks'],
      ['appearance', -1, 'Wrong patch'],
      ['appearance', -1, 'Twirling whistle'],
      ['appearance', -1, 'Holding gamecards'],

      // workrate - CR
      ['workrate', 1, 'Good wide diagonal', 'CR'],
      ['workrate', 1, 'Close enough to ball', 'CR'],
      ['workrate', 1, 'Adjusted for the counterattack', 'CR'],
      ['workrate', 1, 'Good position on the corner kick', 'CR'],
      ['workrate', 1, 'Game ran behind', 'CR'],
      ['workrate', -1, 'Ball-watching from the center circle', 'CR'],
      ['workrate', -1, 'Too far from play', 'CR'],
      ['workrate', -1, 'Frequent walking', 'CR'],
      ['workrate', -1, 'Jogging when a sprint was needed', 'CR'],
      // workrate - AR
      ['workrate', 1, 'Even with the second-to-last defender', 'AR'],
      ['workrate', 1, 'Sprinted to the goal line on the shot', 'AR'],
      ['workrate', 1, 'Stayed off the touchline', 'AR'],
      ['workrate', -1, 'Trailing the second-to-last defender', 'AR'],
      ['workrate', -1, 'Drifted ahead of the line', 'AR'],
      ['workrate', -1, 'Stopped at the 18 on the breakaway', 'AR'],
      ['workrate', -1, 'Not square to the field', 'AR'],
      // commands
      ['commands', 1, 'Whistle strong'],
      ['commands', 1, 'Signals clear and long'],
      ['commands', 1, 'Talked players through restarts'],
      ['commands', 1, 'Good preventive talk'],
      ['commands', -1, 'Whistle too quiet'],
      ['commands', -1, 'Poor signals'],
      ['commands', -1, 'Infrequent signals'],
      ['commands', -1, 'Body language looked unsure'],

      ['commands', 1, 'Mirrored the center correctly', 'AR'],
      ['commands', -1, 'Flag waved or bent', 'AR'],
      // teamwork
      ['teamwork', 1, 'Ran a real pregame with the crew'],
      ['teamwork', 1, 'Eye contact before restarts'],
      ['teamwork', 1, 'Backed the partner up'],
      ['teamwork', 1, 'Checked with the AR on a close call', 'CR'],

      ['teamwork', -1, 'No help on substitutions'],
      // fouls
      ['fouls', 1, 'Same standard for both teams'],

      ['fouls', 1, 'Correct restart spot'],
      ['fouls', 1, 'Handled persistent fouling'],
      ['fouls', 1, 'Card fit the offense'],
      ['fouls', -1, 'Does not call fouls'],
      ['fouls', -1, 'Missed an obvious foul'],
      ['fouls', -1, 'Wrong restart, direct vs indirect'],
      // offsides
      ['offsides', 1, 'Level with the second-to-last defender'],
      ['offsides', 1, 'Waited to judge involvement'],

      ['offsides', -1, 'Flagged early, player was level'],
      ['offsides', -1, 'Missed a clear offside'],
      ['offsides', -1, 'Flagged on a throw-in'],
      ['offsides', 1, 'Supported the AR on a close flag', 'CR'],
      ['offsides', -1, 'Overruled a correct flag', 'CR'],
      // general
      ['general', 1, 'Handled coach dissent calmly'],
      ['general', 1, 'Good pregame with the coaches'],
      ['general', 1, 'Managed the injury correctly'],
      ['general', 1, 'Kept accurate time'],
      ['general', 1, 'Recovered well after a mistake'],
      ['general', -1, 'Rattled by sideline pressure'],
      ['general', -1, 'Substitution procedure shaky'],
      ['general', -1, 'Clock or timing confusion'],
      ['general', -1, 'Needs to slow the decision down'],
      ['general', -1, 'Over-explaining to coaches'],
    ].map(([cat, pol, text, pos]) => ({cat, pol, text, pos: pos || null}));

    /* ============================================================
       STORAGE
       ------------------------------------------------------------
       localStorage is the browser's simple key/value box on disk,
       scoped to one origin (codeoverloader.github.io) and one browser.
       It survives closing the app, which is what we need: you should be
       able to lock your phone between games without losing a session.
    
       Why the try/catch and the in-memory fallback: localStorage throws
       rather than returns null in a few real situations - Safari private
       browsing, storage quota exceeded, and inside some embedded preview
       frames. An unhandled throw at startup would blank the whole app.
       The fallback keeps everything working for the current session and
       only loses data on reload, which is a survivable failure. This
       shape - one interface, swap the thing behind it - is what people
       mean by "adapter": callers never learn which one they got.
       ============================================================ */
    const mem = new Map();
    let persistent = true;
    const store = {
      get(k) {
        try {const v = localStorage.getItem(k); return v === null ? undefined : JSON.parse(v);}
        catch (e) {persistent = false; return mem.get(k);}
      },
      set(k, v) {
        try {localStorage.setItem(k, JSON.stringify(v));}
        catch (e) {persistent = false; mem.set(k, v);}
      }
    };

    const uid = () => Math.random().toString(36).slice(2, 9);
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function nowHM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    function prettyDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${Number(m)}/${Number(d)}/${y}`;        // form uses MM/DD/YYYY
    }
    function pretty12(hm) {
      if (!hm) return '';
      let [h, m] = hm.split(':').map(Number);
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2, '0')} ${ap}`;
    }
    /* Epoch ms -> "10:42 AM", for stamping notes and saves. */
    function clockOf(ts) {
      const d = new Date(ts);
      return pretty12(`${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`);
    }
    /* Epoch ms -> "today", "yesterday", "3 days ago", or a plain date. */
    function ago(ts) {
      const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const days = Math.round((startOf(new Date()) - startOf(new Date(ts))) / 864e5);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 14) return `${days} days ago`;
      return new Date(ts).toLocaleDateString();
    }

    /* ---------- theme ----------
       'dark' is the original look, 'light' the sunlight theme, 'auto' follows
       the phone. The script in <head> already set data-theme before first
       paint; this keeps it, the status-bar color and the header toggle in step. */
    const THEMES = [['dark', 'Dark'], ['light', 'Sunlight'], ['auto', 'Match phone']];
    const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    let themeMode = store.get('sideline:theme') || 'dark';
    function isLight() {
      return themeMode === 'light' || (themeMode === 'auto' && !(darkQuery && darkQuery.matches));
    }
    function applyTheme() {
      const light = isLight();
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#eef2f5' : '#0b0d10');
      const btn = document.getElementById('themeToggle');
      if (btn) {
        const label = light ? 'Switch to dark theme' : 'Switch to sunlight theme';
        btn.innerHTML = light ? '&#9790;&#xFE0E;' : '&#9728;&#xFE0E;';
        btn.title = label; btn.setAttribute('aria-label', label);
      }
    }
    function setTheme(mode) {
      themeMode = THEMES.some(([k]) => k === mode) ? mode : 'dark';
      store.set('sideline:theme', themeMode);
      applyTheme();
    }
    if (darkQuery && darkQuery.addEventListener) {
      darkQuery.addEventListener('change', () => {if (themeMode === 'auto') applyTheme();});
    }

    /* ============================================================
       STATE
       ------------------------------------------------------------
       One session = one date, one mentor, up to three fields. A field
       holds its own crew. A crew member ("ref") holds
       everything that becomes one Google Form submission.
       ============================================================ */
    function newRef(slot, role) {
      return {
        id: uid(), slot, role,            // slot = CR/AR1/AR2 label, role = CR or AR for the form
        name: '', notes: [],
        ratings: Object.fromEntries(RATED.map(c => [c.id, null])),
        noOffsides: false, moveUp: null,
        comments: '', commentsEdited: false, submitted: false
      };
    }
    function newField(name) {
      return {
        // Kickoff starts EMPTY, not nowHM(). A made-up time is indistinguishable
        // from a real one, which broke import matching (a hand-added field looked
        // like it kicked off whenever you opened the app, so importing that same
        // game could not match it and created a duplicate instead).
        id: uid(), name: name || '', sub: '', division: '', time: '', crewSize: 3, done: false,
        refs: [newRef('CR', 'CR'), newRef('AR1', 'AR'), newRef('AR2', 'AR')]
      };
    }
    function blankUI() {
      return {tab: 'fields', cat: 'workrate', pol: 1, draftText: '', fieldId: null, showDone: false, keepDate: null};
    }
    function blankSession() {
      return {
        mentor: store.get('sideline:mentor') || '',
        date: todayISO(),
        fields: [newField('')],
        activeRefId: null,
        ui: blankUI()
      };
    }

    let S = store.get('sideline:session') || blankSession();
    let HIST = store.get('sideline:history') || [];
    if (!Array.isArray(HIST)) HIST = [];

    /* Migration guard: if a stored session predates a field added later,
       fill the gap rather than crash on undefined. Cheap insurance for an
       app whose data lives on your phone across versions - and it is also
       the gate every restored backup passes through, since a backup file
       may come from an older build. */
    function normalize() {
      if (!S || typeof S !== 'object') S = blankSession();
      S.ui = {...blankUI(), ...(S.ui || {})};
      if (typeof S.mentor !== 'string') S.mentor = store.get('sideline:mentor') || '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(S.date || '')) S.date = todayISO();
      if (!Array.isArray(S.fields) || !S.fields.length) S.fields = [newField('')];
      S.fields.forEach(f => {
        if (!Array.isArray(f.refs)) f.refs = [];
        f.refs.forEach(r => {
          r.ratings = {...Object.fromEntries(RATED.map(c => [c.id, null])), ...(r.ratings || {})};
          if (!Array.isArray(r.notes)) r.notes = [];
          if (typeof r.name !== 'string') r.name = '';
          if (typeof r.comments !== 'string') r.comments = '';
        });
        relabelSlots(f);
      });
    }
    normalize();

    /* A session restored from storage keeps the date it was created on, so the
       next Saturday the import's "today only" filter matched nothing and new
       saves carried last week's date. An empty session just rolls forward; one
       holding games gets a banner on the Fields tab asking what to do. */
    function sessionHasData() {
      return S.fields.some(f => f.name || f.refs.some(r => r.name.trim() || r.notes.length));
    }
    if (S.date !== todayISO() && !sessionHasData()) S.date = todayISO();

    let saveTimer = null;
    function save() {
      // Debounce: typing a name fires an input event per keystroke, and
      // JSON.stringify + a disk write on every one is wasteful. Collapse
      // bursts into a single write 250ms after you stop.
      clearTimeout(saveTimer);
      saveTimer = setTimeout(() => {
        store.set('sideline:session', S);
        store.set('sideline:history', HIST);
        if (S.mentor) store.set('sideline:mentor', S.mentor);
      }, 250);
    }

    /* Adds one pitch, reusing a blank placeholder if there is one. */
    function addFieldEntry(name, sub, crewSize) {
      if (S.fields.some(f => f.name === name && (f.sub || '') === (sub || ''))) return null;
      const empty = S.fields.find(f => !f.name && !f.refs.some(r => r.name || r.notes.length));
      const f = empty || newField('');
      f.name = name; f.sub = sub || '';
      const want = Math.min(Math.max(crewSize || 3, 1), 3);
      const labels = want === 1 ? ['CR'] : want === 2 ? ['CR', 'AR1'] : ['CR', 'AR1', 'AR2'];
      f.refs = labels.map(l => newRef(l, l.startsWith('AR') ? 'AR' : 'CR'));
      f.crewSize = want;
      relabelSlots(f);
      if (!empty) S.fields.push(f);
      return f;
    }

    /* Deleting a game is now always available, guarded by a dialog rather than
       by hiding the button. Hiding it was the old "hardcoded limiter" - you
       could not clear a finished game without emptying it by hand first. */
    function deleteGame(fid, after) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      const notes = f.refs.reduce((a, r) => a + r.notes.length, 0);
      const named = f.refs.filter(r => r.name.trim()).length;
      const what = `${pitchLabel(f) || 'This game'}${f.time ? ' at ' + pretty12(f.time) : ''}`;
      const detail = notes ? ` It has ${notes} note${notes === 1 ? '' : 's'} on ${named} referee${named === 1 ? '' : 's'}.`
        : '';
      askConfirm(`Delete ${what}?${detail} Evaluations you already saved are kept.`, 'Delete', () => {
        S.fields = S.fields.filter(x => x.id !== fid);
        if (!S.fields.length) S.fields.push(newField(''));
        if (!activePair()) S.activeRefId = null;
        if (!S.fields.some(x => x.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0].id;
        save();
        if (after) after(); else renderAll();
        flash('Game deleted');
      });
    }
    function toggleDone(fid) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      f.done = !f.done;
      save(); renderAll();
      flash(f.done ? 'Marked done' : 'Back on the list');
    }
    function gameSummary(f) {
      const refs = f.refs;
      const notes = refs.reduce((a, r) => a + r.notes.length, 0);
      const rated = refs.filter(r => RATED.every(c => r.ratings[c.id] != null)).length;
      const names = refs.map(r => r.name.trim()).filter(Boolean);
      return {
        notes, rated, names, total: refs.length,
        complete: refs.length > 0 && refs.every(r => r.submitted)
      };
    }

    /* ---------- lookups ---------- */
    function allRefs() {return S.fields.flatMap(f => f.refs.map(r => ({field: f, ref: r})));}
    function activePair() {return allRefs().find(x => x.ref.id === S.activeRefId) || null;}
    function refDisplay(r) {return r.name.trim() || `Unnamed ${r.slot}`;}

    /* ---------- crew size ----------
       Rebuilding the crew must never silently delete notes you already
       took, so shrinking keeps the extra slots' data until you confirm.
       Slot roles default to the common setup and stay editable: 2-man is
       sometimes CR + AR and sometimes dual CR, and the form only offers
       CR or AR, so the role is what gets submitted. */
    /* Slot labels are derived, never stored as truth: the label has to
       follow the role or the pitch map lies to you. A dual-referee 2-man
       crew reads CR1 / CR2, a standard crew reads CR / AR1 / AR2, and a
       lone AR is just AR. Called after anything that changes roles. */
    function relabelSlots(f) {
      let cr = 0, ar = 0;
      const crTotal = f.refs.filter(r => r.role === 'CR').length;
      const arTotal = f.refs.filter(r => r.role === 'AR').length;
      f.refs.forEach(r => {
        if (r.role === 'CR') {cr++; r.slot = crTotal > 1 ? 'CR' + cr : 'CR';}
        else {ar++; r.slot = arTotal > 1 ? 'AR' + ar : 'AR';}
      });
    }

    function setCrewSize(fid, n) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      const doomed = f.refs.slice(n).filter(r => r.notes.length || r.name.trim());
      if (doomed.length) {
        askConfirm(`Dropping to ${n} official${n === 1 ? '' : 's'} removes ${doomed.length} referee(s) with data on them.`,
          'Remove', () => {applyCrewSize(f, n); renderSheet();});
        return;
      }
      applyCrewSize(f, n);
    }
    function applyCrewSize(f, n) {
      const labels = n === 1 ? ['CR'] : n === 2 ? ['CR', 'AR1'] : ['CR', 'AR1', 'AR2'];
      const kept = f.refs.slice(0, n);
      while (kept.length < n) kept.push(newRef(labels[kept.length], labels[kept.length].startsWith('AR') ? 'AR' : 'CR'));
      kept.forEach((r, i) => {r.role = labels[i].startsWith('AR') ? 'AR' : 'CR';});
      f.refs = kept; f.crewSize = n;
      relabelSlots(f);
      if (!activePair()) S.activeRefId = null;
      save(); renderAll();
    }

    /* ============================================================
       PITCH MAP
       ------------------------------------------------------------
       Drawn as inline SVG rather than an image so the markers can be
       real, tappable, labelled elements that recolor with state.
       viewBox is a coordinate system, not pixels: everything below is
       drawn in a fixed 320x210 space and the browser scales it to
       whatever width the phone has. That is why this works on any
       screen without a single media query.
    
       Marker geometry follows ROLE, not slot number, because that is
       what is physically true: an AR stands on the touchline in one
       half, a center works the middle. A dual-referee 2-man crew gets
       two diagonal interior markers automatically.
       ============================================================ */
    const AR_SPOTS = [[100, 26], [220, 182], [226, 26], [94, 182]];   // touchlines, alternating halves
    const CR_SPOTS_1 = [[160, 104]];
    const CR_SPOTS_2 = [[106, 146], [214, 62]];                   // opposite diagonals, clear of the center circle

    function layoutCrew(field) {
      const crs = [], ars = [];
      field.refs.forEach((r, i) => (r.role === 'AR' ? ars : crs).push({r, i}));
      const crSpots = crs.length >= 2 ? CR_SPOTS_2 : CR_SPOTS_1;
      const out = [];
      crs.forEach((x, k) => out.push({...x, xy: crSpots[k % crSpots.length]}));
      ars.forEach((x, k) => out.push({...x, xy: AR_SPOTS[k % AR_SPOTS.length]}));
      return out;
    }

    function marker(ref, x, y) {
      const on = ref.id === S.activeRefId;
      const n = ref.notes.length;
      const first = (ref.name.trim().split(/\s+/)[0] || '').slice(0, 10);
      const cls = `mk${on ? ' on' : ''}${ref.name.trim() ? '' : ' unnamed'}`;
      const nameY = y > 150 ? y - 24 : y + 30;
      return `<g class="${cls}" data-pick="${ref.id}" role="button" tabindex="0"
             aria-label="Take notes on ${esc(refDisplay(ref))}">
    <circle cx="${x}" cy="${y}" r="27" fill="transparent"></circle>
    <circle class="mkbg" cx="${x}" cy="${y}" r="17"></circle>
    <text class="mklabel" x="${x}" y="${y + 4}">${esc(ref.slot)}</text>
    ${first ? `<text class="mkname" x="${x}" y="${nameY}">${esc(first)}</text>` : ''}
    ${n ? `<circle class="cntbg" cx="${x + 14}" cy="${y - 14}" r="8"></circle>
           <text class="cnt" x="${x + 14}" y="${y - 11}">${n}</text>` : ''}
  </g>`;
    }

    function pitchSVG(field) {
      const marks = layoutCrew(field).map(({r, xy}) => marker(r, xy[0], xy[1])).join('');
      return `<svg class="pitch" viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg" aria-label="Pitch map">
    <g stroke="var(--chalk)" stroke-width="1.4" fill="none">
      <rect x="16" y="26" width="288" height="156" rx="2"></rect>
      <line x1="160" y1="26" x2="160" y2="182"></line>
      <circle cx="160" cy="104" r="26"></circle>
      <rect x="16" y="60" width="40" height="88"></rect>
      <rect x="264" y="60" width="40" height="88"></rect>
      <rect x="16" y="82" width="15" height="44"></rect>
      <rect x="289" y="82" width="15" height="44"></rect>
    </g>
    <circle cx="160" cy="104" r="2" fill="var(--chalk)"></circle>
    <rect x="10" y="90" width="6" height="28" fill="var(--chalk)"></rect>
    <rect x="304" y="90" width="6" height="28" fill="var(--chalk)"></rect>
    ${marks}
  </svg>`;
    }

    function refProgress(r) {
      const done = RATED.filter(c => r.ratings[c.id] != null).length;
      return {notes: r.notes.length, done, total: RATED.length, ready: done === RATED.length && r.moveUp && r.comments.trim()};
    }

    /* A group is every pitch that shares a field name and kickoff - i.e. the two
       Tigers games at 8:00. The strip shows one chip per group and the view shows
       all of its pitches, instead of eight near-identical chips for one morning. */
    function groupKey(f) {return (f.name || '') + '|' + (f.time || '');}
    function fieldGroups() {
      const m = new Map();
      S.fields.forEach(f => {
        const k = groupKey(f);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(f);
      });
      return [...m.values()].map(list =>
        list.slice().sort((a, b) => (a.sub || '').localeCompare(b.sub || '')));
    }
    function groupOf(field) {
      return fieldGroups().find(g => g.some(x => x.id === field.id)) || [field];
    }

    function selectedField() {
      if (!S.fields.some(f => f.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0] ? S.fields[0].id : null;
      return S.fields.find(f => f.id === S.ui.fieldId) || null;
    }

    /* With one or two fields you can stack every pitch. Monitoring a full
       slate is eight or ten, and stacking those means scrolling past six
       pitches to reach the one in front of you. So: a strip of every field
       across the top, one pitch shown at a time, and a coverage line that
       answers the question you actually have at 10am - who have I not
       watched yet. */
    /* The horizontal strip failed in use: thirteen chips with near-identical
       names and times, most off-screen, and rebuilding it with innerHTML reset
       its scroll to the far left on every tap - which is why selecting a 1pm
       game threw you back to 8am. Replaced by a full-screen picker grouped by
       kickoff, where each row carries the division and the referee names, i.e.
       the things that actually tell two games apart. Nothing scrolls sideways. */
    function visibleGames() {
      return S.fields.filter(f => S.ui.showDone || !f.done);
    }
    /* The two lines that identify a game everywhere it is listed. One helper,
       so an edit in Settings can refresh every visible copy in place. */
    function gameHeadHTML(f, withTime) {
      const g = gameSummary(f);
      const when = withTime && f.time ? ' &middot; ' + esc(pretty12(f.time)) : '';
      return `<div class="t1">${esc(pitchLabel(f) || 'Field not set')}${when}${f.done ? ' &check;' : ''}</div>
      <div class="t2">${esc(f.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no referees named'}</div>`;
    }
    function gameRow(f, opts) {
      const g = gameSummary(f);
      const on = f.id === S.ui.fieldId;
      const doneLabel = f.done ? 'Put back on the list' : 'Mark done';
      return `<div class="grow${on ? ' on' : ''}${f.done ? ' done' : ''}">
    <button style="flex:1;min-width:0;text-align:left;background:none" data-game="${f.id}" data-gamehead="${f.id}">
      ${gameHeadHTML(f, false)}
    </button>
    <div class="meter">${g.notes ? `<b>${g.notes}</b> note${g.notes === 1 ? '' : 's'}` : 'no notes'}<br>${g.rated}/${g.total} rated</div>
    ${opts && opts.actions ? `
      <button class="iconsm" data-done="${f.id}" title="${doneLabel}" aria-label="${doneLabel}">${f.done ? '&#8634;' : '&check;'}</button>
      <button class="iconsm" data-delgame="${f.id}" title="Delete this game" aria-label="Delete this game">&times;</button>` : ''}
  </div>`;
    }

    function renderPicker() {
      const games = visibleGames();
      const doneCount = S.fields.filter(f => f.done).length;
      const slots = new Map();
      games.forEach(f => {
        const k = f.time || '';
        if (!slots.has(k)) slots.set(k, []);
        slots.get(k).push(f);
      });
      const fieldIdx = (n) => {const i = FIELDS.indexOf(n); return i < 0 ? 999 : i;};
      const body = [...slots.entries()].sort((a, b) => (a[0] || '99:99').localeCompare(b[0] || '99:99'))
        .map(([time, list]) => {
          list.sort((a, b) => fieldIdx(a.name) - fieldIdx(b.name) || (a.sub || '').localeCompare(b.sub || ''));
          return `<div class="slothead">${time ? esc(pretty12(time)) : 'No kickoff set'}</div>
        ${list.map(f => gameRow(f, {actions: true})).join('')}`;
        }).join('');

      $('#sheetBody').innerHTML = `
    ${games.length ? body : `<div class="empty">${doneCount ? 'Every game is marked done.'
          : 'Nothing to show. Import the day\'s schedule to get started.'}</div>`}
    ${doneCount ? `<button class="btn sm ghost" id="toggleDone" style="margin-top:14px">
      ${S.ui.showDone ? 'Hide' : 'Show'} ${doneCount} finished game${doneCount === 1 ? '' : 's'}</button>` : ''}
    <div class="row" style="margin-top:10px">
      <button class="btn sm primary" id="openImport">Import schedule</button>
      <button class="btn sm ghost" id="openSettings2">Settings</button>
    </div>`;
    }

    /* The bar that opens the picker, shown on both working tabs. */
    function nowGameBar() {
      const f = selectedField();
      if (!f) return '';
      const g = gameSummary(f);
      // data-openpicker, not id="openPicker": this bar is rendered on two tabs at
      // once (hidden tabs keep their markup) and the header button owns that id.
      return `<button class="nowgame" data-openpicker="1" aria-haspopup="dialog">
    <div style="min-width:0">
      <div class="g1">${esc(pitchLabel(f) || 'Pick a game')}${f.time ? ' &middot; ' + esc(pretty12(f.time)) : ''}</div>
      <div class="g2">${esc(f.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no referees named'}</div>
    </div>
    <span class="chev">&#9662;</span>
  </button>`;
    }

    function renderFields() {
      const f = selectedField();
      /* First run (or a cleared session) used to draw a blank "Field not set"
         pitch and pop Settings open on every launch. A setup card asks for the
         two things that matter instead: your name and the schedule. */
      if (!f || !sessionHasData()) {
        $('#fieldsWrap').innerHTML = `${staleDateBanner()}
    <div class="card" style="margin-top:14px">
      <h2 class="sec" style="margin-top:0">Set up today</h2>
      <p class="hint">Import the schedule and every field, kickoff and referee name comes in at once.</p>
      <label class="f"><span>Your name, as it goes on the form</span>
        <input type="text" data-mentor value="${esc(S.mentor)}" placeholder="Mentor/Monitor name" autocomplete="name" /></label>
      <button class="btn primary" id="openImport" style="margin-top:12px">Import the schedule</button>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="openSettings2">Add a game by hand</button>
        <button class="btn sm ghost" data-tab="saved">Restore a backup</button>
      </div>
    </div>`;
        return;
      }
      const group = groupOf(f);
      const refs = allRefs();
      const named = refs.filter(x => x.ref.name.trim());
      const withNotes = refs.filter(x => x.ref.notes.length);
      const fullyRated = refs.filter(x => RATED.every(c => x.ref.ratings[c.id] != null));
      // Finished games are off the list, so their referees should not nag here.
      const unwatched = named.filter(x => !x.ref.notes.length && !x.field.done)
        .map(x => `${fieldLabel(x.field)}${x.field.sub ? ' ' + x.field.sub : ''} ${x.ref.slot}`);

      // Every pitch at this field and kickoff, each with its own crew.
      // Two Tigers pitches means two small pitch maps, one above the other, so
      // you can see the whole area you are standing in front of.
      const blocks = group.map(pf => {
        const crew = pf.refs.map(r => {
          const done = RATED.filter(c => r.ratings[c.id] != null).length;
          return `<div class="crewrow${r.id === S.activeRefId ? ' on' : ''}">
        <span class="slot">${esc(r.slot)}</span>
        <input type="text" placeholder="Referee name" value="${esc(r.name)}" data-name="${r.id}" />
        <span class="prog">${r.notes.length} note${r.notes.length === 1 ? '' : 's'}<br>${done}/${RATED.length} rated</span>
        <button class="go" data-open="${r.id}">Notes</button>
      </div>`;
        }).join('');
        /* Done / Delete live on each pitch. They used to sit once at the bottom
           and acted only on the selected pitch, even with two pitches shown. */
        return `<div class="fieldblock">
      <div class="fieldhead">
        <div class="fname">${esc(pf.sub ? shortField(pf.name) + ' ' + pf.sub : pf.name || 'Field not set')}</div>
        ${pf.done ? '<span class="pill">done</span>' : ''}
        <div class="spacer"></div>
        <button class="minibtn" data-done="${pf.id}">${pf.done ? 'Reopen' : '&check; Done'}</button>
        <button class="minibtn danger" data-delgame="${pf.id}"
          aria-label="Delete ${esc(pitchLabel(pf) || 'this game')}">Delete</button>
      </div>
      ${pitchSVG(pf)}
      <div class="crew">${crew}</div>
    </div>`;
      }).join('');

      const meta = [f.name, f.division, pretty12(f.time)].filter(Boolean).join(', ');

      $('#fieldsWrap').innerHTML = `
    ${staleDateBanner()}
    ${nowGameBar()}
    <div class="card" style="margin-top:2px">
      <div class="cov">
        <span><b>${named.length}</b> referees</span>
        <span><b>${withNotes.length}</b> with notes</span>
        <span><b>${fullyRated.length}</b> fully rated</span>
      </div>
      ${unwatched.length ? `<div class="hint" style="margin:8px 0 0">Not watched yet:
        ${esc(unwatched.slice(0, 12).join(', '))}${unwatched.length > 12 ? ` +${unwatched.length - 12} more` : ''}</div>` : ''}
    </div>
    <div class="hint" style="margin:10px 0 0">${esc(meta || 'Field not set')}${group.length > 1
          ? ` &mdash; ${group.length} pitches, one referee each` : ''}</div>
    ${blocks}
    <div class="hint" style="margin-top:6px">Tap a position on the pitch to switch who you are watching.
      Every note goes to whoever is named in the blue bar at the top.</div>`;
    }

    function staleDateBanner() {
      if (S.date === todayISO() || S.ui.keepDate === todayISO()) return '';
      return `<div class="warn" style="margin-top:12px">
      <b>This session is dated ${esc(prettyDate(S.date))}</b>, but today is ${esc(prettyDate(todayISO()))}.
      Saved evaluations and the import's date filter use the session date.
      <button class="btn sm primary" id="dateFresh" style="margin-top:8px">Clear it and start today</button>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" id="dateToday">Keep games, use today</button>
        <button class="btn sm ghost" id="dateKeep">Keep ${esc(prettyDate(S.date))}</button>
      </div>
    </div>`;
    }

    /* ============================================================
       HEADER + OBSERVE
       ============================================================ */
    function renderWatching() {
      const p = activePair();
      const box = $('#watching');
      if (!p) {
        box.className = 'watching idle';
        box.innerHTML = `<div style="min-width:0"><div class="who">No referee selected</div>
      <div class="sub">Tap a position on a field to start</div></div>`;
        return;
      }
      box.className = 'watching';
      // One tap from the referee you are watching to what earlier mentors said.
      const past = pastEvaluations(p.ref);
      box.innerHTML = `<span class="rolechip">${esc(p.ref.role)}</span>
    <div style="min-width:0">
      <div class="who">${esc(refDisplay(p.ref))}</div>
      <div class="sub">${esc(p.field.name || 'field not set')}${p.field.sub ? ' ' + esc(p.field.sub) : ''} &nbsp;&middot;&nbsp; ${esc(p.ref.slot)}</div>
    </div>
    ${past ? `<button class="minibtn" data-profile="${esc(past.g.key)}"
      aria-label="${esc(past.g.name)}: ${plural(past.past.length, 'earlier evaluation')}">History ${past.past.length}</button>` : ''}
`;
    }

    /* Two rows: every field, then just the selected field's crew. A single
       flat list of every official across ten fields is a horizontal scroll
       nobody can hit accurately while watching a game. */
    function renderMinimap() {
      const p = activePair();
      const fid = p ? p.field.id : S.ui.fieldId;
      const f = S.fields.find(x => x.id === fid);
      const group = f ? groupOf(f) : [];
      const crew = group.flatMap(pf => pf.refs.map(r => {
        const on = r.id === S.activeRefId;
        return `<button class="mini${on ? ' on' : ''}" data-pick="${r.id}">
      <span class="m1">${esc(r.slot)}${pf.sub ? '&middot;' + esc(pf.sub) : ''}</span> ${esc(refDisplay(r).split(/\s+/)[0])}
      ${r.notes.length ? `<span style="color:var(--plus);font-weight:700"> ${r.notes.length}</span>` : ''}
    </button>`;
      })).join('');
      $('#minimap').innerHTML = `${nowGameBar()}<div class="minimap" style="padding-top:0">${crew}</div>`;
    }

    function renderObserve() {
      const p = activePair();
      if (!p) {
        $('#observeBody').innerHTML = `<div class="empty">Pick a referee above, or tap a position on the
      Fields tab. Notes always attach to the referee in the blue bar.</div>`;
        return;
      }
      const {field, ref} = p;
      const catRow = CATS.map(c => {
        const n = ref.notes.filter(x => x.cat === c.id).length;
        return `<button class="cat${S.ui.cat === c.id ? ' on' : ''}" data-cat="${c.id}">
      ${esc(c.short)}${n ? ` ${n}` : ''}</button>`;
      }).join('');

      // Role filter: a chip with pos:'AR' is hidden from a center referee
      // and vice versa. Fewer wrong taps when you are watching live.
      const improving = S.ui.pol === 2;
      const chips = CHIPS.filter(c => c.cat === S.ui.cat && (!c.pos || c.pos === ref.role))
        .map((c, i) => {
          const cls = improving ? 'b' : c.pol > 0 ? 'p' : 'm-';
          const mark = improving ? '\u2191' : c.pol > 0 ? '+' : '\u2212';
          return `<button class="chip ${cls}" data-chip="${S.ui.cat}|${i}">
        <span class="m">${mark}</span><span>${esc(c.text)}</span></button>`;
        }).join('');

      const notes = ref.notes.slice().reverse().map(n => {
        const cat = CATS.find(c => c.id === n.cat);
        const cls = n.pol === 1 ? 'p' : n.pol === -1 ? 'n' : n.pol === 2 ? 'b' : 'o';
        // The time each note was taken was always recorded and never shown.
        const meta = [cat ? cat.short : '', n.at ? clockOf(n.at) : ''].filter(Boolean).join(' \u00b7 ');
        return `<div class="nrow ${cls}">
      <span class="mk2">${POL[n.pol] ? POL[n.pol].mark : '\u00b7'}</span>
      <span class="bd">${esc(n.text)}<span class="cn">${esc(meta)}</span></span>
      ${n.pol === -1 ? `<button class="del" data-better="${n.id}"
