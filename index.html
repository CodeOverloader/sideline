      <button class="btn sm" id="uploadOn" style="margin-top:8px">Upload my saved evaluations</button></div>`;
      }
      const waiting = HIST.filter(needsUpload).length, refused = refusedCount();
      if (SYNC.running) {
        return `<div class="okbox">Uploading${waiting ? ' ' + plural(waiting, 'saved evaluation') : ''}&hellip;</div>`;
      }
      if (waiting) {
        return `<div class="warn">${plural(waiting, 'saved evaluation')} waiting to upload${navigator.onLine ? '' : ' (offline)'}.
      ${SYNC.error ? esc(SYNC.error) : ''}
      <button class="btn sm" id="syncRetry" style="margin-top:8px">Upload now</button></div>`;
      }
      if (refused) {
        return `<div class="warn">${plural(refused, 'saved evaluation')} could not be uploaded. The reason is
      shown on each one below.</div>`;
      }
      return `<div class="okbox">&#9729;&#xFE0E; All saved evaluations are uploaded${SYNC.lastOk
        ? ` (checked ${esc(sinceText(SYNC.lastOk))})` : ''}.</div>`;
    }

    /* "just now", "12 min ago", "at 9:41 AM", then ago()'s wording. */
    function sinceText(ts) {
      const mins = Math.floor((Date.now() - ts) / 60000);
      if (mins < 1) return 'just now';
      if (mins < 60) return `${mins} min ago`;
      if (ago(ts) === 'today') return 'at ' + clockOf(ts);
      return ago(ts);
    }

    /* ============================================================
       LEAGUE CACHE
       ------------------------------------------------------------
       Every approved mentor's evaluations, kept on the device so profiles
       work at the field with no signal. IndexedDB, not localStorage:
       localStorage caps out around 5 MB, and a season of evaluations with
       their notes can pass that. Pulls are incremental by updated_at, with
       a five-minute overlap (a row written by a transaction that started
       before our last pull can carry an earlier timestamp) and a full
       refresh once a day. Deletions arrive as tombstones.
       ============================================================ */
    const idb = (() => {
      let dbp = null, chain = Promise.resolve();
      const mem = new Map();   // fallback when IndexedDB is blocked (private windows, some embeds)
      function open() {
        if (!dbp) {
          dbp = new Promise((resolve) => {
            let settled = false;
            const finish = (db) => {if (!settled) {settled = true; clearTimeout(timer); resolve(db);}};
            // An open that never answers - queued behind another tab's delete or
            // upgrade, or WebKit's stalled first open - would hang every read,
            // write and league pull queued behind it for the rest of the session.
            // Give up after a few seconds and try again on the next operation.
            const timer = setTimeout(() => {dbp = null; finish(null);}, 4000);
            try {
              const req = indexedDB.open('sideline', 1);
              req.onupgradeneeded = () => req.result.createObjectStore('kv');
              req.onsuccess = () => {
                const db = req.result;
                // Let go when another tab needs to upgrade or delete the
                // database, instead of blocking it (and every open after it).
                db.onversionchange = () => {db.close(); dbp = null;};
                if (settled) {dbp = Promise.resolve(db); return;}   // late, but usable from now on
                finish(db);
              };
              req.onerror = () => finish(null);
              req.onblocked = () => finish(null);
            } catch (e) {finish(null);}
          });
        }
        return dbp;
      }
      // Operations run one at a time, in order, so a delete can never lose a
      // race with a read that was issued after it.
      function run(mode, fn) {
        const job = chain.then(async () => {
          const db = await open();
          if (!db) return undefined;
          return new Promise((resolve, reject) => {
            const tx = db.transaction('kv', mode);
            const req = fn(tx.objectStore('kv'));
            tx.oncomplete = () => resolve(req.result);
            tx.onerror = tx.onabort = () => reject(tx.error);
          });
        });
        chain = job.catch(() => { });
        return job;
      }
      return {
        get: (k) => run('readonly', s => s.get(k)).then(v => (v === undefined ? mem.get(k) : v), () => mem.get(k)),
        set: (k, v) => {mem.set(k, v); return run('readwrite', s => s.put(v, k)).catch(() => { });},
        del: (k) => {mem.delete(k); return run('readwrite', s => s.delete(k)).catch(() => { });}
      };
    })();

    const leagueBlank = () => ({account: '', evals: new Map(), referees: new Map(), cursor: '', delCursor: '', pulledAt: 0, fullAt: 0});
    let LEAGUE = leagueBlank();
    let leagueLoading = null, pulling = null, pullError = '';

    /* Every caller shares the one read in flight, so a pull waits for it
       instead of racing it - a slow read landing after the pull used to put
       the older copy back over the newer one. Nothing read (no cache yet, or
       storage did not answer) leaves the door open to try again. */
    function loadLeagueCache() {
      if (!leagueLoading) {
        leagueLoading = idb.get('league').then(v => {
          if (!v) {leagueLoading = null; return;}
          if (v.account !== ACCT.id || !isApproved()) return;
          if (LEAGUE.account === v.account && LEAGUE.pulledAt >= (v.pulledAt || 0)) return;
          LEAGUE = {
            ...v,
            evals: new Map((v.evals || []).map(r => [r.serverId, r])),
            referees: new Map((v.referees || []).map(x => [x.id, x]))
          };
          invalidateProfiles();
        });
      }
      return leagueLoading;
    }
    function persistLeague() {
      idb.set('league', {...LEAGUE, evals: [...LEAGUE.evals.values()], referees: [...LEAGUE.referees.values()]});
    }
    function clearLeague() {
      LEAGUE = leagueBlank();
      leagueLoading = null; pullError = '';
      invalidateProfiles();
      idb.del('league');
    }

    const EVAL_COLS = 'id,mentor_id,client_id,referee_id,referee_name,mentor_name,eval_date,field,pitch,kickoff,' +
      'division,position,appearance,workrate,commands,teamwork,fouls,offsides,move_up,comments,notes,saved_at,updated_at';

    /* PostgREST returns at most 1000 rows per request, so page through. */
    async function pageAll(build) {
      const out = [], size = 1000;
      for (let from = 0; ; from += size) {
        const {data, error} = await build().range(from, from + size - 1);
        if (error) throw error;
        out.push(...(data || []));
        if (!data || data.length < size) return out;
      }
    }

    /* A server row, reshaped like a HIST record so one set of profile code
       reads both. */
    function fromRow(row) {
      return {
        id: row.client_id, serverId: row.id, mentorId: row.mentor_id, refereeId: row.referee_id,
        savedAt: Date.parse(row.saved_at) || 0, updatedAt: row.updated_at,
        mentor: row.mentor_name || '', date: row.eval_date || '', field: row.field || '', sub: row.pitch || '',
        time: String(row.kickoff || '').slice(0, 5), division: row.division || '',
        referee: row.referee_name || '', position: row.position,
        ratings: Object.fromEntries(RATED.map(c => [c.id, row[c.id]])),
        moveUp: row.move_up, comments: row.comments || '',
        notes: Array.isArray(row.notes) ? row.notes : []
      };
    }

    let pullNext = null;
    /* mode: undefined - routine, throttled to once every two minutes.
              'force'   - pull now, skipping the throttle, but still only what
                          changed since the cursor.
              'full'    - throw the cache away and rebuild from the server. */
    function pullLeague(mode) {
      const c = sbc();
      if (!c || !isApproved()) return Promise.resolve();
      if (pulling) {
        // A forced pull asked for mid-pull wants what changed after that pull
        // began - the upload or merge that just finished - so it runs next
        // rather than sharing the answer of a pull that started too early.
        if (!mode) return pulling;
        if (!pullNext) pullNext = pulling.then(() => {pullNext = null; return pullLeague(mode);});
        return pullNext;
      }
      if (!mode && Date.now() - LEAGUE.pulledAt < 2 * 60000) return Promise.resolve();
      // Next tick, for the same reason as syncNow().
      pulling = Promise.resolve().then(async () => {
        try {
          await loadLeagueCache();
          const me = ACCT.id;
          const full = mode === 'full' || LEAGUE.account !== me || !LEAGUE.fullAt || Date.now() - LEAGUE.fullAt > 864e5;
          // Five minutes before the cursor, or '' (fetch from the start) if this
          // browser cannot read the server's timestamp: Invalid Date would throw
          // in toISOString and fail every incremental pull.
          const overlap = (iso) => {const t = Date.parse(iso); return Number.isFinite(t) ? new Date(t - 5 * 60000).toISOString() : '';};
          const since = full ? '' : overlap(LEAGUE.cursor), delSince = full ? '' : overlap(LEAGUE.delCursor);
          const refs = await pageAll(() => c.from('referees').select('id,display_name,name_key,merged_into').order('id'));
          const rows = await pageAll(() => {
            let q = c.from('evaluations').select(EVAL_COLS).order('updated_at').order('id');
            if (since) q = q.gt('updated_at', since);
            return q;
          });
          const dels = await pageAll(() => {
            let q = c.from('evaluation_deletions').select('evaluation_id,deleted_at').order('deleted_at').order('evaluation_id');
            if (delSince) q = q.gt('deleted_at', delSince);
            return q;
          });
          if (ACCT.id !== me || !isApproved()) return;   // signed out or demoted mid-pull

          const evals = full ? new Map() : new Map(LEAGUE.evals);
          rows.forEach(r => evals.set(r.id, fromRow(r)));
          dels.forEach(d => evals.delete(d.evaluation_id));
          const latest = (list, key, start) => list.reduce((m, x) => (x[key] > m ? x[key] : m), start || '');
          LEAGUE = {
            account: me, evals,
            referees: new Map(refs.map(x => [x.id, x])),
            cursor: latest(rows, 'updated_at', full ? '' : LEAGUE.cursor),
            delCursor: latest(dels, 'deleted_at', full ? '' : LEAGUE.delCursor),
            pulledAt: Date.now(),
            fullAt: full ? Date.now() : LEAGUE.fullAt
          };
          // What is in memory is now newer than anything a cache read could bring.
          leagueLoading = leagueLoading || Promise.resolve(); pullError = '';
          persistLeague(); invalidateProfiles();
        } catch (e) {
          pullError = friendly(e);
        } finally {
          pulling = null;
          renderQuietly();
          const a = document.activeElement;
          const busyInSheet = a && $('#sheet').contains(a) && /^(SELECT|INPUT|TEXTAREA)$/.test(a.tagName);
          if (!$('#sheet').hidden && sheetMode === 'profile' && !busyInSheet) renderSheet();
        }
      });
      return pulling;
    }

    /* ============================================================
       REFEREE PROFILES
       ------------------------------------------------------------
       One profile per referee, built from the league cache plus this
       device's own saved evaluations (which may not be uploaded yet).
       Signed out, or with accounts off, it is this device's records only.
       The app never scores anyone: every number here is an average of
       ratings mentors gave, shown with the count behind it.
       ============================================================ */
    /* Mirrors public.name_key() in supabase/migrations - keep the two in step.
       Letters and digits of every script count; only punctuation, symbols and
       spaces separate words. It used to keep a-z and 0-9 alone, so "张伟" and
       "Иван Петров" both came out empty and shared one profile.
       Accents come off Latin and Greek letters only, as unaccent() does: in
       Cyrillic "й" and "и" are different letters. NAME_FOLD covers what
       unaccent() rewrites that NFKD cannot take apart. The app only ever
       compares these keys with each other (profileIndex keys the server's
       referees by display name), so a rare letter the two spell differently
       costs nothing worse than a profile that joins up once it is uploaded. */
    const NAME_FOLD = {
      'ß': 'ss', 'ø': 'o', 'æ': 'ae', 'œ': 'oe', 'ł': 'l', 'đ': 'd', 'ð': 'd', 'þ': 'th',
      'ı': 'i', 'ħ': 'h', 'ŧ': 't', 'ŋ': 'n', 'ς': 'σ', '×': ' ', '÷': ' '
    };
    const NAME_SEP = /[^a-z0-9\u00c0-\u1fff\u2c00-\u2dff\u2e80-\u2fff\u3040-\ud7ff\uf900-\ufdff\ufe70-\ufefe\uff10-\uff19\uff21-\uff3a\uff41-\uff5a\uff66-\uffef\u{10000}-\u{1efff}\u{20000}-\u{10ffff}]+/gu;
    function nameKey(n) {
      let s = String(n || '');
      const m = s.match(/^([^,]+),([^,]+)$/);
      if (m) s = m[2].trim() + ' ' + m[1].trim();
      return s.normalize('NFKD').toLowerCase()
        .replace(/[ßøæœłđðþıħŧŋς×÷]/g, c => NAME_FOLD[c])
        .replace(/[\u02b9-\u02bd\u02c6\u02c8\u02cb\u02d0]/g, ' ')              // modifier apostrophes: Kaʻiulani
        .replace(/([a-z\u00e0-\u024f\u0370-\u03ff])[\u0300-\u036f]+/g, '$1')   // é -> e, ώ -> ω
        .replace(/\u0435\u0308/g, '\u0435')                                   // ё -> е
        .normalize('NFC').replace(NAME_SEP, ' ').trim();
    }
    /* "Ref, Alice" / "alice  REF" -> "Alice Ref". Words already in mixed case
       ("McDonald") are left alone. */
    /* Is this name a single word, and so not enough to tell two people apart?
       "Jordan" is; "Jordan Ellis" and "Ellis, Jordan" are not. Mirrors
       name_is_one_word() in the database, including the exception: a Chinese,
       Japanese or Korean name is written without spaces and is complete as it
       stands, so it does not count as one word. */
    const CJK_RE = /[\u3040-\u30ff\u3400-\u4dbf\u4e00-\u9fff\uac00-\ud7af\uf900-\ufaff]/;
    function nameIsOneWord(name) {
      const k = nameKey(name);
      return !!k && !k.includes(' ') && !CJK_RE.test(k);
    }

    function tidyName(s) {
      let t = String(s || '').trim().replace(/\s+/g, ' ');
      const m = t.match(/^([^,]+),([^,]+)$/);
      if (m) t = m[2].trim() + ' ' + m[1].trim();
      return t.split(' ').map(w => (w.length > 1 && (w === w.toLowerCase() || w === w.toUpperCase()))
        ? w.charAt(0).toUpperCase() + w.slice(1).toLowerCase() : w).join(' ');
    }
    const mean = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : null);
    const fmtAvg = (v) => (v == null ? '–' : v.toFixed(1));
    /* Averages only the categories that apply to the divisions this evaluation
       was written across. Reading it off the record rather than off a stored
       flag means evaluations saved before this fix - and every one pulled from
       the league - are scored correctly too, with no migration. */
    function evalAvg(r) {
      return mean(ratedForRecord(r).map(c => r.ratings && r.ratings[c.id])
        .filter(v => typeof v === 'number'));
    }

    let profileCache = null;
    function invalidateProfiles() {profileCache = null;}
    const histChanged = invalidateProfiles;

    function canonicalRef(id) {
      let cur = id;
      for (let hops = 0; cur && hops < 10; hops++) {
        const x = LEAGUE.referees.get(cur);
        if (!x || !x.merged_into) break;
        cur = x.merged_into;
      }
      return cur;
    }

    function profileIndex() {
      if (profileCache) return profileCache;
      // nameKey() of each server spelling -> surviving referee id. Keyed by this
      // app's own nameKey, not the server's name_key, so matching a local copy to
      // its referee never depends on the two functions agreeing letter for letter.
      const keyToRef = new Map();
      LEAGUE.referees.forEach(x => {
        const k = nameKey(x.display_name);
        if (!k) return;
        /* A merged spelling normally keeps pulling records to the referee it
           was folded into - that is what merging a misspelling is for. A
           one-word name is not a misspelling of anything, though: it is an
           incomplete name other people share, so it must not drag the next
           "Jordan" into Jordan Ellis's profile. The database retires these
           keys on its side; this is the same rule applied here, so it holds
           even for records that were never uploaded. */
        if (x.merged_into && nameIsOneWord(x.display_name)) return;
        keyToRef.set(k, canonicalRef(x.id));
      });

      // One record per (mentor, evaluation). A local copy that is newer than
      // the league's (edited, not re-uploaded yet) wins.
      const recs = new Map();
      const put = (k, r) => {const cur = recs.get(k); if (!cur || (r.savedAt || 0) >= (cur.savedAt || 0)) recs.set(k, r);};
      LEAGUE.evals.forEach(r => put(`${r.mentorId || 'x' + r.serverId}|${r.id}`, r));
      const me = isApproved() ? ACCT.id : 'local';
      HIST.forEach(h => {
        if (!h.referee || !h.referee.trim()) return;
        const owner = h.syncedBy || me;
        put(`${owner}|${h.id}`, {...h, mentorId: owner, refereeId: h.serverRefereeId || '', local: true});
      });

      const groups = new Map();
      recs.forEach(r => {
        const refId = r.refereeId && LEAGUE.referees.has(r.refereeId) ? canonicalRef(r.refereeId) : keyToRef.get(nameKey(r.referee));
        // A name with no letters or digits ("?") has no key; it stands alone
        // rather than pooling with every other such name.
        const key = refId ? 'r:' + refId : 'k:' + (nameKey(r.referee) || '#' + r.id);
        if (!groups.has(key)) groups.set(key, {key, refereeId: refId || '', records: []});
        groups.get(key).records.push(r);
      });

      /* Collapse copies of the SAME evaluation.

         The league takes one evaluation per referee per day per mentor, so that
         is the identity - and several things can produce a second copy of one:
         an evaluation the mentor filed in the app that also arrives through the
         Google Form import (those carry no mentor_id, so their dedup key can
         never match the mentor's own upload), and records written per game
         before evaluations became per day.

         Counting both would inflate the referee's evaluation count and let one
         game's ratings pull their average twice. The count of what was folded
         is kept so the profile can say so: this makes the numbers right without
         hiding that there is something to tidy up on the server. */
      const copyRank = (r) => [
        Array.isArray(r.games) ? r.games.length : 1,
        (r.notes || []).length,
        r.savedAt || 0
      ];
      const better = (a, b) => {
        const x = copyRank(a), y = copyRank(b);
        for (let i = 0; i < x.length; i++) {if (x[i] !== y[i]) return x[i] > y[i];}
        return false;
      };
      groups.forEach(g => {
        const byDay = new Map();
        let dupes = 0;
        g.records.forEach(r => {
          // By the mentor's NAME, not their id: a form-imported row has no
          // mentor_id at all, so the name is the only thing the two copies of
          // one evaluation share.
          const who = nameKey(r.mentor) || r.mentorId || '';
          const k = `${r.date || ''}|${who}`;
          const cur = byDay.get(k);
          if (!cur) {byDay.set(k, r); return;}
          dupes++;
          if (better(r, cur)) byDay.set(k, r);
        });
        g.duplicates = dupes;
        if (dupes) g.records = [...byDay.values()];
      });

      // Display name: the most common spelling; on a tie, the tidiest (no
      // "Last, First", capitalised words), then the fullest.
      const tidy = (s) => (s.includes(',') ? 0 : 2) + (/^(\p{Lu}[\p{Ll}'’.-]*\s?)+$/u.test(s) ? 1 : 0);
      const nameIdx = new Map();
      groups.forEach(g => {
        const counts = new Map();
        g.records.forEach(r => {
          const nm = r.referee.trim().replace(/\s+/g, ' ');
          counts.set(nm, (counts.get(nm) || 0) + 1);
          nameIdx.set(nameKey(nm), g.key);
        });
        const best = [...counts.entries()]
          .sort((a, b) => b[1] - a[1] || tidy(b[0]) - tidy(a[0]) || b[0].length - a[0].length || a[0].localeCompare(b[0]))[0][0];
        g.name = tidy(best) === 3 ? best : tidyName(best);
        g.profile = buildProfile(g.records);
      });
      keyToRef.forEach((id, k) => {if (groups.has('r:' + id)) nameIdx.set(k, 'r:' + id);});
      profileCache = {groups, nameIdx};
      return profileCache;
    }
    function profileFor(name) {
      const k = nameKey(name);
      if (!k) return null;
      const idx = profileIndex();
      const key = idx.nameIdx.get(k);
      return key ? idx.groups.get(key) : null;
    }

    function buildProfile(records) {
      const evals = records.slice().sort((a, b) =>
        (b.date || '').localeCompare(a.date || '') || (b.savedAt || 0) - (a.savedAt || 0));
      const cats = RATED.map(c => {
        // Same rule per category: a division that does not play offside
        // contributes nothing to the offside average, rather than contributing
        // the 1 the form made the mentor write.
        const vals = evals.filter(r => c.id !== 'offsides' || recordHasOffside(r))
          .map(r => r.ratings && r.ratings[c.id]).filter(v => typeof v === 'number');
        // Trend compares the three most recent ratings with everything before.
        let trend = null;
        if (vals.length >= 4) {
          const d = mean(vals.slice(0, 3)) - mean(vals.slice(3));
          trend = d >= 0.35 ? 'up' : d <= -0.35 ? 'down' : 'flat';
        }
        return {id: c.id, short: c.short, label: c.label, avg: mean(vals), n: vals.length, trend};
      });
      const avgs = evals.map(evalAvg).filter(v => v != null);   // newest first

      // Notes counted once per evaluation, so one game's three late flags
      // cannot outweigh a pattern across games.
      const tally = (pol) => {
        const m = new Map();
        evals.forEach(r => {
          const seen = new Set();
          (r.notes || []).forEach(n => {
            if (n.pol !== pol || !n.text) return;
            const k = String(n.text).trim().toLowerCase();
            if (seen.has(k)) return;
            seen.add(k);
            const cur = m.get(k) || {text: String(n.text).trim(), cat: n.cat, evals: 0, last: r.date || ''};
            cur.evals++;
            m.set(k, cur);
          });
        });
        return [...m.values()].sort((a, b) => b.evals - a.evals || b.last.localeCompare(a.last));
      };
      const latest = evals[0];
      const fixedLatest = new Set(((latest && latest.notes) || []).filter(n => n.pol === 2)
        .map(n => String(n.text).trim().toLowerCase()));
      const lastWork = [];
      ((latest && latest.notes) || []).forEach(n => {
        const k = String(n.text || '').trim().toLowerCase();
        if (n.pol === -1 && k && !fixedLatest.has(k) && !lastWork.some(x => x.k === k)) lastWork.push({k, text: String(n.text).trim()});
      });

      return {
        evals, count: evals.length,
        mentors: new Set(evals.map(r => r.mentorId || r.mentor || '?')).size,
        lastSeen: latest ? latest.date : '',
        cats,
        overall: mean(avgs), recentAvg: mean(avgs.slice(0, 3)), rated: avgs.length,
        moveUp: {yes: evals.filter(r => r.moveUp === 'Yes').length, no: evals.filter(r => r.moveUp === 'No').length},
        watch: tally(-1).filter(w => w.evals >= 2),
        lowCats: cats.filter(c => c.avg != null && c.avg <= 2),
        lastWork,
        improved: tally(2),
        strengths: tally(1).filter(g => g.evals >= 2)
      };
    }

    /* The one-line "what to look for" summary used on rows and banners. */
    function topConcern(p) {
      if (p.watch.length) return p.watch[0].text;
      if (p.lowCats.length) return `${p.lowCats[0].short} averages ${fmtAvg(p.lowCats[0].avg)}`;
      if (p.lastWork.length) return p.lastWork[0].text;
      return '';
    }

    /* Shown on Observe and Score: what earlier evaluations said about the
       referee you are watching now, excluding this game's own saved copy. */
    function pastEvaluations(ref) {
      if (!ref.name.trim()) return null;
      const g = profileFor(ref.name);
      if (!g) return null;
      const day = dayGroupFor(ref);
      const own = savedRecordFor(day);
      const ids = dayIds(day);
      const past = g.profile.evals.filter(r => !(own && r.local && r.id === own.id)
        && !(r.local && ids.includes(r.refId)));
      return past.length ? {g, past} : null;
    }
    function historyLine(ref) {
      const h = pastEvaluations(ref);
      if (!h) return '';
      const {g, past} = h;
      const p = buildProfile(past);
      const last = past[0];
      const watch = [];
      p.watch.concat(p.lastWork).forEach(w => {if (watch.length < 2 && !watch.includes(w.text)) watch.push(w.text);});
      const avg = evalAvg(last);
      return `<div class="histline">
      <div><b>Last watched ${esc(prettyDate(last.date) || 'earlier')}</b>${last.mentor ? ' by ' + esc(last.mentor) : ''}${avg != null
          ? ` &middot; avg ${fmtAvg(avg)}` : ''}${past.length > 1 ? ` &middot; ${plural(past.length, 'evaluation')}` : ''}</div>
      <div class="muted">${watch.length ? 'Watch for: ' + esc(watch.join('; ')) : 'No recurring concerns noted.'}</div>
      <button class="minibtn" data-profile="${esc(g.key)}">Profile</button>
    </div>`;
    }

    /* ---------- Refs tab ---------- */
    const REFS_UI = {q: '', sort: 'support'};
    function scopeText() {
      if (!ACCOUNTS_ON) return 'Built from the evaluations saved on this device.';
      if (ACCT.status === 'signedOut') return 'This device only. Sign in to include other mentors’ evaluations.';
      if (ACCT.status === 'pending') return 'This device only until your account is approved.';
      return `Every approved mentor’s saved evaluations${LEAGUE.pulledAt ? ', updated ' + sinceText(LEAGUE.pulledAt) : ''}.`;
    }
    function renderRefs() {
      const sorts = [['support', 'Support first'], ['recent', 'Recent'], ['name', 'A–Z']];
      $('#refsBody').innerHTML = `
    <h2 class="sec">Referees</h2>
    <p class="hint">${esc(scopeText())}</p>
    ${pullError && isApproved() ? `<div class="warn">Could not refresh: ${esc(pullError)}</div>` : ''}
    <div class="row" style="margin-bottom:8px">
      ${ACCOUNTS_ON && ACCT.status === 'signedOut' ? '<button class="btn sm" id="openAccount">Sign in</button>' : ''}
      ${isApproved() ? `<button class="btn sm" id="refsRefresh" ${pulling ? 'disabled' : ''}>${pulling ? 'Refreshing&hellip;' : 'Refresh'}</button>` : ''}
    </div>
    <input type="search" id="refSearch" placeholder="Search by name" aria-label="Search referees"
      value="${esc(REFS_UI.q)}" autocomplete="off" />
    <div class="seg" style="margin:8px 0" role="group" aria-label="Sort referees">
      ${sorts.map(([k, l]) => `<button data-refsort="${k}" aria-pressed="${REFS_UI.sort === k}">${l}</button>`).join('')}
    </div>
    <div id="refsList">${refsListHTML()}</div>
    <p class="hint" style="margin-top:12px">"Support first" lists the lowest recent averages first (each
      referee's last three evaluations). Averages mix mentors and divisions, so read them next to the counts.</p>`;
    }
    function refsListHTML() {
      const q = nameKey(REFS_UI.q);
      let list = [...profileIndex().groups.values()];
      if (q) list = list.filter(g => g.records.some(r => nameKey(r.referee).includes(q)));
      const byName = (a, b) => a.name.localeCompare(b.name);
      if (REFS_UI.sort === 'name') list.sort(byName);
      else if (REFS_UI.sort === 'recent') list.sort((a, b) => (b.profile.lastSeen || '').localeCompare(a.profile.lastSeen || '') || byName(a, b));
      else {
        list.sort((a, b) => {
          const x = a.profile.recentAvg, y = b.profile.recentAvg;
          if (x == null || y == null) return (x == null) - (y == null) || byName(a, b);
          return x - y || b.profile.count - a.profile.count || byName(a, b);
        });
      }
      if (!list.length) {
        return `<div class="empty">${q ? 'No referee matches that name.'
          : 'No saved evaluations yet. Profiles build from evaluations saved on the Score tab.'}</div>`;
      }
      return list.map(g => {
        const p = g.profile, concern = topConcern(p);
        const low = p.recentAvg != null && p.recentAvg <= 2;
        return `<button class="refrow" data-profile="${esc(g.key)}">
      <div class="rr1"><b>${esc(g.name)}</b>
        <span class="pill${low ? ' low' : ''}">${p.recentAvg == null ? 'no ratings' : 'recent avg ' + fmtAvg(p.recentAvg)}</span></div>
      <div class="rr2">${plural(p.count, 'evaluation')} &middot; ${plural(p.mentors, 'mentor')} &middot; last ${esc(prettyDate(p.lastSeen) || '–')}</div>
      ${concern ? `<div class="rr3">Watch for: ${esc(concern)}</div>` : ''}
    </button>`;
      }).join('');
    }

    /* ---------- profile sheet ---------- */
    let profileKey = '';
    function openProfile(key) {profileKey = key; openSheet('profile');}
    function currentProfile() {return profileIndex().groups.get(profileKey) || null;}

    function renderProfile() {
      const g = currentProfile();
      if (!g) {
        $('#sheetBody').innerHTML = '<div class="empty">There are no evaluations for this referee any more.</div>';
        return;
      }
      const p = g.profile;
      const catShort = (id) => {const c = CATS.find(x => x.id === id); return c ? c.short : '';};
      const trendMark = (t) => t === 'up' ? ' <span title="Better in the last three evaluations" style="color:var(--plus)">&uarr;</span>'
        : t === 'down' ? ' <span title="Worse in the last three evaluations" style="color:var(--minus)">&darr;</span>' : '';
      const cats = p.cats.map(c => `<div class="catrow">
      <span>${esc(c.short)}</span>
      <span class="bar" aria-hidden="true"><i class="${c.avg != null && c.avg <= 2 ? 'low' : ''}" style="width:${c.avg == null ? 0 : (c.avg / 4) * 100}%"></i></span>
      <span class="cv">${fmtAvg(c.avg)}<small> (${c.n})</small>${trendMark(c.trend)}</span>
    </div>`).join('');

      const list = (items) => `<ul class="plist">${items.join('')}</ul>`;
      const watchItems = p.watch.map(w => `<li>${esc(w.text)} <span class="muted">&mdash; in ${w.evals} evaluations${w.cat ? ', ' + esc(catShort(w.cat)) : ''}</span></li>`)
        .concat(p.lowCats.map(c => `<li>${esc(c.label)} <span class="muted">&mdash; averages ${fmtAvg(c.avg)} over ${plural(c.n, 'rating')}</span></li>`));
      const sections = [];
      if (watchItems.length) sections.push(`<div class="card"><div class="rlabel">Watch for</div>${list(watchItems)}</div>`);
      if (p.lastWork.length) {
        sections.push(`<div class="card"><div class="rlabel">Still to work on after the last evaluation</div>
        ${list(p.lastWork.map(n => `<li>${esc(n.text)}</li>`))}</div>`);
      }
      if (p.improved.length) {
        sections.push(`<div class="card"><div class="rlabel">Fixed after being told</div>
        ${list(p.improved.slice(0, 8).map(n => `<li>${esc(n.text)}${n.evals > 1 ? ` <span class="muted">&mdash; ${n.evals} times</span>` : ''}</li>`))}</div>`);
      }
      if (p.strengths.length) {
        sections.push(`<div class="card"><div class="rlabel">Consistent strengths</div>
        ${list(p.strengths.slice(0, 6).map(n => `<li>${esc(n.text)} <span class="muted">&mdash; in ${n.evals} evaluations</span></li>`))}</div>`);
      }

      const evals = p.evals.map(r => {
        const avg = evalAvg(r);
        const scores = RATED.map(c => `<span class="pill">${esc(c.short)} ${esc(r.ratings && r.ratings[c.id] != null ? r.ratings[c.id] : '-')}</span>`).join('');
        const notes = (r.notes || []).map(n => `<li><b style="color:${n.pol === 1 ? 'var(--plus)' : n.pol === -1 ? 'var(--minus)' : 'var(--primary)'}">${POL[n.pol] ? POL[n.pol].mark : '·'}</b> ${esc(n.text)}</li>`);
        return `<details class="evald">
      <summary><b>${esc(prettyDate(r.date) || 'No date')}</b> &middot; ${esc(shortField(r.field))}${r.sub ? ' ' + esc(r.sub) : ''}
        &middot; ${esc(r.division || 'no division')} &middot; ${esc(r.position || '')}${avg != null ? ` &middot; avg ${fmtAvg(avg)}` : ''}
        <span class="muted">&middot; ${esc(r.mentor || 'unknown mentor')}${r.local && needsUpload(r) && isApproved() ? ' &middot; not uploaded' : ''}</span></summary>
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin:8px 0">${scores}<span class="pill">Move up: ${esc(r.moveUp || '-')}</span></div>
      ${notes.length ? list(notes) : ''}
      ${r.comments ? `<pre>${esc(r.comments)}</pre>` : ''}
    </details>`;
      }).join('');

      $('#sheetBody').innerHTML = `
    <p class="hint" style="margin-top:0">${plural(p.count, 'evaluation')} &middot; ${plural(p.mentors, 'mentor')}
      &middot; last seen ${esc(prettyDate(p.lastSeen) || '–')}<br>${esc(scopeText())}</p>
    ${g.duplicates ? `<div class="warn">${plural(g.duplicates, 'extra copy')} of an evaluation already counted here
      ${g.duplicates === 1 ? 'was' : 'were'} left out - same referee, same date, same mentor. The numbers below
      count each evaluation once. This usually means a form import landed beside the mentor's own upload;
      an admin can remove the extra from the admin console.</div>` : ''}
    <div class="card">
      <div class="profhead">
        <div><div class="bigavg">${fmtAvg(p.overall)}</div>
          <div class="hint" style="margin:4px 0 0">average rating across ${plural(p.rated, 'evaluation')}${p.rated > 3
            ? `; last three ${fmtAvg(p.recentAvg)}` : ''}</div></div>
        <div class="hint" style="text-align:right;margin:0;white-space:nowrap;flex:none">Move up<br><b>${p.moveUp.yes}</b> yes &middot; <b>${p.moveUp.no}</b> no</div>
      </div>
      ${cats}
      <div class="hint" style="margin:6px 0 0">(n) is how many ratings each average rests on.
        &uarr;&darr; compare the last three with earlier ones.</div>
    </div>
    ${sections.join('')}
    <h2 class="sec">Evaluations</h2>
    ${evals}`;
    }

    function renderSaved() {
      const last = store.get('sideline:lastBackup') || 0;
      const unbacked = HIST.filter(r => (r.savedAt || 0) > last).length;
      const sharing = isApproved() && uploadConsent() === true;
      const items = HIST.map(r => {
        // Labelled scores. The old "3 2 4 - 1 2" string needed the form open
        // beside it to know which number was which.
        const scores = RATED.map(c => `<span class="pill">${esc(c.short)} ${esc(r.ratings[c.id] ?? '-')}</span>`).join('');
        const problem = sharing ? uploadProblem(r) : '';
        const cloud = !sharing ? '' : (problem || needsUpload(r)) ? '<span class="pill low">not uploaded</span>'
          : '<span class="pill">&#9729;&#xFE0E; uploaded</span>';
        return `<div class="saved">
      <div class="sh">
        <b>${esc(r.referee)}</b><span class="pill">${esc(r.position)}</span>
        <div class="spacer"></div>
        ${cloud}
        <span class="pill">Move up: ${esc(r.moveUp || '-')}</span>
      </div>
      <div class="hint" style="margin:4px 0 0">${esc(prettyDate(r.date))}, ${esc(r.field)}${r.sub ? ' ' + esc(r.sub) : ''}${r.time ? ', ' + esc(pretty12(r.time)) : ''}, ${esc(r.division)}${
          Array.isArray(r.games) && r.games.length > 1 ? ` &middot; <b>${esc(plural(r.games.length, 'game'))}</b>` : ''}</div>
      ${Array.isArray(r.games) && r.games.length > 1 ? `<ul class="daygames">${r.games.map(x =>
          `<li>${esc([x.field, x.sub].filter(Boolean).join(' '))}${x.time ? ' ' + esc(pretty12(x.time)) : ''}
        <span class="muted">${esc([x.division, x.slot].filter(Boolean).join(', '))}</span></li>`).join('')}</ul>` : ''}
      <div style="display:flex;flex-wrap:wrap;gap:4px;margin-top:6px">${scores}</div>
      ${problem ? `<div class="warn" style="margin-top:8px">Not uploaded: ${esc(problem)}</div>` : ''}
      <pre>${esc(r.comments)}</pre>
      <button class="btn sm" data-copysaved="${r.id}" style="margin-top:8px">Copy</button>
      <details class="disclose danger" style="margin-top:8px">
        <summary>More</summary>
        <button class="btn sm danger" data-dropsaved="${r.id}" style="margin-bottom:12px">Delete this evaluation</button>
      </details>
    </div>`;
      }).join('');

      $('#savedBody').innerHTML = `
    <p class="hint">${sharing ? 'Kept on this device and uploaded for other approved mentors.'
          : 'Make a backup (bottom of this page) so a lost or reset phone does not take these with it.'}</p>
    ${syncStatusHTML()}
    ${unbacked ? `<div class="warn">${unbacked} saved evaluation${unbacked === 1 ? ' is' : 's are'} not in a backup yet.
      <button class="btn sm primary" id="backupFile" style="margin-top:8px">Save a backup now</button></div>` : ''}
    ${HIST.length ? items + `<button class="btn" id="exportCsv" style="margin-top:12px">Export all as CSV</button>`
          : '<div class="empty">No evaluations saved yet. Use <b>Save this referee</b> on the Score tab.</div>'}
    <h2 class="sec" style="margin-top:26px">Backup &amp; restore</h2>
    <div class="card" style="margin-top:4px">
      <p class="hint" style="margin-top:0">A backup file carries your games, notes, saved evaluations and
        import settings to another phone or computer.
        ${last ? `Last backup: ${esc(ago(last))}.` : 'No backup made on this device yet.'}</p>
      <div class="row">
        <button class="btn sm primary" id="backupFile2">Save backup file</button>
        <button class="btn sm" id="restoreFile">Restore from file</button>
      </div>
      <details class="more">
        <summary>File buttons not working? Copy and paste instead</summary>
        <button class="btn sm" id="backupCopy" style="margin-top:8px">Copy backup text</button>
        <textarea id="restoreText" rows="3" placeholder="Paste backup text here"
          aria-label="Backup text to restore" style="margin-top:8px"></textarea>
        <button class="btn sm" id="restorePaste" style="margin-top:8px">Restore pasted text</button>
      </details>
      <input type="file" id="restoreInput" accept=".json,application/json,text/plain" hidden />
    </div>`;
    }

    /* ============================================================
       SETTINGS SHEET
       ============================================================ */
    let sheetMode = 'settings';

    function renderSheet() {
      $('#sheetTitle').textContent = sheetMode === 'import' ? 'Import schedule'
        : sheetMode === 'games' ? 'Choose a game'
          : sheetMode === 'account' ? 'Account'
            : sheetMode === 'profile' ? ((currentProfile() || {}).name || 'Referee') : 'Settings';
      if (sheetMode === 'import') return renderImport();
      if (sheetMode === 'games') return renderPicker();
      if (sheetMode === 'account') return renderAccountSheet();
      if (sheetMode === 'profile') return renderProfile();

      /* Settings used to print a full editor card for every game, so a nine-game
         Saturday was a wall of near-identical forms you had to scroll through.
         Now each game is one line and only the one you tap opens. */
      const editing = S.ui.editField;
      const fieldIdx = (n) => {const i = FIELDS.indexOf(n); return i < 0 ? 999 : i;};
      const ordered = S.fields.slice().sort((a, b) =>
        (a.time || '99:99').localeCompare(b.time || '99:99') ||
        fieldIdx(a.name) - fieldIdx(b.name) || (a.sub || '').localeCompare(b.sub || ''));

      const gameCards = ordered.map(f => {
        const head = `<div class="grow${f.done ? ' done' : ''}" style="margin:6px 0 0">
      <button style="flex:1;min-width:0;text-align:left;background:none" data-edit="${f.id}"
        data-gamehead="${f.id}" data-withtime aria-expanded="${editing === f.id}">
        ${gameHeadHTML(f, true)}
      </button>
      <button class="iconsm" data-edit="${f.id}" aria-label="${editing === f.id ? 'Close editor' : 'Edit this game'}">${editing === f.id ? '&#9652;' : '&#9662;'}</button>
    </div>`;
        if (editing !== f.id) return head;

        const opts = ['<option value="">Choose a field</option>']
          .concat(FIELDS.map(n => `<option${n === f.name ? ' selected' : ''}>${esc(n)}</option>`)).join('');
        const divs = ['<option value="">Choose a division</option>']
          .concat(DIVISIONS.map(n => `<option${n === f.division ? ' selected' : ''}>${esc(n)}</option>`)).join('');
        const roles = f.refs.map(r => `<div class="crewrow">
        <span class="slot">${esc(r.slot)}</span>
        <input type="text" placeholder="Referee name" value="${esc(r.name)}" data-name="${r.id}" />
        <div class="seg" style="max-width:118px;flex:none">
          <button data-role="${r.id}|CR" aria-pressed="${r.role === 'CR'}">CR</button>
          <button data-role="${r.id}|AR" aria-pressed="${r.role === 'AR'}">AR</button>
        </div>
      </div>`).join('');

        return head + `<div class="card" style="margin:0 0 10px;border-top-left-radius:0;border-top-right-radius:0">
      <label class="f"><span>Field</span><select data-fname="${f.id}">${opts}</select></label>
      <div class="row">
        <label class="f"><span>Division</span><select data-fdiv="${f.id}">${divs}</select></label>
        <label class="f"><span>Kickoff</span><input type="time" value="${esc(f.time)}" data-ftime="${f.id}" /></label>
      </div>
      <label class="f"><span>Pitches here</span></label>
      <div class="seg">${[1, 2].map(n => `<button data-pitches="${f.id}|${n}" aria-pressed="${groupOf(f).length === n}">${n} pitch${n === 1 ? '' : 'es'}</button>`).join('')}</div>
      <label class="f"><span>Officials on this pitch</span></label>
      <div class="seg">${[1, 2, 3].map(n => `<button data-crew="${f.id}|${n}" aria-pressed="${f.crewSize === n}">${n}</button>`).join('')}</div>
      <div class="crew" style="margin-top:10px">${roles}</div>
      <button class="btn sm" data-done="${f.id}" style="margin-top:10px">${f.done ? 'Put back on the list' : 'Mark done'}</button>
      <details class="disclose danger" style="margin-top:10px">
        <summary>More</summary>
        <button class="btn sm danger" data-delgame="${f.id}" style="margin-bottom:12px"
          aria-label="Delete ${esc(pitchLabel(f) || 'this game')}">Delete this game</button>
      </details>
    </div>`;
      }).join('');

      const groupBtns = FIELD_GROUPS.map(g => {
        const have = g.members.filter(m => S.fields.some(f => f.name === m)).length;
        return `<button class="btn sm${have === g.members.length ? ' ghost' : ''}" style="width:auto;flex:none"
      data-addgroup="${esc(g.label)}">${esc(g.label)}</button>`;
      }).join('');
      const singles = FIELDS.filter(n => !FIELD_GROUPS.some(g => g.members.includes(n)));

      $('#sheetBody').innerHTML = `
    <div class="card">
      <label class="f"><span>Date</span><input type="date" id="sessDate" value="${esc(S.date)}" /></label>
      <button class="btn primary" id="openImport2" style="margin-top:12px">Import the day's schedule</button>
    </div>

    <div class="card">
      <div class="rlabel" style="font-size:12.5px;color:var(--mute);margin-bottom:6px">Theme</div>
      <div class="seg" role="group" aria-label="Theme">${THEMES.map(([k, l]) =>
          `<button data-theme-set="${k}" aria-pressed="${themeMode === k}">${l}</button>`).join('')}</div>
      <div class="hint" style="margin:8px 0 0">Sunlight is far easier to read outdoors. The &#9728;&#xFE0E; button
        in the header switches in one tap.</div>
    </div>

    <h2 class="sec">Games (${S.fields.length})</h2>
    <p class="hint">Tap a game to edit it. Deleting one is under <b>More</b> inside it.</p>
    ${gameCards}

    <h2 class="sec">Add by hand</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${groupBtns}</div>
    <label class="f" style="margin-top:10px"><span>Single field</span>
      <select id="addSingle">
        <option value="">Choose a field to add</option>
        ${singles.map(n => `<option${S.fields.some(f => f.name === n) ? ' disabled' : ''}>${esc(n)}</option>`).join('')}
      </select></label>
    <button class="btn ghost sm" id="addField" style="margin-top:8px">Add an empty game</button>

    <div class="divider"></div>
    <button class="btn sm danger" id="newSession" style="margin-top:8px">Clear the whole session</button>
    <div class="hint" style="margin-top:8px">
      Clears every game and all in-progress notes. Saved evaluations stay.${persistent ? '' :
          ' <b>This browser is blocking storage, so notes will not survive a reload.</b>'}</div>
    <p class="app-version" aria-label="App version 1.0.0">Sideline v1.0.0</p>`;
    }

    /* ---------- the import wizard ----------
       This used to be a single 4,600px scroll - six and a bit phone screens of
       source picker, then a raw spreadsheet preview, then ten column dropdowns,
       then the field filter, then 42 game checkboxes, with no sense of where
       you were or how much was left. It is three steps now:

         1. where the schedule is
         2. which fields are yours
         3. what is about to be added

       Each step is one decision and fits on a screen or two. The column
       mapping, which is the most technical part by far, is hidden entirely
       when it maps itself correctly - which it does for any sheet with
       ordinary headings. */
    const IMP_STEPS = [[1, 'Schedule'], [2, 'Your fields'], [3, 'Confirm']];

    function impStep() {
      // Can't be past step 1 with nothing parsed.
      if (!IMP || !IMP.rows || !IMP.rows.length) return 1;
      return Math.min(Math.max(IMP.step || 1, 1), 3);
    }

    function impStepper() {
      const cur = impStep();
      return `<ol class="stepper" aria-label="Import steps">${IMP_STEPS.map(([n, label]) => `
    <li class="${n === cur ? 'on' : n < cur ? 'done' : ''}" ${n === cur ? 'aria-current="step"' : ''}>
      <span class="sn">${n < cur ? '&#10003;' : n}</span><span class="sl">${label}</span>
    </li>`).join('')}</ol>`;
    }

    /* Which of the columns we actually need did the sheet give us? "field" and
       at least one name column is the bar - everything else is a bonus. */
    function mapHealth() {
      const m = (IMP && IMP.map) || {};
      const have = (k) => m[k] !== '' && m[k] != null;
      const names = ['cr', 'cr2', 'ar1', 'ar2', 'crew'].filter(have);
      const found = ['field', 'time', 'date', 'division'].filter(have);
      return {ok: have('field') && names.length > 0, found, names,
        label: IMP && IMP.header ? found.map(k => IMP.header[Number(m[k])]).filter(Boolean) : []};
    }

    function renderImport() {
      const step = impStep();
      const src = IMP ? IMP.source : 'sheet';
      let body = '';

      /* ---------- step 1: where is the schedule ---------- */
      if (step === 1) {
        const seg = `<div class="seg" role="group" aria-label="Where the schedule is">
      ${[['sheet', 'Google Sheet'], ['paste', 'Paste'], ['cache', 'This browser']]
            .map(([k, l]) => `<button data-impsrc="${k}" aria-pressed="${src === k}">${l}</button>`).join('')}
    </div>`;

        let sourceUI = '';
        if (src === 'sheet') {
          const last = store.get('sideline:sheet') || {id: '', gid: ''};
          sourceUI = `
        <label class="f"><span>Spreadsheet link or ID</span>
          <input type="text" id="shId" value="${esc(last.id)}" placeholder="docs.google.com/spreadsheets/d/..." /></label>
        <label class="f"><span>Tab gid (optional - blank uses the first tab)</span>
          <input type="text" id="shGid" value="${esc(last.gid)}" placeholder="1490026671" /></label>
        <button class="btn primary" id="doFetch" style="margin-top:12px">Fetch the tab</button>
        <div class="hint" style="margin-top:8px">The tab has to be viewable by anyone with the link.
          A sheet only you can open will return a login page, not data. Nothing is sent anywhere -
          your phone fetches it directly and the ID stays in this browser.</div>`;
        } else if (src === 'paste') {
          sourceUI = `
        <label class="f"><span>Paste rows from the schedule</span>
          <textarea id="pasteBox" rows="5" placeholder="Select the cells in the sheet, copy, paste here">${esc(IMP && IMP.text || '')}</textarea></label>
        <button class="btn primary" id="doParse" style="margin-top:10px">Read these rows</button>
        <div class="hint" style="margin-top:8px">Include the header row. Tabs or commas both work.</div>`;
        } else {
          const found = scanBrowserCache();
          sourceUI = found.length
            ? found.map((c, i) => `<div class="gamerow">
            <div style="flex:1;min-width:0"><div class="g1">${esc(c.key)}</div>
            <div class="g2">${c.rows.length} rows</div></div>
            <button class="btn sm" style="width:auto" data-usecache="${i}">Use</button></div>`).join('')
            : `<div class="hint">Nothing found. This reads a schedule that another app on this same
           web address has saved in this browser. Whistle is at a different address
           (codeoverloader.github.io), so its schedule cannot be read from here: use Google Sheet
           or Paste instead.</div>`;
        }

        body = `${seg}<div class="card" style="margin-top:10px">${sourceUI}</div>`;

        // Rows are in: confirm what we read, and offer the column check only as
        // a disclosure. Most people never need to open it.
        if (IMP && IMP.rows && IMP.rows.length) {
          const h = mapHealth();
          const rows = Math.max(0, IMP.rows.length - IMP.headerRow - 1);
          body += h.ok
            ? `<div class="okbox" style="margin-top:12px">
          <b>&#10003; Read ${rows} row${rows === 1 ? '' : 's'}.</b>
          <div style="margin-top:2px">Found ${esc(h.label.join(', '))} and the referee names.</div></div>
        ${impColumnsDetails(false)}
        <button class="btn primary" id="impNext" style="margin-top:12px">Next: choose your fields</button>`
            : `<div class="warn" style="margin-top:12px">Read ${rows} row${rows === 1 ? '' : 's'}, but
          ${IMP.map.field === '' ? 'no <b>Field</b> column' : 'no <b>referee name</b> column'} was recognised.
          Set it below and this will move on.</div>
        ${impColumnsDetails(true)}
        <button class="btn primary" id="impNext" style="margin-top:12px" ${h.ok ? '' : 'disabled'}>Next: choose your fields</button>`;
        }
      }

      /* ---------- step 2: which fields are yours ---------- */
      if (step === 2) {
        const present = fieldsInImport();
        const sel = IMP.fieldFilter;
        const isOn = (name) => !sel || sel.includes(name);
        const count = sel ? sel.length : present.length;
        const sug = suggestedFields();

        const chips = present.map(f => `<button class="fchip${isOn(f.name) ? ' on' : ''}"
      data-impfield="${esc(f.name)}" aria-pressed="${isOn(f.name)}">
      ${esc(shortField(f.name))} <span class="n">${f.n}</span></button>`).join('');

        body = `<div class="card">
      <h2 class="sec" style="margin-top:0">Which fields are you monitoring?</h2>
      <p class="hint">Tap the ones you are watching today. Every kickoff on those fields
        comes in, so one pitch all morning arrives as three or four games.</p>
      ${sug && count === 0 ? `<button class="btn sm" id="fieldsSuggest" style="margin-bottom:10px">
        Use ${esc(sug.names.map(shortField).join(', '))}</button>
      <div class="hint" style="margin:-6px 0 10px">${esc(sug.why)}.</div>` : ''}
      <div class="fieldstrip" style="flex-wrap:wrap;overflow:visible">${chips}</div>
      <div class="row" style="margin-top:10px">
        <button class="btn sm ghost" id="fieldsNone">Clear</button>
        <button class="btn sm ghost" id="fieldsAll">Every field</button>
      </div>
    </div>
    <div class="row" style="margin-top:12px">
      <button class="btn sm ghost" id="impBack">Back</button>
      <button class="btn primary" id="impNext" ${count ? '' : 'disabled'} style="flex:2">
        ${count ? `Next: ${plural(rowsToGames().length, 'game')}` : 'Pick at least one field'}</button>
    </div>`;
      }

      /* ---------- step 3: confirm ---------- */
      if (step === 3) {
        const filtered = rowsToGames();
        if (IMP.picked === null) IMP.picked = filtered.map(g => g.key);
        const present = fieldsInImport();
        const sel = IMP.fieldFilter;

        body = `<div class="seg" role="group" aria-label="Which dates" style="margin-bottom:10px">
      <button data-datef="session" aria-pressed="${IMP.dateFilter === 'session'}">${esc(prettyDate(S.date))} only</button>
      <button data-datef="all" aria-pressed="${IMP.dateFilter === 'all'}">Every date</button>
    </div>
    <h2 class="sec" style="margin-top:4px">${plural(filtered.length, 'game')} found</h2>
    ${filtered.length ? `<div class="row" style="margin-bottom:8px">
      <button class="btn sm ghost" id="pickAll">Select all</button>
      <button class="btn sm ghost" id="pickNone">Select none</button></div>` : ''}
    ${filtered.length ? filtered.map(g => {
          const on = IMP.picked.includes(g.key);
          return `<label class="gamerow${on ? '' : ' off'}">
        <input type="checkbox" data-pickgame="${g.key}" ${on ? 'checked' : ''} />
        <div style="flex:1;min-width:0">
          <div class="g1">${g.time ? esc(pretty12(g.time)) + ' &nbsp; ' : ''}${esc(g.field || g.raw.field || 'field not matched')}</div>
          <div class="g2">${esc(g.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no officials listed'}</div>
        </div></label>`;
        }).join('') : `<div class="empty">No games matched${IMP.dateFilter === 'session'
          ? ` on ${esc(prettyDate(S.date))}. Try Every date above` : ''}.</div>`}
    ${filtered.some(g => !FIELDS.includes(g.field)) ? `<div class="warn">Some rows did not match a field on the form's
      list. They will import with whatever the sheet said, and you can fix the field in Settings.</div>` : ''}
    ${present.length && sel && sel.length < present.length ? `<div class="hint">${plural(present.length - sel.length, 'other field')}
      in this sheet ${present.length - sel.length === 1 ? 'is' : 'are'} filtered out.</div>` : ''}
    <div class="row" style="margin-top:12px">
      <button class="btn sm ghost" id="impBack">Back</button>
      <button class="btn primary" id="doApply" ${IMP.picked.length ? '' : 'disabled'} style="flex:2">
        Add ${plural(IMP.picked.length, 'game')}</button>
    </div>`;
      }

      $('#sheetBody').innerHTML = `${impStepper()}${body}
    <button class="btn sm ghost" id="backToSettings" style="margin-top:14px">Cancel</button>`;
    }

    /* The column mapping, kept behind a disclosure. It is the single most
       technical thing in the app - ten dropdowns and a raw spreadsheet dump -
       and when the headings are ordinary it gets every one of them right
       without being asked. Open it only when it failed, or when someone
       chooses to look. */
    function impColumnsDetails(openIt) {
      if (!IMP || !IMP.rows) return '';
      const opts = (sel) => ['<option value="">not in this sheet</option>']
        .concat(IMP.header.map((h, i) =>
          `<option value="${i}"${String(i) === String(sel) ? ' selected' : ''}>${esc(h || 'column ' + (i + 1))}</option>`)).join('');
      const preview = IMP.rows.slice(IMP.headerRow, IMP.headerRow + 4);
      return `<details class="disclose" ${openIt ? 'open' : ''}>
    <summary>Columns look wrong?</summary>
    <label class="f"><span>Header row</span>
      <select id="hdrRow">${IMP.rows.slice(0, 8).map((r, i) =>
        `<option value="${i}"${i === IMP.headerRow ? ' selected' : ''}>Row ${i + 1}: ${esc(r.slice(0, 4).filter(Boolean).join(' | ').slice(0, 40))}</option>`).join('')}</select></label>
    <div class="scrollx" style="margin:8px 0"><table class="tbl"><tbody>
      ${preview.map((r, ri) => `<tr>${r.slice(0, 8).map(c =>
          ri === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
    </tbody></table></div>
    <div class="map2">
      <label class="f"><span>Field</span><select data-map="field">${opts(IMP.map.field)}</select></label>
      <label class="f"><span>Time</span><select data-map="time">${opts(IMP.map.time)}</select></label>
      <label class="f"><span>Date</span><select data-map="date">${opts(IMP.map.date)}</select></label>
      <label class="f"><span>Division</span><select data-map="division">${opts(IMP.map.division)}</select></label>
    </div>
    <div class="map2">
      <label class="f"><span>CR 1</span><select data-map="cr">${opts(IMP.map.cr)}</select></label>
      <label class="f"><span>CR 2</span><select data-map="cr2">${opts(IMP.map.cr2)}</select></label>
      <label class="f"><span>AR 1</span><select data-map="ar1">${opts(IMP.map.ar1)}</select></label>
      <label class="f"><span>AR 2</span><select data-map="ar2">${opts(IMP.map.ar2)}</select></label>
      <div></div>
      <label class="f"><span>Cancelled flag</span><select data-map="cancel">${opts(IMP.map.cancel)}</select></label>
    </div>
    <label class="f"><span>Whole crew in one column</span><select data-map="crew">${opts(IMP.map.crew)}</select></label>
    <div class="hint">Crew size comes from the division, not from how many names are
      filled in. Pre-K and Kindergarten split into two pitches with one referee each;
      1st and 2nd grade are one game with two officials.</div>
  </details>`;
    }

    let sheetReturnFocus = null;
    function openSheet(mode) {
      const sheet = $('#sheet');
      // Remember what opened the sheet so focus returns there on close, instead
      // of dropping keyboard and screen-reader users back at the top of the page.
      if (sheet.hidden) sheetReturnFocus = document.activeElement;
      sheetMode = mode || 'settings';
      $('#scrim').hidden = false; sheet.hidden = false;
      document.body.classList.add('locked');
      renderSheet();
      sheet.scrollTop = 0;
      sheet.focus({preventScroll: true});
    }
    function closeSheet() {
      $('#scrim').hidden = true; $('#sheet').hidden = true; sheetMode = 'settings';
      document.body.classList.remove('locked');
      // Empty the sheet rather than just hiding it. A hidden element is still in
      // the document: its inputs still match selectors, and after an import that
      // means a hidden textarea holding the entire pasted schedule sits in the
      // DOM competing with the live UI. Cleared on close, rebuilt on open.
      // IMP itself is kept in memory, so reopening restores the parsed rows.
      $('#sheetBody').innerHTML = '';
      renderAll();
      const back = sheetReturnFocus; sheetReturnFocus = null;
      if (back && back.isConnected && back.focus) back.focus({preventScroll: true});
    }

    /* ============================================================
       RENDER + TABS
       ============================================================ */
    function setTab(t) {
      S.ui.tab = t; save();
      ['fields', 'observe', 'score', 'refs', 'saved'].forEach(name => {
        $('#tab-' + name).hidden = name !== t;
        const b = document.querySelector(`nav button[data-tab="${name}"]`);
        // aria-current, not aria-selected: these are plain buttons, not role="tab".
        if (b) {if (name === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');}
      });
      renderAll();
      window.scrollTo({top: 0});
      untuck();
    }

    /* ---------- collapse-on-scroll header ----------
       Scrolling down past the brand row tucks it away; any scroll up brings it
       straight back. The 6px dead zone stops the header flickering when a
       fingertip wobbles, and it never tucks near the top of the page. */
    let lastY = 0, tucked = false, tuckLock = 0;
    function untuck() {
      tucked = false; lastY = 0; tuckLock = 0;
      const h = document.querySelector('header'); if (h) h.classList.remove('tuck');
    }
    function onScroll() {
      const h = document.querySelector('header'); if (!h) return;
      const y = Math.max(0, window.scrollY);

      /* Only tuck when there is real scrolling to do. On a short page the
         reclaimed height is a large share of the total, which makes the
         feedback below far worse, and there is little to gain anyway. */
      const room = document.documentElement.scrollHeight - window.innerHeight;
      if (room < 220) {
        if (tucked) {tucked = false; h.classList.remove('tuck');}
        lastY = y; return;
      }

      /* The lock is the important part. The header sits in the flow, so tucking
         it makes the document ~54px shorter, and the browser nudges scrollY by
         a few pixels to compensate. That nudge arrives as a fresh scroll event
         pointing the opposite way, which untucks, which makes the page taller
         again - a loop that flaps the header several times a second. Ignoring
         scroll for longer than the transition lets the layout settle first. */
      const now = Date.now();
      if (now < tuckLock) {lastY = y; return;}
      if (Math.abs(y - lastY) < 12) return;

      const want = y > 72 && y > lastY;
      lastY = y;
      if (want !== tucked) {
        tucked = want;
        h.classList.toggle('tuck', want);
        tuckLock = now + 320;
      }
    }
    window.addEventListener('scroll', onScroll, {passive: true});
    function renderAll() {
      renderWatching();
      if (S.ui.tab === 'fields') renderFields();
      if (S.ui.tab === 'observe') {renderMinimap(); renderObserve();}
      if (S.ui.tab === 'score') renderScore();
      if (S.ui.tab === 'refs') renderRefs();
      if (S.ui.tab === 'saved') renderSaved();
    }
    /* window.confirm() is why "Start a new session" and the remove buttons did
       nothing in the Android build: a WebView suppresses JS dialogs entirely
       unless the host app installs a WebChromeClient, so confirm() returned
       false instantly and every guarded action was skipped. It worked in the
       browser and silently failed in the APK. This replaces it with real DOM,
       which behaves the same everywhere and can be styled and tested. */
    /* opts: {tone: 'primary'} for a non-destructive yes (default is the red
       danger style), {noLabel} to rename Cancel, {onNo} to run on Cancel,
       Escape or a backdrop tap. */
    let dlgAction = null, dlgNoAction = null, dlgReturnFocus = null;
    function askConfirm(message, label, onYes, opts) {
      const o = opts || {};
      $('#dlgMsg').textContent = message;
      const yes = $('#dlgYes');
      yes.textContent = label;
      yes.className = 'btn sm ' + (o.tone === 'primary' ? 'primary' : 'danger');
      $('#dlgNo').textContent = o.noLabel || 'Cancel';
      dlgAction = onYes;
      dlgNoAction = o.onNo || null;
      dlgReturnFocus = document.activeElement;
      $('#dlg').hidden = false;
      // Focus lands on Cancel, so the choice a stray Enter hits is the safe one.
      $('#dlgNo').focus();
    }
    function closeDlg(run) {
      $('#dlg').hidden = true;
      const fn = run ? dlgAction : dlgNoAction;
      dlgAction = dlgNoAction = null;
      const back = dlgReturnFocus; dlgReturnFocus = null;
      if (fn) fn();
      // If the action opened another question, focus belongs to that one.
      if ($('#dlg').hidden && back && back.isConnected && back.focus) back.focus({preventScroll: true});
    }

    /* flash(msg) for a plain notice; flash(msg, {label, run}) adds a button,
       used for Undo. An action toast stays up longer so there is time to reach it. */
    let toastTimer = null, toastAction = null;
    function flash(msg, action) {
      const t = $('#toast'), b = $('#toastAct');
      $('#toastMsg').textContent = msg;
      toastAction = action ? action.run : null;
      b.hidden = !action;
      if (action) b.textContent = action.label;
      t.classList.toggle('act', !!action);
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, action ? 5000 : 1600);
    }
    function hideToast() {
      clearTimeout(toastTimer);
      $('#toast').classList.remove('show', 'act');
      toastAction = null;
    }

    /* ============================================================
       SCHEDULE IMPORT
       ------------------------------------------------------------
       Typing twelve referee names into a phone at the field is the
       worst part of this job, and the names already exist in the
       schedule. So: pull rows in from anywhere, map the columns once,
       and let the app build the fields and crews.
    
       Deliberately NOT hardcoded: the master spreadsheet ID. This file
       is going in a public repo, and a sheet ID is enough for a
       stranger to try the same fetch. You paste it once and it stays
       in this browser's storage instead.
    
       Three sources, one pipeline. Everything below converts its input
       to {header, rows} and then the same mapper handles it, so adding
       a fourth source later means writing one function.
       ============================================================ */
    let IMP = null;   // transient: parsed rows never get persisted to storage

    /* A real CSV parser, not a split(','). Referee schedules routinely
       contain "Smith, John" in one cell, which split would tear in half.
       This walks character by character tracking whether it is inside
       quotes, and treats a doubled quote inside a quoted field as an
       escaped quote, per RFC 4180. */
    function parseDelimited(text, delim) {
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') {
            if (text[i + 1] === '"') {cell += '"'; i++;}
            else inQ = false;
          } else cell += ch;
        } else if (ch === '"') {inQ = true;}
        else if (ch === delim) {row.push(cell); cell = '';}
        else if (ch === '\n') {row.push(cell); rows.push(row); row = []; cell = '';}
        else if (ch === '\r') { /* swallow; \n does the work */}
        else cell += ch;
      }
      if (cell.length || row.length) {row.push(cell); rows.push(row);}
      return rows.map(r => r.map(c => c.trim()));
    }

    /* Copying cells out of Google Sheets puts TABS on the clipboard, while
       a downloaded export uses commas. Guess from whichever appears more
       in the first few lines rather than making you tell us. */
    function detectDelim(text) {
      const head = text.split('\n').slice(0, 5).join('\n');
      const tabs = (head.match(/\t/g) || []).length;
      const commas = (head.match(/,/g) || []).length;
      return tabs > commas ? '\t' : ',';
    }

    const HEAD_WORDS = /date|time|field|pitch|venue|division|age|level|grade|ref|center|centre|\bcr\b|\bar\d?\b|assistant|official|crew|home|away|team/i;

    /* Schedules often have a title row, a blank row, then the real headers.
       Score the first few rows by how many cells look like column names and
       take the best; you can override it with the selector in the UI. */
    function guessHeaderRow(rows) {
      let best = 0, bestScore = -1;
      rows.slice(0, 8).forEach((r, i) => {
        const filled = r.filter(c => c).length;
        const words = r.filter(c => HEAD_WORDS.test(c)).length;
        const score = words * 3 + filled;
        if (filled >= 2 && score > bestScore) {bestScore = score; best = i;}
      });
      return best;
    }

    function autoMap(header) {
      const find = (re) => {const i = header.findIndex(h => re.test(h)); return i < 0 ? '' : String(i);};
      return {
        date: find(/date/i),
        time: find(/time|kick/i),
        field: find(/field|pitch|venue|location/i),
        division: find(/division|age|level|grade|bracket/i),
        cr: find(/\bcr\s*#?1\b|^cr$|center|centre|ref(eree)?\s*#?1|official\s*#?1/i),
        cr2: find(/\bcr\s*#?2\b|center\s*#?2|centre\s*#?2/i),
        ar1: find(/\bar\s*#?1\b|assistant\s*#?1/i),
        ar2: find(/\bar\s*#?2\b|assistant\s*#?2/i),
        crew: find(/crew|officials|referees|assignment/i),
        cancel: find(/cancel/i),
      };
    }

    /* The form's field dropdown has exact strings. A sheet might say "2A",
       "F2A", "Field 2a" or "Tigers". Normalise both sides down to letters
       and digits and match on that, so the value Sideline stores is always
       one you can actually pick on the form. */
    function normField(v) {return normFieldFull(v).name;}

    /* Returns {name, sub}. A sheet may write the two Tigers pitches as
       "Tigers 1" / "Tigers 2", or "Tigers A" / "Tigers B", or just list
       "Tigers" twice. The first two are recognised here; the third is
       resolved later by position within the kickoff. */
    function normFieldFull(v) {
      if (!v) return {name: '', sub: ''};
      const k = (x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = (key) => {
        if (!key) return undefined;
        const exact = FIELDS.find(f => k(f) === key || k(f) === 'field' + key);   // also "4", "11a"
        if (exact) return exact;
        if (key.length < 2) return undefined;
        // A partial match counts only when it is the only one, and never by
        // splitting a number ("2a" ends both "field2a" and "field12a"). The first
        // hit used to win, so "Field 3" came in as 3A and "Field 1" as Tigers:
        // a wrong field on the form with nothing to say so. Unmatched, the
        // import warns and the field is picked in Settings.
        const one = (list) => (list.length === 1 ? list[0] : undefined);
        const splitsNumber = (x, i) => /\d/.test(key[0]) && /\d/.test(x[i - 1] || '');
        return one(FIELDS.filter(f => {const x = k(f); return x.endsWith(key) && !splitsNumber(x, x.length - key.length);}))
          || one(FIELDS.filter(f => k(f).includes(key)))
          || FIELDS.filter(f => key.includes(k(f))).sort((a, b) => k(b).length - k(a).length)[0];
      };
      let raw = String(v).trim();
      // The master sheet writes "Legacy Park Field 1 (Tigers)" and "Legacy Park
      // Field 2A"; the evaluation form's dropdown says "Tigers - Field 1" and
      // "Field 2A". Normalise the venue prefix and the parenthetical first.
      raw = raw.replace(/^legacy\s*park\s*/i, '').trim();
      // "F2A" and "Fld 5" are "Field 2A" and "Field 5". Nothing in FIELDS
      // contains "f2a", so they never matched.
      raw = raw.replace(/^(?:f|fld\.?)\s*(?=\d)/i, 'Field ');
      const paren = raw.match(/^field\s*1\s*\((tigers|titans|broncos)\)$/i);
      if (paren) {
        const nm = paren[1][0].toUpperCase() + paren[1].slice(1).toLowerCase();
        return {name: `${nm} - Field 1`, sub: ''};
      }
      const direct = match(k(raw));
      if (direct) return {name: direct, sub: ''};

      // Try again without a trailing pitch designator.
      const m = raw.match(/^(.*?)[\s\-#_]*([12ab])$/i);
      if (m) {
        const base = match(k(m[1]));
        if (base) {
          const d = m[2].toUpperCase();
          return {name: base, sub: (d === '1' || d === 'A') ? 'A' : 'B'};
        }
      }
      return {name: raw, sub: ''};
    }
    function normDiv(v) {
      if (!v) return '';
      const r = divisionRule(v);
      if (r) return r.form;   // "Pre-K Girls" -> "PK", "5th/6th Grade Boys" -> "5th"
      const k = (x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
      const key = k(v);
      return DIVISIONS.find(d => k(d) === key) || DIVISIONS.find(d => key.includes(k(d))) || v;
    }

    /* -> "HH:MM" for the time input. Accepts 6:30 PM, 18:30, 6:30p, 630, 930a, 8.
       Three passes, most specific first: a separator anywhere, then digits run
       together (the last two are the minutes - one pattern for both read "630"
       as hour 63 and dropped it), then a bare hour. */
    function normTime(v) {
      if (!v) return '';
      const t = String(v).trim();
      const m = t.match(/(\d{1,2})\s*[:.]\s*(\d{2})\s*(a|p)?/i) || t.match(/(?:^|\D)(\d{1,2})(\d{2})(?!\d)\s*(a|p)?/i)
        || t.match(/(\d{1,2})()\s*(a|p)?/i);
      if (!m) return '';
      let h = Number(m[1]); const mi = m[2] ? Number(m[2]) : 0;
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
      // A bare "1:00" is a 1 PM kickoff, not a 1 AM one - nothing on a youth
      // schedule starts before 7 in the morning. Without this, afternoon games
      // written without AM/PM sorted ahead of the whole morning.
      if (!ap && h >= 1 && h <= 6) h += 12;
      if (h > 23 || mi > 59) return '';
      return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
    }
    /* -> "YYYY-MM-DD". Handles 9/12/2026, 9/12/26, 2026-09-12, and a bare
       9/12 (assumes the session's year). */
    function normDate(v) {
      if (!v) return '';
      const t = String(v).trim();
      let m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      if (m) {
        let y = m[3] ? Number(m[3]) : Number(S.date.slice(0, 4));
        if (y < 100) y += 2000;
        return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
      }
      return '';
    }

    /* A cell that holds a placeholder instead of a referee. */
    const NO_REF = /^(tbd|tba|open|none|n\/a|-+|\?+)$/i;
    function splitCrew(v) {
      return String(v || '').split(/[\/,;&]|\s{2,}|\band\b/i)
        .map(x => x.trim()).filter(x => x && !NO_REF.test(x));
    }

    /* rows -> games. One row is one game; its officials become a crew. */
    function rowsToGames(ignoreFilters) {
      if (!IMP) return [];
      const {rows, headerRow, map} = IMP;
      const col = (r, key) => map[key] === '' ? '' : (r[Number(map[key])] || '');
      const out = [];
      rows.slice(headerRow + 1).forEach((r, i) => {
        if (!r.some(c => c)) return;
        if (map.cancel !== '' && /^(true|yes|y|1|cancelled|canceled)$/i.test(col(r, 'cancel').trim())) return;
        let names = [], seats = null;
        if (map.crew !== '') names = splitCrew(col(r, 'crew'));
        else {
          // Remember which column each name came from. With the center's cell
          // TBD, "first name is the center" made AR 1 the CR, and the form
          // went in with the wrong position.
          seats = {CR: [], AR: []};
          [['cr', 'CR'], ['cr2', 'CR'], ['ar1', 'AR'], ['ar2', 'AR']].forEach(([k, role]) => {
            const n = col(r, k).trim();
            if (n && !NO_REF.test(n)) {names.push(n); seats[role].push(n);}
          });
        }
        const parsed = normFieldFull(col(r, 'field'));
        const field = parsed.name;
        const date = normDate(col(r, 'date'));
        if (!field && !names.length) return;
        out.push({
          key: 'g' + i, date, time: normTime(col(r, 'time')), field, sub: parsed.sub,
          division: normDiv(col(r, 'division')), rule: divisionRule(col(r, 'division')),
          names, seats,
          raw: {field: col(r, 'field'), date: col(r, 'date')}
        });
      });
      if (ignoreFilters) return out;
      return out.filter(g => {
        if (IMP.dateFilter === 'session' && g.date && g.date !== S.date) return false;
        if (IMP.fieldFilter && !IMP.fieldFilter.includes(g.field || g.raw.field || '(no field)')) return false;
        return true;
      });
    }

    /* Names from the CR columns go to center slots and names from the AR
       columns to assistant slots, each in column order. A TBD leaves its slot
       empty instead of pulling the next name across. Names with no slot of
       their own role (a second CR on a three-person crew, an AR on a dual
       one) fill whatever slots are still empty. */
    function seatOrder(roles, seats) {
      const left = {CR: seats.CR.slice(), AR: seats.AR.slice()};
      const out = roles.map(role => left[role].shift() || '');
      const rest = left.CR.concat(left.AR);
      return out.map(n => n || rest.shift() || '');
    }

    /* Write the chosen games into the session.
       Two rules that matter: a game already on the board is updated rather
       than duplicated (matched on field name plus kickoff), and a referee
       who already has notes is never renamed out from under those notes. */
    function applyGames(keys) {
      const games = rowsToGames().filter(g => keys.includes(g.key));
      let added = 0, updated = 0, protectedRefs = 0;

      /* Group by field name + kickoff FIRST. Two rows for Tigers at 8:00 are two
         pitches, not one game described twice - the old code matched the second
         row to the first entry and overwrote its referee. Within a group, a sheet
         that already names the pitch ("Tigers 2") keeps that label; otherwise the
         rows take A, B in the order they appear. */
      const groups = new Map();
      games.forEach(g => {
        const k = g.field + '|' + g.time;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(g);
      });

      groups.forEach((rows) => {
        /* A Pre-K row carries CR 1 and CR 2, which are the referees of two
           simultaneous games - so one row becomes two pitches, A and B, with one
           official each. A 1st or 2nd grade row looks identical in the sheet but
           is one game with two officials, so it becomes a single pitch. The
           division is the only thing that distinguishes them. */
        const rule = rows[0].rule;
        const perRow = rule ? rule.pitches : 1;
        const crew = rule ? rule.crew : 0;
        const multi = perRow > 1 || rows.length > 1 || rows.some(r => r.sub);
        // Rows the sheet did not letter take the first letters no row claims.
        // Counting rows instead gave "Tigers 2" plus a plain "Tigers" the same
        // B, and the second game overwrote the first one's referees.
        const named = new Set(rows.map(r => r.sub).filter(Boolean)), used = new Set();
        const nextFree = () => SUBS.find(s => !named.has(s) && !used.has(s)) || '';

        rows.forEach(g => {
          for (let k = 0; k < perRow; k++) {
            const sub = multi ? (perRow > 1 ? SUBS[k] : (g.sub || nextFree())) : '';
            used.add(sub);

            let f = S.fields.find(x => x.name === g.field && (x.sub || '') === sub &&
              (!x.time || !g.time || x.time === g.time));
            if (!f) f = S.fields.find(x => !x.name && !x.refs.some(r => r.name || r.notes.length));
            if (f) {updated++;} else {f = newField(''); S.fields.push(f); added++;}

            f.name = g.field || f.name;
            f.sub = sub;
            if (g.time) f.time = g.time;
            if (g.division) f.division = g.division;

            // Split fields take one name each, in CR order; everyone else takes
            // the whole crew. Crew size comes from the rules doc, so a slot exists
            // even when the sheet left that referee blank. With no rule, an AR
            // column in use means a three-person crew.
            const mine = perRow > 1 ? g.names.slice(k, k + 1) : g.names;
            const guess = !rule && g.seats && g.seats.AR.length ? 3 : 0;
            const want = Math.min(Math.max(crew || guess || mine.length || 3, 1), 3);
            /* Roles come from the division, not from whatever the slot used to be.
               A 2-official crew in 1st/2nd grade is DUAL REFEREE - both are centers
