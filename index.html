      const groupBtns = FIELD_GROUPS.map(g => {
        const have = g.members.filter(m => S.fields.some(f => f.name === m)).length;
        return `<button class="btn sm${have === g.members.length ? ' ghost' : ''}" style="width:auto;flex:none"
      data-addgroup="${esc(g.label)}">${esc(g.label)}</button>`;
      }).join('');
      const singles = FIELDS.filter(n => !FIELD_GROUPS.some(g => g.members.includes(n)));

      $('#sheetBody').innerHTML = `
    <div class="card">
      <label class="f"><span>Mentor/Monitor name</span>
        <input type="text" data-mentor value="${esc(S.mentor)}" placeholder="Your name" autocomplete="name" /></label>
      <label class="f"><span>Date</span><input type="date" id="sessDate" value="${esc(S.date)}" /></label>
      <button class="btn sm primary" id="openImport2" style="margin-top:12px">Import the day's schedule</button>
    </div>

    <div class="card">
      <div class="rlabel" style="font-size:12.5px;color:var(--mute);margin-bottom:6px">Theme</div>
      <div class="seg" role="group" aria-label="Theme">${THEMES.map(([k, l]) =>
          `<button data-theme-set="${k}" aria-pressed="${themeMode === k}">${l}</button>`).join('')}</div>
      <div class="hint" style="margin:8px 0 0">Sunlight is far easier to read outdoors. The &#9728;&#xFE0E; button
        in the header switches in one tap.</div>
    </div>

    ${ACCOUNTS_ON ? `<div class="card" id="acctCard">${accountCardInner()}</div>` : ''}

    <h2 class="sec">Games (${S.fields.length})</h2>
    <p class="hint">Tap a game to edit it, or &times; to delete it.</p>
    ${gameCards}

    <h2 class="sec">Add by hand</h2>
    <div style="display:flex;gap:6px;flex-wrap:wrap">${groupBtns}</div>
    <label class="f" style="margin-top:10px"><span>Single field</span>
      <select id="addSingle">
        <option value="">Choose a field to add</option>
        ${singles.map(n => `<option${S.fields.some(f => f.name === n) ? ' disabled' : ''}>${esc(n)}</option>`).join('')}
      </select></label>
    <button class="btn ghost sm" id="addField" style="margin-top:8px">Add an empty game</button>

    <div class="divider"></div>
    <button class="btn sm danger" id="newSession" style="margin-top:8px">Clear the whole session</button>
    <div class="hint" style="margin-top:8px">
      Clears every game and all in-progress notes. Saved evaluations stay.${persistent ? '' :
          ' <b>This browser is blocking storage, so notes will not survive a reload.</b>'}</div>`;
    }

    function renderImport() {
      const src = IMP ? IMP.source : 'sheet';
      const seg = `<div class="seg">
    ${[['sheet', 'Google Sheet'], ['paste', 'Paste'], ['cache', 'This browser']]
          .map(([k, l]) => `<button data-impsrc="${k}" aria-pressed="${src === k}">${l}</button>`).join('')}
  </div>`;

      let sourceUI = '';
      if (src === 'sheet') {
        const last = store.get('sideline:sheet') || {id: '', gid: ''};
        sourceUI = `
      <label class="f"><span>Spreadsheet link or ID</span>
        <input type="text" id="shId" value="${esc(last.id)}" placeholder="docs.google.com/spreadsheets/d/..." /></label>
      <label class="f"><span>Tab gid (optional - blank uses the first tab)</span>
        <input type="text" id="shGid" value="${esc(last.gid)}" placeholder="1490026671" /></label>
      <button class="btn sm primary" id="doFetch" style="margin-top:10px">Fetch the tab</button>
      <div class="hint" style="margin-top:8px">The tab has to be viewable by anyone with the link.
        A sheet only you can open will return a login page, not data. Nothing is sent anywhere -
        your phone fetches it directly and the ID stays in this browser.</div>`;
      } else if (src === 'paste') {
        sourceUI = `
      <label class="f"><span>Paste rows from the schedule</span>
        <textarea id="pasteBox" rows="5" placeholder="Select the cells in the sheet, copy, paste here">${esc(IMP && IMP.text || '')}</textarea></label>
      <button class="btn sm primary" id="doParse" style="margin-top:8px">Read these rows</button>
      <div class="hint" style="margin-top:8px">Include the header row. Tabs or commas both work.</div>`;
      } else {
        const found = scanBrowserCache();
        sourceUI = found.length
          ? found.map((c, i) => `<div class="gamerow">
          <div style="flex:1;min-width:0"><div class="g1">${esc(c.key)}</div>
          <div class="g2">${c.rows.length} rows</div></div>
          <button class="btn sm" style="width:auto" data-usecache="${i}">Use</button></div>`).join('')

         because they sit on the same domain. It comes up empty inside the Android app,
         where the origin is different.</div>`;
      }

      let mapUI = '';
      if (IMP && IMP.rows && IMP.rows.length) {
        const opts = (sel) => ['<option value="">not in this sheet</option>']
          .concat(IMP.header.map((h, i) => `<option value="${i}"${String(i) === String(sel) ? ' selected' : ''}>${esc(h || 'column ' + (i + 1))}</option>`)).join('');
        const preview = IMP.rows.slice(IMP.headerRow, IMP.headerRow + 4);
        const filtered = rowsToGames();
        if (IMP.picked === null) IMP.picked = filtered.map(g => g.key);
        const present = fieldsInImport();
        const sel = IMP.fieldFilter;
        const fieldChips = present.map(f => {
          const on = !sel || sel.includes(f.name);
          return `<button class="fchip${on ? ' on' : ''}" data-impfield="${esc(f.name)}">
        ${esc(shortField(f.name))} <span class="n">${f.n}</span></button>`;
        }).join('');

        mapUI = `
      <div class="divider"></div>
      <h2 class="sec">Check the columns</h2>
      <label class="f"><span>Header row</span>
        <select id="hdrRow">${IMP.rows.slice(0, 8).map((r, i) =>
          `<option value="${i}"${i === IMP.headerRow ? ' selected' : ''}>Row ${i + 1}: ${esc(r.slice(0, 4).filter(Boolean).join(' | ').slice(0, 40))}</option>`).join('')}</select></label>
      <div class="scrollx" style="margin:8px 0"><table class="tbl"><tbody>
        ${preview.map((r, ri) => `<tr>${r.slice(0, 8).map(c =>
            ri === 0 ? `<th>${esc(c)}</th>` : `<td>${esc(c)}</td>`).join('')}</tr>`).join('')}
      </tbody></table></div>
      <div class="map2">
        <label class="f"><span>Field</span><select data-map="field">${opts(IMP.map.field)}</select></label>
        <label class="f"><span>Time</span><select data-map="time">${opts(IMP.map.time)}</select></label>
        <label class="f"><span>Date</span><select data-map="date">${opts(IMP.map.date)}</select></label>
        <label class="f"><span>Division</span><select data-map="division">${opts(IMP.map.division)}</select></label>
      </div>
      <div class="map2">
        <label class="f"><span>CR 1</span><select data-map="cr">${opts(IMP.map.cr)}</select></label>
        <label class="f"><span>CR 2</span><select data-map="cr2">${opts(IMP.map.cr2)}</select></label>
        <label class="f"><span>AR 1</span><select data-map="ar1">${opts(IMP.map.ar1)}</select></label>
        <label class="f"><span>AR 2</span><select data-map="ar2">${opts(IMP.map.ar2)}</select></label>
        <div></div>
        <label class="f"><span>Cancelled flag</span><select data-map="cancel">${opts(IMP.map.cancel)}</select></label>
      </div>
      <label class="f"><span>Whole crew in one column</span><select data-map="crew">${opts(IMP.map.crew)}</select></label>
      <div class="hint">Crew size comes from the division, not from how many names are
        filled in. Pre-K and Kindergarten split into two pitches with one referee each;
        1st and 2nd grade are one game with two officials.</div>

      <div class="divider"></div>
      <h2 class="sec">Which fields are you monitoring</h2>
      <p class="hint">Every kickoff on the fields you pick comes in, so one pitch all
        morning arrives as three or four games. ${sel ? `Filtering to ${sel.length}
        field${sel.length === 1 ? '' : 's'}.` : 'No filter - every field in the sheet.'}</p>
      <div class="fieldstrip" style="flex-wrap:wrap;overflow:visible">${fieldChips}</div>
      <div class="row" style="margin:2px 0 10px">
        <button class="btn sm ghost" id="fieldsAll">Every field</button>

      </div>

      <h2 class="sec">Games found (${filtered.length})</h2>
      <div class="seg" style="margin-bottom:8px">
        <button data-datef="session" aria-pressed="${IMP.dateFilter === 'session'}">${esc(prettyDate(S.date))} only</button>
        <button data-datef="all" aria-pressed="${IMP.dateFilter === 'all'}">Every date</button>
      </div>
      ${filtered.length ? `<div class="row" style="margin-bottom:6px">
        <button class="btn sm ghost" id="pickAll">Select all ${filtered.length}</button>
        <button class="btn sm ghost" id="pickNone">Select none</button></div>` : ''}
      ${filtered.length ? filtered.map(g => {
              const on = IMP.picked.includes(g.key);
              return `<div class="gamerow${on ? '' : ' off'}">
          <input type="checkbox" data-pickgame="${g.key}" ${on ? 'checked' : ''} />
          <div style="flex:1;min-width:0">
            <div class="g1">${g.time ? esc(pretty12(g.time)) + ' &nbsp; ' : ''}${esc(g.field || g.raw.field || 'field not matched')}</div>
            <div class="g2">${esc(g.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no officials listed'}</div>
          </div></div>`;
            }).join('') : '<div class="empty">No games matched. Check the column mapping above, or switch to every date.</div>'}
      ${filtered.some(g => !g.field) ? `<div class="warn">Some rows did not match a field on the form's
        list. They will import with whatever the sheet said, and you can fix the field in Settings.</div>` : ''}
      ${present.length && sel && sel.length < present.length ? `<div class="hint">${present.length - sel.length}
        other field${present.length - sel.length === 1 ? '' : 's'} in this sheet are filtered out.</div>` : ''}
      <button class="btn primary" id="doApply" style="margin-top:10px">Add ${IMP.picked.length} game${IMP.picked.length === 1 ? '' : 's'} to the board</button>`;
      }

      $('#sheetBody').innerHTML = `${seg}<div class="card" style="margin-top:10px">${sourceUI}</div>${mapUI}
    <button class="btn sm ghost" id="backToSettings" style="margin-top:12px">Back to settings</button>`;
    }

    let sheetReturnFocus = null;
    function openSheet(mode) {
      const sheet = $('#sheet');
      // Remember what opened the sheet so focus returns there on close, instead
      // of dropping keyboard and screen-reader users back at the top of the page.
      if (sheet.hidden) sheetReturnFocus = document.activeElement;
      sheetMode = mode || 'settings';
      $('#scrim').hidden = false; sheet.hidden = false;
      document.body.classList.add('locked');
      renderSheet();
      sheet.scrollTop = 0;
      sheet.focus({preventScroll: true});
    }
    function closeSheet() {
      $('#scrim').hidden = true; $('#sheet').hidden = true; sheetMode = 'settings';
      document.body.classList.remove('locked');
      // Empty the sheet rather than just hiding it. A hidden element is still in
      // the document: its inputs still match selectors, and after an import that
      // means a hidden textarea holding the entire pasted schedule sits in the
      // DOM competing with the live UI. Cleared on close, rebuilt on open.
      // IMP itself is kept in memory, so reopening restores the parsed rows.
      $('#sheetBody').innerHTML = '';
      renderAll();
      const back = sheetReturnFocus; sheetReturnFocus = null;
      if (back && back.isConnected && back.focus) back.focus({preventScroll: true});
    }

    /* ============================================================
       RENDER + TABS
       ============================================================ */
    function setTab(t) {
      S.ui.tab = t; save();
      ['fields', 'observe', 'score', 'refs', 'saved'].forEach(name => {
        $('#tab-' + name).hidden = name !== t;
        const b = document.querySelector(`nav button[data-tab="${name}"]`);
        // aria-current, not aria-selected: these are plain buttons, not role="tab".
        if (b) {if (name === t) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current');}
      });
      renderAll();
      window.scrollTo({top: 0});
    }
    function renderAll() {
      renderWatching();
      if (S.ui.tab === 'fields') renderFields();
      if (S.ui.tab === 'observe') {renderMinimap(); renderObserve();}
      if (S.ui.tab === 'score') renderScore();
      if (S.ui.tab === 'refs') renderRefs();
      if (S.ui.tab === 'saved') renderSaved();
    }
    /* window.confirm() is why "Start a new session" and the remove buttons did
       nothing in the Android build: a WebView suppresses JS dialogs entirely
       unless the host app installs a WebChromeClient, so confirm() returned
       false instantly and every guarded action was skipped. It worked in the
       browser and silently failed in the APK. This replaces it with real DOM,
       which behaves the same everywhere and can be styled and tested. */
    /* opts: {tone: 'primary'} for a non-destructive yes (default is the red
       danger style), {noLabel} to rename Cancel, {onNo} to run on Cancel,
       Escape or a backdrop tap. */
    let dlgAction = null, dlgNoAction = null, dlgReturnFocus = null;
    function askConfirm(message, label, onYes, opts) {
      const o = opts || {};
      $('#dlgMsg').textContent = message;
      const yes = $('#dlgYes');
      yes.textContent = label;
      yes.className = 'btn sm ' + (o.tone === 'primary' ? 'primary' : 'danger');
      $('#dlgNo').textContent = o.noLabel || 'Cancel';
      dlgAction = onYes;
      dlgNoAction = o.onNo || null;
      dlgReturnFocus = document.activeElement;
      $('#dlg').hidden = false;
      // Focus lands on Cancel, so the choice a stray Enter hits is the safe one.
      $('#dlgNo').focus();
    }
    function closeDlg(run) {
      $('#dlg').hidden = true;
      const fn = run ? dlgAction : dlgNoAction;
      dlgAction = dlgNoAction = null;
      const back = dlgReturnFocus; dlgReturnFocus = null;
      if (fn) fn();
      // If the action opened another question, focus belongs to that one.
      if ($('#dlg').hidden && back && back.isConnected && back.focus) back.focus({preventScroll: true});
    }

    /* flash(msg) for a plain notice; flash(msg, {label, run}) adds a button,
       used for Undo. An action toast stays up longer so there is time to reach it. */
    let toastTimer = null, toastAction = null;
    function flash(msg, action) {
      const t = $('#toast'), b = $('#toastAct');
      $('#toastMsg').textContent = msg;
      toastAction = action ? action.run : null;
      b.hidden = !action;
      if (action) b.textContent = action.label;
      t.classList.toggle('act', !!action);
      t.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(hideToast, action ? 5000 : 1600);
    }
    function hideToast() {
      clearTimeout(toastTimer);
      $('#toast').classList.remove('show', 'act');
      toastAction = null;
    }

    /* ============================================================
       SCHEDULE IMPORT
       ------------------------------------------------------------
       Typing twelve referee names into a phone at the field is the
       worst part of this job, and the names already exist in the
       schedule. So: pull rows in from anywhere, map the columns once,
       and let the app build the fields and crews.
    
       Deliberately NOT hardcoded: the master spreadsheet ID. This file
       is going in a public repo, and a sheet ID is enough for a
       stranger to try the same fetch. You paste it once and it stays
       in this browser's storage instead.
    
       Three sources, one pipeline. Everything below converts its input
       to {header, rows} and then the same mapper handles it, so adding
       a fourth source later means writing one function.
       ============================================================ */
    let IMP = null;   // transient: parsed rows never get persisted to storage

    /* A real CSV parser, not a split(','). Referee schedules routinely
       contain "Smith, John" in one cell, which split would tear in half.
       This walks character by character tracking whether it is inside
       quotes, and treats a doubled quote inside a quoted field as an
       escaped quote, per RFC 4180. */
    function parseDelimited(text, delim) {
      const rows = [];
      let row = [], cell = '', inQ = false;
      for (let i = 0; i < text.length; i++) {
        const ch = text[i];
        if (inQ) {
          if (ch === '"') {
            if (text[i + 1] === '"') {cell += '"'; i++;}
            else inQ = false;
          } else cell += ch;
        } else if (ch === '"') {inQ = true;}
        else if (ch === delim) {row.push(cell); cell = '';}
        else if (ch === '\n') {row.push(cell); rows.push(row); row = []; cell = '';}
        else if (ch === '\r') { /* swallow; \n does the work */}
        else cell += ch;
      }
      if (cell.length || row.length) {row.push(cell); rows.push(row);}
      return rows.map(r => r.map(c => c.trim()));
    }

    /* Copying cells out of Google Sheets puts TABS on the clipboard, while
       a downloaded export uses commas. Guess from whichever appears more
       in the first few lines rather than making you tell us. */
    function detectDelim(text) {
      const head = text.split('\n').slice(0, 5).join('\n');
      const tabs = (head.match(/\t/g) || []).length;
      const commas = (head.match(/,/g) || []).length;
      return tabs > commas ? '\t' : ',';
    }

    const HEAD_WORDS = /date|time|field|pitch|venue|division|age|level|grade|ref|center|centre|\bcr\b|\bar\d?\b|assistant|official|crew|home|away|team/i;

    /* Schedules often have a title row, a blank row, then the real headers.
       Score the first few rows by how many cells look like column names and
       take the best; you can override it with the selector in the UI. */
    function guessHeaderRow(rows) {
      let best = 0, bestScore = -1;
      rows.slice(0, 8).forEach((r, i) => {
        const filled = r.filter(c => c).length;
        const words = r.filter(c => HEAD_WORDS.test(c)).length;
        const score = words * 3 + filled;
        if (filled >= 2 && score > bestScore) {bestScore = score; best = i;}
      });
      return best;
    }

    function autoMap(header) {
      const find = (re) => {const i = header.findIndex(h => re.test(h)); return i < 0 ? '' : String(i);};
      return {
        date: find(/date/i),
        time: find(/time|kick/i),
        field: find(/field|pitch|venue|location/i),
        division: find(/division|age|level|grade|bracket/i),
        cr: find(/\bcr\s*#?1\b|^cr$|center|centre|ref(eree)?\s*#?1|official\s*#?1/i),
        cr2: find(/\bcr\s*#?2\b|center\s*#?2|centre\s*#?2/i),
        ar1: find(/\bar\s*#?1\b|assistant\s*#?1/i),
        ar2: find(/\bar\s*#?2\b|assistant\s*#?2/i),
        crew: find(/crew|officials|referees|assignment/i),
        cancel: find(/cancel/i),
      };
    }

    /* The form's field dropdown has exact strings. A sheet might say "2A",
       "F2A", "Field 2a" or "Tigers". Normalise both sides down to letters
       and digits and match on that, so the value Sideline stores is always
       one you can actually pick on the form. */
    function normField(v) {return normFieldFull(v).name;}

    /* Returns {name, sub}. A sheet may write the two Tigers pitches as
       "Tigers 1" / "Tigers 2", or "Tigers A" / "Tigers B", or just list
       "Tigers" twice. The first two are recognised here; the third is
       resolved later by position within the kickoff. */
    function normFieldFull(v) {
      if (!v) return {name: '', sub: ''};
      const k = (x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
      const match = (key) => {
        let hit = FIELDS.find(f => k(f) === key);
        if (hit) return hit;
        hit = FIELDS.find(f => k(f).includes(key) && key.length >= 2);
        if (hit) return hit;
        return FIELDS.find(f => key.includes(k(f)));
      };
      let raw = String(v).trim();
      // The master sheet writes "Legacy Park Field 1 (Tigers)" and "Legacy Park
      // Field 2A"; the evaluation form's dropdown says "Tigers - Field 1" and
      // "Field 2A". Normalise the venue prefix and the parenthetical first.
      raw = raw.replace(/^legacy\s*park\s*/i, '').trim();
      const paren = raw.match(/^field\s*1\s*\((tigers|titans|broncos)\)$/i);
      if (paren) {
        const nm = paren[1][0].toUpperCase() + paren[1].slice(1).toLowerCase();
        return {name: `${nm} - Field 1`, sub: ''};
      }
      const direct = match(k(raw));
      if (direct) return {name: direct, sub: ''};

      // Try again without a trailing pitch designator.
      const m = raw.match(/^(.*?)[\s\-#_]*([12ab])$/i);
      if (m) {
        const base = match(k(m[1]));
        if (base) {
          const d = m[2].toUpperCase();
          return {name: base, sub: (d === '1' || d === 'A') ? 'A' : 'B'};
        }
      }
      return {name: raw, sub: ''};
    }
    function normDiv(v) {
      if (!v) return '';
      const r = divisionRule(v);
      if (r) return r.form;   // "Pre-K Girls" -> "PK", "5th/6th Grade Boys" -> "5th"
      const k = (x) => String(x).toLowerCase().replace(/[^a-z0-9]/g, '');
      const key = k(v);
      return DIVISIONS.find(d => k(d) === key) || DIVISIONS.find(d => key.includes(k(d))) || v;
    }

    /* -> "HH:MM" for the time input. Accepts 6:30 PM, 18:30, 6:30p, 630. */
    function normTime(v) {
      if (!v) return '';
      const m = String(v).match(/(\d{1,2})\s*[:.]?\s*(\d{2})?\s*(a|p)?/i);
      if (!m) return '';
      let h = Number(m[1]); const mi = m[2] ? Number(m[2]) : 0;
      const ap = (m[3] || '').toLowerCase();
      if (ap === 'p' && h < 12) h += 12;
      if (ap === 'a' && h === 12) h = 0;
      // A bare "1:00" is a 1 PM kickoff, not a 1 AM one - nothing on a youth
      // schedule starts before 7 in the morning. Without this, afternoon games
      // written without AM/PM sorted ahead of the whole morning.
      if (!ap && h >= 1 && h <= 6) h += 12;
      if (h > 23 || mi > 59) return '';
      return `${String(h).padStart(2, '0')}:${String(mi).padStart(2, '0')}`;
    }
    /* -> "YYYY-MM-DD". Handles 9/12/2026, 9/12/26, 2026-09-12, and a bare
       9/12 (assumes the session's year). */
    function normDate(v) {
      if (!v) return '';
      const t = String(v).trim();
      let m = t.match(/(\d{4})-(\d{1,2})-(\d{1,2})/);
      if (m) return `${m[1]}-${m[2].padStart(2, '0')}-${m[3].padStart(2, '0')}`;
      m = t.match(/(\d{1,2})[\/\-](\d{1,2})(?:[\/\-](\d{2,4}))?/);
      if (m) {
        let y = m[3] ? Number(m[3]) : Number(S.date.slice(0, 4));
        if (y < 100) y += 2000;
        return `${y}-${m[1].padStart(2, '0')}-${m[2].padStart(2, '0')}`;
      }
      return '';
    }

    function splitCrew(v) {
      return String(v || '').split(/[\/,;&]|\s{2,}|\band\b/i)
        .map(x => x.trim()).filter(x => x && !/^(tbd|tba|open|none|n\/a)$/i.test(x));
    }

    /* rows -> games. One row is one game; its officials become a crew. */
    function rowsToGames(ignoreFilters) {
      if (!IMP) return [];
      const {rows, headerRow, map} = IMP;
      const col = (r, key) => map[key] === '' ? '' : (r[Number(map[key])] || '');
      const out = [];
      rows.slice(headerRow + 1).forEach((r, i) => {
        if (!r.some(c => c)) return;
        if (map.cancel !== '' && /^(true|yes|y|1|cancelled|canceled)$/i.test(col(r, 'cancel').trim())) return;
        let names = [];
        if (map.crew !== '') names = splitCrew(col(r, 'crew'));
        else['cr', 'cr2', 'ar1', 'ar2'].forEach(k => {
          const n = col(r, k).trim();
          if (n && !/^(tbd|tba|open|none|n\/a)$/i.test(n)) names.push(n);
        });
        const parsed = normFieldFull(col(r, 'field'));
        const field = parsed.name;
        const date = normDate(col(r, 'date'));
        if (!field && !names.length) return;
        out.push({
          key: 'g' + i, date, time: normTime(col(r, 'time')), field, sub: parsed.sub,
          division: normDiv(col(r, 'division')), rule: divisionRule(col(r, 'division')),
          names,
          raw: {field: col(r, 'field'), date: col(r, 'date')}
        });
      });
      if (ignoreFilters) return out;
      return out.filter(g => {
        if (IMP.dateFilter === 'session' && g.date && g.date !== S.date) return false;
        if (IMP.fieldFilter && !IMP.fieldFilter.includes(g.field || g.raw.field || '(no field)')) return false;
        return true;
      });
    }

    /* Write the chosen games into the session.
       Two rules that matter: a game already on the board is updated rather
       than duplicated (matched on field name plus kickoff), and a referee
       who already has notes is never renamed out from under those notes. */
    function applyGames(keys) {
      const games = rowsToGames().filter(g => keys.includes(g.key));
      let added = 0, updated = 0, protectedRefs = 0;

      /* Group by field name + kickoff FIRST. Two rows for Tigers at 8:00 are two
         pitches, not one game described twice - the old code matched the second
         row to the first entry and overwrote its referee. Within a group, a sheet
         that already names the pitch ("Tigers 2") keeps that label; otherwise the
         rows take A, B in the order they appear. */
      const groups = new Map();
      games.forEach(g => {
        const k = g.field + '|' + g.time;
        if (!groups.has(k)) groups.set(k, []);
        groups.get(k).push(g);
      });

      groups.forEach((rows) => {
        /* A Pre-K row carries CR 1 and CR 2, which are the referees of two
           simultaneous games - so one row becomes two pitches, A and B, with one
           official each. A 1st or 2nd grade row looks identical in the sheet but
           is one game with two officials, so it becomes a single pitch. The
           division is the only thing that distinguishes them. */
        const rule = rows[0].rule;
        const perRow = rule ? rule.pitches : 1;
        const crew = rule ? rule.crew : 0;
        const multi = perRow > 1 || rows.length > 1 || rows.some(r => r.sub);
        let auto = 0;

        rows.forEach(g => {
          for (let k = 0; k < perRow; k++) {
            const sub = multi ? (perRow > 1 ? SUBS[k] : (g.sub || SUBS[auto])) : '';
            if (perRow === 1) auto++;

            let f = S.fields.find(x => x.name === g.field && (x.sub || '') === sub &&
              (!x.time || !g.time || x.time === g.time));
            if (!f) f = S.fields.find(x => !x.name && !x.refs.some(r => r.name || r.notes.length));
            if (f) {updated++;} else {f = newField(''); S.fields.push(f); added++;}

            f.name = g.field || f.name;
            f.sub = sub;
            if (g.time) f.time = g.time;
            if (g.division) f.division = g.division;

            // Split fields take one name each, in CR order; everyone else takes
            // the whole crew. Crew size comes from the rules doc, so a slot exists
            // even when the sheet left that referee blank.
            const mine = perRow > 1 ? g.names.slice(k, k + 1) : g.names;
            const want = Math.min(Math.max(crew || mine.length || 3, 1), 3);
            /* Roles come from the division, not from whatever the slot used to be.
               A 2-official crew in 1st/2nd grade is DUAL REFEREE - both are centers
               and both submit as CR. Reusing an existing slot without resetting its
               role left an AR behind and mislabelled the second official. */
            const roles = want === 1 ? ['CR']
              : want === 2 ? (crew === 2 ? ['CR', 'CR'] : ['CR', 'AR'])
                : ['CR', 'AR', 'AR'];
            for (let i = 0; i < want; i++) {
              if (!f.refs[i]) f.refs.push(newRef('CR', roles[i]));
              f.refs[i].role = roles[i];
            }
            // Keep any extra slot that already carries notes; drop empty leftovers.
            f.refs = f.refs.filter((r, i) => i < want || r.notes.length);
            mine.slice(0, f.refs.length).forEach((nm, i) => {
              const r = f.refs[i]; if (!r) return;
              if (r.notes.length && r.name.trim() && r.name.trim() !== nm) {protectedRefs++; return;}
              r.name = nm;
            });
            f.crewSize = f.refs.length;
            relabelSlots(f);
          }
        });
      });

      /* Sort by kickoff first, then
         by the form's own field order - which runs Tigers, Titans, Broncos, 2A,
         2B... i.e. roughly how you walk the complex - then by pitch. */
      const fieldIdx = (n) => {const i = FIELDS.indexOf(n); return i < 0 ? 999 : i;};
      S.fields.sort((a, b) =>
        (a.time || '99:99').localeCompare(b.time || '99:99') ||
        fieldIdx(a.name) - fieldIdx(b.name) ||
        (a.sub || '').localeCompare(b.sub || ''));

      /* Drop leftover placeholders. An unnamed field with no referee names and
         no notes holds nothing, and after importing ten games those blanks are
         just dead chips on the strip. Anything carrying data is untouched. */
      let pruned = 0;
      if (added || updated) {
        const before = S.fields.length;
        S.fields = S.fields.filter(f => f.name || f.refs.some(r => r.name.trim() || r.notes.length));
        if (!S.fields.length) S.fields.push(newField(''));
        pruned = before - S.fields.length;
      }
      if (!S.fields.some(f => f.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0].id;

      save(); renderAll();
      let msg = `${added} added, ${updated} updated`;
      if (protectedRefs) msg += `, ${protectedRefs} kept (already have notes)`;
      flash(msg);
      return {added, updated, protectedRefs, pruned};
    }

    /* ---------- source 1: a Google Sheet tab ---------- */
    function sheetCsvUrl(idOrUrl, gid) {
      const str = String(idOrUrl || '').trim();
      const m = str.match(/\/d\/([a-zA-Z0-9\-_]{20,})/);
      const id = m ? m[1] : str;
      let g = String(gid || '').trim();
      if (!g) {const gm = str.match(/[#&?]gid=(\d+)/); if (gm) g = gm[1];}
      // gviz is the read-only export endpoint; it serves CSV with a permissive
      // CORS header, which is why this works from the browser with no backend.
      return `https://docs.google.com/spreadsheets/d/${id}/gviz/tq?tqx=out:csv${g ? '&gid=' + encodeURIComponent(g) : ''}`;
    }
    async function fetchSheet(idOrUrl, gid) {
      const url = sheetCsvUrl(idOrUrl, gid);
      const res = await fetch(url, {cache: 'no-store'});
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const text = await res.text();
      if (/^\s*</.test(text)) throw new Error('Got a login page, not data');
      return text;
    }

    /* ---------- source 2: whatever is already in this browser ----------
       Whistle lives at codeoverloader.github.io/whistle/ and Sideline at
       /sideline/. localStorage is scoped to the ORIGIN, not the path, so
       they share one storage area and Sideline can read Whistle's cached
       schedule directly. Worth knowing: this only works on GitHub Pages.
       Inside the APK the origin is sideline.local, a different box
       entirely, so this source will come up empty there. */
    function scanBrowserCache() {
      const found = [];
      try {
        for (let i = 0; i < localStorage.length; i++) {
          const k = localStorage.key(i);
          if (!k || k.startsWith('sideline:')) continue;
          let v;
          try {v = JSON.parse(localStorage.getItem(k));} catch (e) {continue;}
          let arr = null;
          if (Array.isArray(v)) arr = v;
          else if (v && typeof v === 'object') {
            arr = Object.values(v).find(x => Array.isArray(x) && x.length && typeof x[0] === 'object');
          }
          if (Array.isArray(arr) && arr.length && typeof arr[0] === 'object' && !Array.isArray(arr[0])) {
            found.push({key: k, rows: arr});
          }
        }
      } catch (e) { /* storage blocked; nothing to offer */}
      return found;
    }
    /* Arrays of objects become header + rows so they feed the same mapper. */
    function objectsToTable(objs) {
      const header = [];
      objs.forEach(o => Object.keys(o).forEach(k => {if (!header.includes(k)) header.push(k);}));
      const rows = [header].concat(objs.map(o => header.map(h => {
        const v = o[h];
        return v == null ? '' : (typeof v === 'object' ? JSON.stringify(v) : String(v));
      })));
      return {header, rows};
    }

    function loadTable(rows) {
      const headerRow = guessHeaderRow(rows);
      const header = rows[headerRow] || [];
      const savedMap = store.get('sideline:map');
      const auto = autoMap(header);
      // Reuse last time's mapping only if it still points at columns that exist.
      const map = (savedMap && Object.values(savedMap).every(v => v === '' || Number(v) < header.length))
        ? {...auto, ...savedMap} : auto;
      IMP = {
        rows, headerRow, header, map, text: IMP ? IMP.text : '', source: IMP ? IMP.source : 'sheet',
        dateFilter: 'session', fieldFilter: null, picked: null
      };
      IMP.fieldFilter = defaultFieldFilter();
    }

    /* Distinct fields present in the parsed rows, with a game count each. */
    function fieldsInImport() {
      const counts = new Map();
      rowsToGames(true).forEach(g => {
        const k = g.field || g.raw.field || '(no field)';
        counts.set(k, (counts.get(k) || 0) + 1);
      });
      return [...counts.entries()].map(([name, n]) => ({name, n}))
        // Unmatched names index as -1, which used to sort them ahead of every real field.
        .sort((a, b) => {
          const i = (n) => {const x = FIELDS.indexOf(n); return x < 0 ? 999 : x;};
          return i(a.name) - i(b.name);
        });
    }

    /* You monitor one to three pitches, not the whole complex, and the same
       pitch recurs all morning. So default the filter to your fields rather
       than to everything:
         1. the fields you picked last time, if they appear in this sheet
         2. otherwise whatever is already on the board
         3. otherwise everything, for a genuinely first run
       The date filter handles "today"; this handles "mine". */
    function defaultFieldFilter() {
      const present = fieldsInImport().map(f => f.name);
      if (!present.length) return null;
      const remembered = (store.get('sideline:myfields') || []).filter(n => present.includes(n));
      if (remembered.length) return remembered;
      const onBoard = present.filter(n => S.fields.some(f => f.name === n));
      if (onBoard.length) return onBoard;
      return null;   // null = no filter
    }

    /* ============================================================
       EVENTS
       ------------------------------------------------------------
       One click listener on the document instead of hundreds on
       individual buttons. This is "event delegation": clicks bubble up
       from the element you touched to the document, so a single handler
       can read a data-* attribute off the closest matching ancestor.
       It matters here because the UI is rebuilt from strings constantly
       - listeners attached to old nodes would die with them, while this
       one keeps working on elements that did not exist when it was set.
       ============================================================ */
    document.addEventListener('click', (e) => {
      const hit = (attr) => {const el = e.target.closest(`[${attr}]`); return el ? el.getAttribute(attr) : null;};

      // Backdrops close only when the backdrop itself is tapped, never a child.
      if (e.target.id === 'scrim') {closeSheet(); return;}
      if (e.target.id === 'dlg') {closeDlg(false); return;}

      const tab = hit('data-tab'); if (tab) {setTab(tab); return;}
      if (hit('data-openpicker')) {openSheet('games'); return;}
      const themeSet = hit('data-theme-set'); if (themeSet) {setTheme(themeSet); renderSheet(); return;}
      const pick = hit('data-pick'); if (pick) {S.activeRefId = pick; save(); renderAll(); return;}
      const open = hit('data-open'); if (open) {S.activeRefId = open; save(); setTab('observe'); return;}
      const cat = hit('data-cat'); if (cat) {S.ui.cat = cat; save(); renderObserve(); return;}

      const gamePick = hit('data-game');
      if (gamePick) {
        S.ui.fieldId = gamePick;
        const f = S.fields.find(x => x.id === gamePick);
        // Move the active referee with the game, or notes would keep landing on
        // whoever was selected before the switch.
        if (f && !f.refs.some(r => r.id === S.activeRefId)) {
          const next = f.refs.find(r => r.name.trim()) || f.refs[0];
          if (next) S.activeRefId = next.id;
        }
        save(); closeSheet(); return;
      }
      const editF = hit('data-edit');
      if (editF) {S.ui.editField = S.ui.editField === editF ? null : editF; save(); renderSheet(); return;}
      const doneG = hit('data-done');
      if (doneG) {toggleDone(doneG); if (!$('#sheet').hidden) renderSheet(); return;}
      const delG = hit('data-delgame');
      if (delG) {
        // Re-render whatever is actually on screen. Only refreshing the tab behind
        // the sheet left a deleted game still listed in settings until you closed it.
        deleteGame(delG, () => {renderAll(); if (!$('#sheet').hidden) renderSheet();});
        return;
      }
      const better = hit('data-better');
      if (better) {
        const p = activePair(); if (!p) return;
        const n = p.ref.notes.find(x => x.id === better);
        if (n) {
          // Keep the original observation and add the follow-up, because both
          // belong in the report: what needed fixing, and that it got fixed.
          const up = {id: uid(), cat: n.cat, pol: 2, text: n.text, at: Date.now()};
          const ref = p.ref;
          ref.notes.push(up);
          if (!ref.commentsEdited) ref.comments = '';
          save(); renderAll(); flash('Marked improved', {label: 'Undo', run: () => dropNote(ref, up.id)});
        }
        return;
      }

      const addGroup = hit('data-addgroup');
      if (addGroup) {
        const g = FIELD_GROUPS.find(x => x.label === addGroup); if (!g) return;
        let n = 0;
        g.members.forEach(m => {
          if (!S.fields.some(f => f.name === m) && addFieldEntry(m, '', 3)) n++;
        });
        save(); renderSheet(); flash(n ? `${n} pitch${n === 1 ? '' : 'es'} added` : 'Already on the board'); return;
      }

      const pitches = hit('data-pitches');
      if (pitches) {
        const [fid, want] = pitches.split('|');
        const base = S.fields.find(x => x.id === fid); if (!base) return;
        const group = groupOf(base);
        const n = Number(want);
        if (group.length === n) {return;}
        if (n > group.length) {
          for (let i = group.length; i < n; i++) {
            const f = newField(base.name);
            f.sub = SUBS[i]; f.division = base.division; f.time = base.time;
            f.refs = [newRef('CR', 'CR')]; f.crewSize = 1;
            S.fields.push(f);
          }
          // The first pitch needs its label too, or you get "Tigers" and "Tigers B".
          group.forEach((pf, i) => {if (!pf.sub) pf.sub = SUBS[i];});
        } else {
          const doomed = group.slice(n).filter(pf => pf.refs.some(r => r.notes.length || r.name.trim()));
          const drop = () => {
            const ids = group.slice(n).map(pf => pf.id);
            S.fields = S.fields.filter(x => !ids.includes(x.id));
            if (n === 1) {const keep = S.fields.find(x => x.id === group[0].id); if (keep) keep.sub = '';}
            if (!S.fields.some(x => x.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0] && S.fields[0].id;
            save(); renderSheet();
          };
          if (doomed.length) {
            askConfirm(`Removing ${group.length - n} pitch(es) deletes ${doomed.length} referee(s) with data on them.`, 'Remove', drop);
            return;
          }
          drop(); return;
        }
        if (!S.fields.some(x => x.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0] && S.fields[0].id;
        save(); renderSheet(); return;
      }

      const impSrc = hit('data-impsrc');
      if (impSrc) {
        if (!IMP) IMP = {rows: null, header: [], map: {}, text: '', source: impSrc, dateFilter: 'session', fieldFilter: null, picked: null};
        IMP.source = impSrc; renderImport(); return;
      }
      const useCache = hit('data-usecache');
      if (useCache) {
        const found = scanBrowserCache()[Number(useCache)]; if (!found) return;
        const t = objectsToTable(found.rows);
        const keep = IMP ? IMP.source : 'cache';
        IMP = null; loadTable(t.rows); IMP.source = keep;
        renderImport(); flash(`Read ${found.rows.length} rows`); return;
      }
      const dateF = hit('data-datef');
      if (dateF && IMP) {IMP.dateFilter = dateF; IMP.picked = null; renderImport(); return;}

      const impField = hit('data-impfield');
      if (impField && IMP) {
        const present = fieldsInImport().map(f => f.name);
        // A null filter means "everything"; make it explicit before toggling one off,
        // otherwise the first tap would read as deselecting from an empty set.
        let sel = IMP.fieldFilter ? IMP.fieldFilter.slice() : present.slice();
        sel = sel.includes(impField) ? sel.filter(n => n !== impField) : sel.concat([impField]);
        IMP.fieldFilter = sel.length === present.length ? null : sel;
        IMP.picked = null; renderImport(); return;
      }
      const pol = hit('data-pol'); if (pol) {S.ui.pol = Number(pol); save(); renderObserve(); return;}

      const chip = hit('data-chip');
      if (chip) {
        const [catId, idx] = chip.split('|');
        const p = activePair(); if (!p) return;
        const list = CHIPS.filter(c => c.cat === catId && (!c.pos || c.pos === p.ref.role));
        // With the arrow selected, any chip logs as an improvement instead of
        // its own polarity - that is how "better X second half" gets recorded.
        const c = list[Number(idx)]; if (c) addNote(c.cat, S.ui.pol === 2 ? 2 : c.pol, c.text);
        return;
      }
      const del = hit('data-del');
      if (del) {
        const p = activePair(); if (!p) return;
        const ref = p.ref, idx = ref.notes.findIndex(n => n.id === del); if (idx < 0) return;
        const [gone] = ref.notes.splice(idx, 1);
        if (!ref.commentsEdited) ref.comments = '';
        save(); renderAll();
        // Undo instead of a confirm dialog: deleting stays one tap, and a slip costs nothing.
        flash('Note deleted', {
          label: 'Undo', run: () => {
            ref.notes.splice(Math.min(idx, ref.notes.length), 0, gone);
            if (!ref.commentsEdited) ref.comments = '';
            save(); renderAll();
          }
        });
        return;
      }
      const rate = hit('data-rate');
      if (rate) {
        const [cid, v] = rate.split('|');
        const p = activePair(); if (!p) return;
        p.ref.ratings[cid] = p.ref.ratings[cid] === Number(v) ? null : Number(v);
        save(); renderScore(); return;
      }
      const move = hit('data-move');
      if (move) {
        const p = activePair(); if (!p) return;
        p.ref.moveUp = p.ref.moveUp === move ? null : move;
        save(); renderScore(); return;
      }
      const role = hit('data-role');
      if (role) {
        const [rid, rv] = role.split('|');
        S.fields.forEach(f => {
          if (f.refs.some(r => r.id === rid)) {
            f.refs.forEach(r => {if (r.id === rid) r.role = rv;});
            relabelSlots(f);
          }
        });
        save(); renderSheet(); return;
      }
      const crew = hit('data-crew');
      if (crew) {const [fid, n] = crew.split('|'); setCrewSize(fid, Number(n)); renderSheet(); return;}
      const copySaved = hit('data-copysaved');
      if (copySaved) {
        const r = HIST.find(x => x.id === copySaved); if (r) copyText(formText(r), 'Evaluation');
        return;
      }
      const dropSaved = hit('data-dropsaved');
      if (dropSaved) {
        const rec = HIST.find(x => x.id === dropSaved); if (!rec) return;
        const shared = !!rec.syncedAt || (isApproved() && uploadConsent() === true);
        askConfirm(`Delete this saved evaluation? It is gone for good${shared
          ? ', from this device and from the shared league records' : ''}.`, 'Delete', () => {
            HIST = HIST.filter(x => x.id !== dropSaved);
            queueRemoteDelete(rec);
            histChanged(); save(); renderSaved(); syncNow();
          });
        return;
      }

      const prof = hit('data-profile'); if (prof) {openProfile(prof); return;}
      const refSort = hit('data-refsort'); if (refSort) {REFS_UI.sort = refSort; renderRefs(); return;}
      const approve = hit('data-approve');
      if (approve) {adminCall('set_mentor_role', {p_mentor: approve, p_role: 'mentor'}, 'Approved'); return;}
      const reject = hit('data-reject');
      if (reject) {
        askConfirm('Reject this sign-up and delete the account? They can ask again later.', 'Reject',
          () => adminCall('remove_mentor', {p_mentor: reject}, 'Sign-up removed'));
        return;
      }
      const roleSet = hit('data-role-set');
      if (roleSet) {
        const [mid, role] = roleSet.split('|');
        const go = () => adminCall('set_mentor_role', {p_mentor: mid, p_role: role},
          role === 'admin' ? 'Now an admin' : 'Now a mentor');
        if (role === 'admin') {
          askConfirm('Make this mentor an admin? Admins can approve and remove mentors, merge referees and ' +
            'delete records.', 'Make admin', go, {tone: 'primary'});
        } else go();
        return;
      }
      const revoke = hit('data-revoke');
      if (revoke) {
        askConfirm('Revoke access? They can no longer upload or read shared evaluations until approved again. ' +
          'Evaluations they already uploaded stay.', 'Revoke',
          () => adminCall('set_mentor_role', {p_mentor: revoke, p_role: 'pending'}, 'Access revoked'));
        return;
      }

      /* Resolve to the BUTTON, not the exact node under the finger. Switching on
         e.target.id meant a tap on text inside a button - the game bar is almost
         all text - landed on a child with no id and did nothing. */
      const btn = e.target.closest('button[id]');
      switch (btn ? btn.id : '') {
        case 'openSettings': case 'openSettings2': openSheet('settings'); return;
        case 'openPicker': openSheet('games'); return;
        case 'themeToggle':
          setTheme(isLight() ? 'dark' : 'light');
          if (!$('#sheet').hidden && sheetMode === 'settings') renderSheet();
          return;
        case 'toastAct': {const fn = toastAction; hideToast(); if (fn) fn(); return;}
        case 'toggleDone': S.ui.showDone = !S.ui.showDone; save(); renderPicker(); return;
        case 'dlgYes': closeDlg(true); return;
        case 'dlgNo': closeDlg(false); return;
        case 'openImport': case 'openImport2': openSheet('import'); return;
        case 'backToSettings': sheetMode = 'settings'; renderSheet(); $('#sheet').scrollTop = 0; return;
        case 'dateToday': S.date = todayISO(); save(); renderAll(); flash('Session date set to today'); return;
        case 'dateKeep': S.ui.keepDate = todayISO(); save(); renderAll(); return;
        case 'dateFresh':
          askConfirm('Clear the old games and in-progress notes and start today? Saved evaluations are kept.',
            'Start fresh', () => {S = blankSession(); save(); setTab('fields');});
          return;
        case 'backupFile': case 'backupFile2':
          saveFile(`sideline-backup-${todayISO()}.json`, backupText(), 'application/json')
            .then(ok => {if (ok) markBackedUp();});
          return;
        case 'backupCopy': copyText(backupText(), 'Backup').then(ok => {if (ok) markBackedUp();}); return;
        case 'restoreFile': $('#restoreInput').click(); return;
        case 'restorePaste': restoreBackup($('#restoreText').value); return;
        case 'openAccount':
          openSheet('settings');
          requestAnimationFrame(() => {const c = $('#acctCard'); if (c) c.scrollIntoView({block: 'start'});});
          return;
        case 'acctSend': case 'acctResend': sendCode(); return;
        case 'acctVerify': verifyCode(); return;
        case 'acctBack': Object.assign(acctUI, {step: 'email', code: '', error: '', notice: ''}); paintAcctCard(true); return;
        case 'acctCheck':
          refreshMentor().then(() => flash(isApproved() ? 'Approved'
            : acctUI.offline ? 'No connection' : 'Still waiting for approval'));
          return;
        case 'acctSignOut': signOut(); return;
        case 'openAdmin': sheetMode = 'admin'; renderSheet(); loadMentors(); $('#sheet').scrollTop = 0; return;
        case 'adminReload': loadMentors(); return;
        case 'uploadOn': setUploadConsent(true); syncNow(); renderSaved(); return;
        case 'syncRetry': SYNC.backoff = 0; syncNow(); return;
        case 'refsRefresh':
          pullLeague('force').then(() => flash(pullError || 'Profiles updated'));
          renderRefs();
          return;
        case 'doMerge': mergeIntoProfile(); return;
        case 'deleteRefRecords': deleteProfileRecords(); return;
        case 'doFetch': {
          const id = $('#shId').value, gid = $('#shGid').value;
          if (!id.trim()) {flash('Paste the link or ID first'); return;}
          store.set('sideline:sheet', {id, gid});
          flash('Fetching...');
          fetchSheet(id, gid).then(text => {
            const rows = parseDelimited(text, detectDelim(text));
            if (!rows.length) throw new Error('empty');
            const keep = IMP ? IMP.source : 'sheet';
            IMP = null; loadTable(rows); IMP.source = keep;
            renderImport(); flash(`Read ${rows.length} rows`);
          }).catch(err => {
            flash('Could not read that tab');
            const box = $('#sheetBody');
            if (box) box.insertAdjacentHTML('afterbegin',
              `<div class="warn">Fetch failed: ${esc(err.message)}. Check the tab is shared with
           anyone who has the link, and that the gid matches the tab you want. You can always
           copy the cells and use Paste instead.</div>`);
          });
          return;
        }
        case 'doParse': {
          const text = $('#pasteBox').value;
          if (!text.trim()) {flash('Nothing pasted yet'); return;}
          const rows = parseDelimited(text, detectDelim(text));
          const keep = 'paste';
          IMP = null; loadTable(rows); IMP.source = keep; IMP.text = text;
          renderImport(); flash(`Read ${rows.length} rows`); return;
        }
        case 'fieldsAll':
          if (IMP) {IMP.fieldFilter = null; IMP.picked = null; renderImport();}
          return;
        case 'fieldsBoard': {
          if (!IMP) return;
          const present = fieldsInImport().map(f => f.name);
          const onBoard = present.filter(n => S.fields.some(f => f.name === n));
          if (!onBoard.length) {flash('No fields from this sheet are on the board yet'); return;}
          IMP.fieldFilter = onBoard; IMP.picked = null; renderImport(); return;
        }
        case 'pickAll':
          if (IMP) {IMP.picked = rowsToGames().map(g => g.key); renderImport();}
          return;
        case 'pickNone':
          if (IMP) {IMP.picked = []; renderImport();}
          return;
        case 'doApply': {
          if (!IMP || !IMP.picked || !IMP.picked.length) {flash('Nothing selected'); return;}
          store.set('sideline:map', IMP.map);
          // Remember which pitches you monitor so next week's import defaults to them.
          const chosen = [...new Set(rowsToGames().filter(g => IMP.picked.includes(g.key))
            .map(g => g.field || g.raw.field).filter(Boolean))];
          if (chosen.length) store.set('sideline:myfields', chosen);
          applyGames(IMP.picked);
          closeSheet(); setTab('fields'); return;
        }
        case 'closeSheet': closeSheet(); return;
        case 'addField':
          // No cap: monitoring a full slate means every field with a game on it.
          S.fields.push(newField('')); save(); renderSheet(); return;
        case 'newSession':
          askConfirm('Clear every game and all in-progress notes? Saved evaluations are kept.',
            'Clear everything', () => {S = blankSession(); save(); closeSheet(); setTab('fields');});
          return;
        case 'addNote':
          addNote(S.ui.cat, S.ui.pol, $('#noteText').value);
          return;
        case 'toScore': setTab('score'); return;
        case 'rebuild': {
          const p = activePair(); if (!p) return;
          p.ref.comments = buildComments(p.ref, p.field); p.ref.commentsEdited = false;
          save(); renderScore(); return;
        }
        case 'copyComments': {
          const p = activePair(); if (p) copyText(p.ref.comments, 'Comments'); return;
        }
        case 'copyAll': {
          const p = activePair(); if (p) copyText(formBlock(p.field, p.ref), 'Evaluation'); return;
        }
        case 'saveEval': saveEval(); return;
        case 'exportCsv': exportCSV(); return;
        case 'openForm': case 'openForm2': window.open(FORM_URL, '_blank', 'noopener'); return;
      }
    });

    /* Text and select changes. These deliberately do NOT re-render the
       whole tab: rebuilding the HTML mid-typing would rip focus out of
       the field under your thumb. State updates, disk write is debounced,
       and only the dependent header text is refreshed. */
    document.addEventListener('input', (e) => {
      const t = e.target;
      const nameFor = t.getAttribute && t.getAttribute('data-name');
      if (nameFor) {
        allRefs().forEach(({ref}) => {if (ref.id === nameFor) ref.name = t.value;});
        save(); renderWatching(); return;
      }
      if (t.id === 'noteText') {S.ui.draftText = t.value; save(); return;}
      if (t.id === 'pasteBox' && IMP) {IMP.text = t.value; return;}
      if (t.hasAttribute && t.hasAttribute('data-mentor')) {S.mentor = t.value; save(); return;}
      if (t.id === 'acctEmail') {acctUI.email = t.value; return;}
      if (t.id === 'acctCode') {acctUI.code = t.value; return;}
      if (t.id === 'refSearch') {REFS_UI.q = t.value; $('#refsList').innerHTML = refsListHTML(); return;}
      if (t.id === 'comments') {
        const p = activePair(); if (!p) return;
        p.ref.comments = t.value; p.ref.commentsEdited = true; save();
        // Patch the counter, checklist and save state in place. The count used
        // to freeze at its render-time value; a full re-render would drop the keyboard.
        $('#charCount').textContent = charCountText(t.value);
        $('#readyBox').innerHTML = readyHTML(p.field, p.ref);
        paintSaveState(p.field, p.ref);
        return;
      }
    });
    document.addEventListener('change', (e) => {
      const t = e.target, g = (a) => t.getAttribute && t.getAttribute(a);
      const fn = g('data-fname'), fd = g('data-fdiv'), ft = g('data-ftime');
      if (fn || fd || ft) {
        const f = S.fields.find(x => x.id === (fn || fd || ft)); if (!f) return;
        if (fn) f.name = t.value;
        if (fd) f.division = t.value;
        if (ft) f.time = t.value;
        // Refresh the game's heading in place; it used to keep showing the old
        // field and kickoff until the sheet was closed and reopened.
        document.querySelectorAll(`[data-gamehead="${f.id}"]`)
          .forEach(el => {el.innerHTML = gameHeadHTML(f, el.hasAttribute('data-withtime'));});
        save(); return;
      }
      if (t.id === 'sessDate') {S.date = t.value; save(); if (sheetMode === 'import') renderImport(); return;}
      const mapKey = g('data-map');
      if (mapKey && IMP) {
        IMP.map[mapKey] = t.value; IMP.picked = null; renderImport(); return;
      }
      if (t.id === 'hdrRow' && IMP) {
        IMP.headerRow = Number(t.value);
        IMP.header = IMP.rows[IMP.headerRow] || [];
        IMP.map = autoMap(IMP.header); IMP.picked = null;
        // The field filter was built from the old header's columns; rebuild it too.
        IMP.fieldFilter = defaultFieldFilter();
        renderImport(); return;
      }
      const pickGame = g('data-pickgame');
      if (pickGame && IMP) {
        IMP.picked = t.checked ? IMP.picked.concat([pickGame]) : IMP.picked.filter(k => k !== pickGame);
        renderImport(); return;
      }
      if (t.id === 'addSingle') {
        const name = t.value; if (!name) return;
        if (S.fields.some(f => f.name === name)) {flash('Already on the board'); return;}
        addFieldEntry(name, '', 3);
        save(); renderSheet(); flash(name + ' added'); return;
      }
      if (t.id === 'acctUpload') {
        setUploadConsent(t.checked);
        if (t.checked) syncNow();
        paintAcctCard(true);
        if (S.ui.tab === 'saved') renderSaved();
        return;
      }
      if (t.id === 'restoreInput') {
        const file = t.files && t.files[0];
        t.value = '';   // so choosing the same file again still fires change
        if (file) file.text().then(restoreBackup).catch(() => flash('Could not read that file'));
        return;
      }
      if (t.id === 'noOff') {
        const p = activePair(); if (!p) return;
        p.ref.noOffsides = t.checked;
        // Checking forces the form's "1 if no offsides"; unchecking has to release
        // that forced 1, not leave it behind looking like a real rating.
        p.ref.ratings.offsides = t.checked ? 1 : null;
        if (!p.ref.commentsEdited) p.ref.comments = buildComments(p.ref, p.field);
        save(); renderScore(); return;
      }
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        if (!$('#dlg').hidden) {closeDlg(false); return;}
        if (!$('#sheet').hidden) {closeSheet(); return;}
      }
      if (e.key === 'Enter' && e.target.id === 'noteText') {
        e.preventDefault(); addNote(S.ui.cat, S.ui.pol, e.target.value);
      }
      if (e.key === 'Enter' && e.target.id === 'acctEmail' && !acctUI.busy) {e.preventDefault(); sendCode();}
      if (e.key === 'Enter' && e.target.id === 'acctCode' && !acctUI.busy) {e.preventDefault(); verifyCode();}
      // SVG markers are not buttons, so give them keyboard equivalence. Only the
      // <g> markers: real buttons with data-pick already click on Enter/Space,
      // and matching them here ran every keyboard selection twice.
      const mk = e.target.closest && e.target.closest('g[data-pick]');
      if ((e.key === 'Enter' || e.key === ' ') && mk) {
        e.preventDefault();
        S.activeRefId = mk.getAttribute('data-pick');
        save(); renderAll();
      }
    });

    /* ---------- start ---------- */
    applyTheme();
    setTab(S.ui.tab || 'fields');
    // Settings no longer pops open on every launch that lacks a named game; the
    // Fields tab has its own first-run card for your name and the import.

    // Accounts start after the first paint and never block it.
    paintAccount();
    initAccounts();
    window.addEventListener('online', () => {initAccounts().then(refreshMentor); paintSync();});
    window.addEventListener('offline', paintSync);
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible' && isApproved()) {syncNow(); pullLeague();}
    });

    /* The service worker earns its keep on GitHub Pages. Inside the Android
       shell the assets are already on the device, so registering it would
       only add a second cache layer that can serve stale HTML after an
       app update. Skip it there. */
    if ('serviceWorker' in navigator && location.protocol.startsWith('http')
      && location.hostname !== 'sideline.local') {
      navigator.serviceWorker.register('sw.js').catch(() => { });
    }
  </script>
</body>
