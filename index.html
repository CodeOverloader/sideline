<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Sideline — Referee Evaluation Notes</title>

  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon.svg" />
  <meta name="theme-color" content="#0b0d10" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Sideline" />

  <script>
    /* The custom domain also answers on plain http, and GitHub Pages sends the
       old codeoverloader.github.io address there. Over http there is no service
       worker (so nothing works without signal), no clipboard API, and a storage
       box separate from the https site's. Move to https - unless this http copy
       already holds Sideline data, which a move would strand; that stays put so
       it can be backed up first. */
    (function () {
      if (location.protocol !== 'http:' || location.hostname !== 'sideline.codeoverload.dev') return;
      try {
        if (localStorage.getItem('sideline:session') || localStorage.getItem('sideline:history')) return;
      } catch (e) { }
      location.replace('https://' + location.host + location.pathname + location.search + location.hash);
    })();

    /* Set the theme before first paint, so someone using the sunlight theme
       never sees a flash of the dark UI. The full theme logic (and the toggle)
       lives in the main script; this only has to agree with it. */
    (function () {
      var mode = 'dark';
      try { mode = JSON.parse(localStorage.getItem('sideline:theme')) || 'dark'; } catch (e) { }
      var prefersDark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
      var light = mode === 'light' || (mode === 'auto' && !prefersDark);
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">

  <style>
    /* ============================================================
   DESIGN TOKENS
   A "token" is just a named value you use everywhere instead of
   repeating a literal. Change --primary once and every button,
   ring, and active marker follows. Whistle is amber; Sideline is
   sky blue on purpose so the two home-screen icons and the two
   apps never get confused at a glance.
   ============================================================ */
    :root {
      /* color-scheme tells the browser to draw native controls (the date and
         time pickers, scrollbars) for a dark page. Without it the calendar
         icon in the date input is black on a near-black field. */
      color-scheme: dark;
      --bg: #0b0d10;
      --panel: #14181d;
      --panel2: #1b2127;
      --line: #242c34;
      --ink: #e9eef3;
      --mute: #8b98a5;
      --primary: #38bdf8;
      /* structure, active selection */
      --plus: #34d399;
      /* a strength */
      --minus: #fb923c;
      /* something to work on (orange, not red: not an error) */
      --grass: #0f1d17;
      /* pitch fill */
      --chalk: rgba(233, 238, 243, .22);
      /* text sitting on a filled primary / plus / minus surface */
      --on-primary: #06212e;
      --on-plus: #04241a;
      --on-minus: #251100;
      /* translucent accents, so tints follow the theme too */
      --primary-faint: rgba(56, 189, 248, .04);
      --primary-tint: rgba(56, 189, 248, .1);
      --primary-strong: rgba(56, 189, 248, .16);
      --primary-line: rgba(56, 189, 248, .38);
      --minus-tint: rgba(251, 146, 60, .1);
      --minus-line: rgba(251, 146, 60, .38);
      --glass: rgba(11, 13, 16, .94);
      --scrim: rgba(0, 0, 0, .62);
      --marker-ring: #e9eef3;
      --r: 12px;
      --pad: 14px;

      /* ---------- TYPE SCALE ----------
         Sizes are in rem, not px, on purpose. 1rem = whatever the phone's
         browser has been told a "normal" letter is, so a mentor who has set
         their phone to Large text gets larger text HERE too. Fixed px ignores
         that setting entirely, which is exactly backwards for this audience.
         Seven steps, and nothing below --fs-xs: a design "scale" just means a
         short list of allowed sizes, so the app never drifts into 11.5px. */
      --fs-xs: 0.8125rem;
      /* 13px - the floor. Captions, counts, pills. */
      --fs-sm: 0.875rem;
      /* 14px - secondary text, hints */
      --fs-md: 0.9375rem;
      /* 15px - dense UI labels */
      --fs-base: 1rem;
      /* 16px - body. Also the iOS no-zoom floor for inputs. */
      --fs-lg: 1.125rem;
      /* 18px - card titles */
      --fs-xl: 1.25rem;
      /* 20px - section headings */
      --fs-2xl: 1.625rem;
      /* 26px - brand */
      --fs-3xl: 1.875rem;
      /* 30px - display */

      /* Minimum comfortable touch target. Apple asks for 44px, Material for
         48. Everything you can tap is held to this, because the app is used
         one-handed, outdoors, often by someone wearing reading glasses. */
      --tap: 44px;
    }

    /* SUNLIGHT theme. A dark screen washes out in direct sun, which is exactly
       where this app gets used. Same structure with the ground inverted, and
       every accent darkened until its text clears WCAG AA on white. */
    :root[data-theme="light"] {
      color-scheme: light;
      --bg: #eef2f5;
      --panel: #ffffff;
      --panel2: #f4f7f9;
      --line: #c5d0d9;
      --ink: #0b1218;
      --mute: #4a5764;
      --primary: #0369a1;
      --plus: #047857;
      --minus: #c2410c;
      --grass: #d7ecdf;
      --chalk: rgba(11, 18, 24, .34);
      --on-primary: #ffffff;
      --on-plus: #ffffff;
      --on-minus: #ffffff;
      --primary-faint: rgba(3, 105, 161, .03);
      --primary-tint: rgba(3, 105, 161, .08);
      --primary-strong: rgba(3, 105, 161, .14);
      --primary-line: rgba(3, 105, 161, .45);
      --minus-tint: rgba(194, 65, 12, .07);
      --minus-line: rgba(194, 65, 12, .4);
      --glass: rgba(238, 242, 245, .95);
      --scrim: rgba(11, 18, 24, .45);
      --marker-ring: #0b1218;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent
    }

    html,
    body {
      margin: 0;
      padding: 0
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: Inter, system-ui, -apple-system, sans-serif;
      font-size: var(--fs-base);
      line-height: 1.5;
      max-width: 600px;
      margin: 0 auto;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
      -webkit-font-smoothing: antialiased;
    }

    button,
    input,
    select,
    textarea {
      font-family: inherit;
      font-size: inherit;
      color: inherit
    }

    button {
      cursor: pointer;
      border: none;
      background: none
    }

    :focus-visible {
      outline: 2px solid var(--primary);
      outline-offset: 2px
    }

    @media (prefers-reduced-motion:reduce) {
      * {
        transition: none !important;
        animation: none !important
      }
    }

    /* ---------- app chrome ---------- */
    header {
      position: sticky;
      top: 0;
      z-index: 40;
      background: var(--glass);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--line);
      padding: calc(8px + env(safe-area-inset-top)) var(--pad) 0;
    }

    .brandrow {
      display: flex;
      align-items: center;
      gap: 10px;
      /* Collapses on scroll - see header.tuck below. */
      max-height: 56px;
      overflow: hidden;
      transition: max-height .18s ease, opacity .18s ease, margin .18s ease;
    }

    /* Scrolling down tucks the brand row away and leaves only the "now
       watching" bar stuck to the top; scrolling up brings it back. This is the
       same thing Twitter, Instagram and Reddit do, and it matters more here
       than on any of them: the header was eating a third of the screen before
       the first note chip, on the one screen you use while a game is running.
       The watching bar itself never hides - it is the attribution safeguard. */
    header.tuck .brandrow {
      max-height: 0;
      opacity: 0;
      margin-top: -4px;
    }

    header.tuck .watching {
      margin-top: 4px
    }

    .brand {
      font-family: 'Bebas Neue', sans-serif;
      font-size: var(--fs-2xl);
      letter-spacing: .06em;
      line-height: 1
    }

    .brand span {
      color: var(--primary)
    }

    .brandrow .spacer {
      flex: 1
    }

    .iconbtn {
      width: var(--tap);
      height: var(--tap);
      border-radius: 10px;
      border: 1px solid var(--line);
      background: var(--panel);
      display: grid;
      place-items: center;
      font-size: var(--fs-base);
    }

    /* the "now watching" bar: the single most important element in the app.
   Two fields of simultaneous refs is exactly how notes end up on the
   wrong person, so attribution is always on screen. */
    .watching[hidden] {
      display: none
    }

    .watching {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      padding: 9px 11px;
      border-radius: var(--r);
      background: linear-gradient(90deg, var(--primary-strong), var(--primary-faint));
      border: 1px solid var(--primary-line);
    }

    .watching .who {
      font-weight: 650;
      font-size: var(--fs-md);
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .watching .sub {
      font-size: var(--fs-xs);
      color: var(--mute);
      line-height: 1.2
    }

    .watching .rolechip {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      font-weight: 700;
      background: var(--primary);
      color: var(--on-primary);
      padding: 3px 7px;
      border-radius: 6px;
    }

    .watching .clk {
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-sm);
      font-weight: 700;
      color: var(--primary);
      white-space: nowrap;
    }

    /* "idle", not "empty": the generic .empty rule further down is for
       empty-state messages and was centring and re-padding this bar. */
    .watching.idle {
      background: var(--panel);
      border-color: var(--line)
    }

    .watching.idle .who {
      color: var(--mute);
      font-weight: 500
    }

    /* ---------- tabs / nav ---------- */
    nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 50;
      display: flex;
      max-width: 600px;
      margin: 0 auto;
      background: var(--glass);
      backdrop-filter: blur(10px);
      border-top: 1px solid var(--line);
      padding-bottom: env(safe-area-inset-bottom);
    }

    nav button {
      flex: 1;
      padding: 8px 2px 10px;
      min-height: var(--tap);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      color: var(--mute);
      font-size: var(--fs-xs);
      font-weight: 600;
    }

    nav button .ico {
      width: 24px;
      height: 24px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* The selected tab gets a heavier stroke as well as the accent colour, so
       it still reads as selected for anyone who cannot separate the two hues. */
    nav button[aria-current="page"] .ico {
      stroke-width: 2.2
    }

    nav button[aria-current="page"] {
      color: var(--primary)
    }

    main {
      padding: 0 var(--pad)
    }

    .tab[hidden] {
      display: none
    }

    /* ---------- generic bits ---------- */
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: var(--pad);
      margin: 12px 0
    }

    h2.sec {
      font-family: 'Bebas Neue', sans-serif;
      font-size: var(--fs-xl);
      letter-spacing: .04em;
      margin: 18px 0 4px;
      font-weight: 400
    }

    .hint {
      color: var(--mute);
      font-size: var(--fs-sm);
      margin: 2px 0 10px
    }

    .app-version {
      color: var(--mute);
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      text-align: center;
      margin: 18px 0 4px
    }

    label.f {
      display: block;
      margin: 10px 0 0
    }

    label.f>span {
      display: block;
      font-size: var(--fs-sm);
      color: var(--mute);
      margin-bottom: 4px
    }

    input[type=text],
    input[type=email],
    input[type=search],
    input[type=date],
    input[type=time],
    select,
    textarea {
      width: 100%;
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 11px;
      min-height: var(--tap);
      /* iOS Safari zooms the whole page into any input under 16px and does
         not zoom back out, which throws the layout off mid-game. --fs-base is
         1rem, so this stays at or above 16px however the phone is set. */
      font-size: var(--fs-base);
    }

    textarea {
      resize: vertical;
      line-height: 1.5
    }

    .row {
      display: flex;
      gap: 8px
    }

    .row>* {
      flex: 1;
      min-width: 0
    }

    .btn {
      background: var(--panel2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px 14px;
      min-height: var(--tap);
      font-weight: 600;
      text-align: center;
      display: block;
      width: 100%;
    }

    .btn.primary {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary)
    }

    .btn.ghost {
      background: transparent
    }

    .btn.danger {
      color: var(--minus);
      border-color: var(--minus-line)
    }

    .btn:disabled {
      opacity: .45;
      cursor: default
    }

    a.btn {
      color: inherit;
      text-decoration: none
    }

    .btn.sm {
      /* "sm" is about visual weight, not about being hard to hit: the text and
         padding are smaller, but min-height keeps the target at --tap. */
      padding: 8px 12px;
      min-height: var(--tap);
      font-size: var(--fs-sm);
      font-weight: 600
    }

    .pill {
      display: inline-block;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      padding: 2px 6px;
      border-radius: 5px;
      background: var(--panel2);
      color: var(--mute);
    }

    .divider {
      height: 1px;
      background: var(--line);
      margin: 14px -14px
    }

    .empty {
      color: var(--mute);
      font-size: var(--fs-sm);
      text-align: center;
      padding: 22px 10px
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: calc(96px + env(safe-area-inset-bottom));
      transform: translateX(-50%);
      z-index: 90;
      background: var(--ink);
      color: var(--bg);
      font-weight: 650;
      font-size: var(--fs-sm);
      padding: 9px 15px;
      border-radius: 20px;
      box-shadow: 0 6px 22px rgba(0, 0, 0, .35);
      display: flex;
      align-items: center;
      gap: 12px;
      width: max-content;
      max-width: calc(100vw - 32px);
      opacity: 0;
      pointer-events: none;
      transition: opacity .16s, transform .16s;
    }

    .toast.show {
      opacity: 1;
      transform: translateX(-50%) translateY(-4px)
    }

    /* With a sheet open, "bottom: 96px" lands in the middle of the sheet and
       covers whatever button is there - during the import that is the one you
       are meant to press next. Move it to the top while a sheet is up. */
    body.locked .toast {
      bottom: auto;
      top: calc(12px + env(safe-area-inset-top))
    }

    body.locked .toast.show {
      transform: translateX(-50%) translateY(4px)
    }

    /* Only a toast that carries an action (Undo) takes taps; a plain one must
       not swallow touches on whatever sits under it. */
    .toast.act.show {
      pointer-events: auto
    }

    .toast button {
      color: inherit;
      font-weight: 800;
      font-size: var(--fs-sm);
      letter-spacing: .04em;
      text-transform: uppercase;
      padding: 6px 2px 6px 12px;
      margin: -6px 0;
      border-left: 1px solid currentColor
    }

    /* ---------- pitch map ---------- */
    .fieldblock {
      margin: 12px 0 18px
    }

    .fieldhead {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px
    }

    .fieldhead .fname {
      font-family: 'Bebas Neue', sans-serif;
      font-size: var(--fs-lg);
      letter-spacing: .03em
    }

    .fieldhead .fmeta {
      font-size: var(--fs-xs);
      color: var(--mute)
    }

    .fieldhead .spacer {
      flex: 1
    }

    svg.pitch {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--r);
      background: var(--grass);
      border: 1px solid var(--line);
      touch-action: manipulation
    }

    svg.pitch .mk {
      cursor: pointer
    }

    svg.pitch .mkbg {
      fill: var(--panel2);
      stroke: var(--mute);
      stroke-width: 1.6
    }

    svg.pitch .mk.on .mkbg {
      fill: var(--primary);
      stroke: var(--marker-ring);
      stroke-width: 2.4
    }

    svg.pitch .mk.unnamed .mkbg {
      stroke-dasharray: 3 3
    }

    svg.pitch .mklabel {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      font-weight: 700;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none
    }

    svg.pitch .mk.on .mklabel {
      fill: var(--on-primary)
    }

    svg.pitch .mkname {
      font-family: Inter, sans-serif;
      font-size: 10.5px;
      fill: var(--ink);
      text-anchor: middle;
      pointer-events: none;
      font-weight: 600
    }

    svg.pitch .cnt {
      font-family: 'JetBrains Mono', monospace;
      font-size: 9.5px;
      font-weight: 700;
      fill: var(--on-plus);
      text-anchor: middle;
      pointer-events: none
    }

    svg.pitch .cntbg {
      fill: var(--plus)
    }

    /* crew rows under each pitch */
    .crew {
      margin-top: 8px;
      display: flex;
      flex-direction: column;
      gap: 6px
    }

    .crewrow {
      display: flex;
      align-items: center;
      gap: 8px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px 9px;
    }

    .crewrow.on {
      border-color: var(--primary);
      background: var(--primary-tint)
    }

    .crewrow .slot {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--primary);
      width: 30px;
      flex: none
    }

    .crewrow input {
      background: transparent;
      border: none;
      padding: 4px 0;
      font-weight: 600
    }

    .crewrow input::placeholder {
      color: var(--mute);
      font-weight: 400
    }

    .crewrow .prog {
      font-size: var(--fs-xs);
      color: var(--mute);
      font-family: 'JetBrains Mono', monospace;
      flex: none;
      text-align: right;
      line-height: 1.25
    }

    .crewrow .go {
      flex: none;
      border: 1px solid var(--line);
      border-radius: 8px;
      min-height: 36px;
      padding: 0 12px;
      font-size: var(--fs-sm);
      font-weight: 700;
      background: var(--panel2)
    }

    /* ---------- observe ---------- */
    .minimap {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 2px 0 6px;
      scrollbar-width: none
    }

    .minimap::-webkit-scrollbar {
      display: none
    }

    .mini {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 9px;
      padding: 6px 9px;
      font-size: var(--fs-xs);
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute);
    }

    .mini.on {
      border-color: var(--primary);
      background: var(--primary-strong);
      color: var(--ink)
    }

    .mini .m1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--primary)
    }

    /* These wrap rather than scroll sideways. There are seven categories and
       the strip used to show three, hiding 322px of them off the right edge
       with no arrow or fade to say so - so Offsides and General were, for most
       people, simply not there. Two rows of chips costs a little height and
       makes all seven visible at once. */
    .cats {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding: 4px 0 8px;
    }

    .cat {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 20px;
      padding: 9px 14px;
      min-height: var(--tap);
      font-size: var(--fs-md);
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute);
    }

    /* Selected is the app's primary blue, like every other selected thing.
       This was white-on-dark, which made "selected" mean two different
       colours depending on which screen you were looking at. */
    .cat.on {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary)
    }

    .cat .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      opacity: .85;
      margin-left: 2px
    }

    /* ---------- rating scale ---------- */
    .scale .nums button {
      flex-direction: column;
      gap: 1px;
      padding: 7px 2px;
      line-height: 1.15;
    }

    .scale .nums .rn {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-lg);
      font-weight: 700;
      display: block;
    }

    .scale .nums .rw {
      font-size: var(--fs-xs);
      font-weight: 600;
      opacity: .85;
      display: block;
      text-align: center;
    }

    /* The games one evaluation covers, listed on the Score tab. */
    ul.daygames {
      list-style: none;
      margin: 8px 0 0;
      padding: 0
    }

    ul.daygames li {
      padding: 5px 0 5px 16px;
      position: relative;
      font-size: var(--fs-sm);
      border-top: 1px solid var(--line)
    }

    ul.daygames li::before {
      content: '';
      position: absolute;
      left: 2px;
      top: 13px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--mute)
    }

    ul.daygames li.on {
      font-weight: 650
    }

    ul.daygames li.on::before {
      background: var(--primary)
    }

    ul.daygames .muted {
      color: var(--mute)
    }

    /* ---------- the finish sequence ----------
       Copy, open the form, save. It was four buttons of equal weight in a row,
       so the order you had to do them in was something you had to already know. */
    ol.finish {
      list-style: none;
      margin: 4px 0 0;
      padding: 0
    }

    ol.finish li {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 14px
    }

    ol.finish li>div {
      flex: 1;
      min-width: 0
    }

    ol.finish .fn {
      flex: none;
      width: 26px;
      height: 26px;
      margin-top: 9px;
      border-radius: 50%;
      background: var(--panel2);
      border: 1px solid var(--line);
      color: var(--mute);
      display: grid;
      place-items: center;
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-sm);
      font-weight: 700;
    }

    ol.finish .hint {
      margin: 6px 0 0
    }

    .chipgrid {
      display: flex;
      flex-wrap: wrap;
      gap: 6px
    }

    .chip {
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      padding: 10px 12px;
      min-height: var(--tap);
      font-size: var(--fs-md);
      text-align: left;
      line-height: 1.25;
      display: flex;
      align-items: flex-start;
      gap: 6px;
    }

    .chip .m {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: none
    }

    .chip.p {
      border-left: 3px solid var(--plus)
    }

    .chip.p .m {
      color: var(--plus)
    }

    .chip.m- {
      border-left: 3px solid var(--minus)
    }

    .chip.m- .m {
      color: var(--minus)
    }

    /* With the arrow selected every chip logs as "improved", so the chips say
       so instead of still showing their own + or - */
    .chip.b {
      border-left: 3px solid var(--primary)
    }

    .chip.b .m {
      color: var(--primary)
    }

    .chip:active {
      background: var(--panel2)
    }

    .noteadd {
      display: flex;
      gap: 6px;
      margin-top: 10px;
      align-items: stretch
    }

    .noteadd input {
      flex: 1
    }

    .polset {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden;
      flex: none
    }

    .polset button {
      width: 40px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: var(--fs-base);
      background: var(--panel2);
      color: var(--mute)
    }

    .polset button[data-pol="1"][aria-pressed="true"] {
      background: var(--plus);
      color: var(--on-plus)
    }

    .polset button[data-pol="-1"][aria-pressed="true"] {
      background: var(--minus);
      color: var(--on-minus)
    }

    .polset button[data-pol="2"][aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary)
    }

    .timeline {
      margin-top: 12px;
      border-left: 2px solid var(--line);
      padding-left: 11px
    }

    .nrow {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      padding: 7px 0;
      border-bottom: 1px solid var(--line)
    }

    .nrow:last-child {
      border-bottom: none
    }

    .nrow .t {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      color: var(--mute);
      flex: none;
      width: 48px;
      padding-top: 2px
    }

    .nrow .bd {
      flex: 1;
      min-width: 0;
      font-size: var(--fs-sm);
      line-height: 1.35
    }

    .nrow .bd .cn {
      font-size: var(--fs-xs);
      color: var(--mute);
      display: block
    }

    .nrow .mk2 {
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      flex: none
    }

    .nrow.p .mk2 {
      color: var(--plus)
    }

    .nrow.n .mk2 {
      color: var(--minus)
    }

    .nrow.b .mk2 {
      color: var(--primary)
    }

    .nrow.o .mk2 {
      color: var(--mute)
    }

    /* Was a ~20px target sitting right beside the "improved" arrow. Deleting
       is now undoable, but it should still be hard to hit by accident. */
    .nrow .del {
      flex: none;
      color: var(--mute);
      width: 36px;
      height: 36px;
      margin: -6px -4px -6px 0;
      display: grid;
      place-items: center;
      border-radius: 8px;
      font-size: var(--fs-base)
    }

    .nrow .del:active {
      background: var(--panel2)
    }

    /* ---------- score ---------- */
    .ratewrap {
      margin: 14px 0
    }

    .ratewrap .rlabel {
      font-size: var(--fs-sm);
      font-weight: 600
    }

    .ratewrap .rhint {
      font-size: var(--fs-xs);
      color: var(--mute);
      margin: 2px 0 7px
    }

    .scale {
      display: flex;
      gap: 6px;
      align-items: center
    }

    .scale .end {
      font-size: var(--fs-xs);
      color: var(--mute);
      flex: none;
      width: 26px
    }

    .scale .end.r {
      text-align: right
    }

    .scale .nums {
      display: flex;
      gap: 6px;
      flex: 1
    }

    .scale .nums button {
      flex: 1;
      padding: 11px 0;
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      font-size: var(--fs-md);
    }

    .scale .nums button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary);
      border-color: var(--primary)
    }

    .switchrow {
      display: flex;
      align-items: center;
      gap: 10px;
      margin: 10px 0;
      font-size: var(--fs-sm)
    }

    .switchrow input {
      width: auto;
      flex: none;
      width: 20px;
      height: 20px;
      accent-color: var(--primary)
    }

    .yesno {
      display: flex;
      gap: 8px
    }

    .yesno button {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--line);
      background: var(--panel2);
      border-radius: 10px;
      font-weight: 700
    }

    .yesno button[aria-pressed="true"][data-move="Yes"] {
      background: var(--plus);
      color: var(--on-plus);
      border-color: var(--plus)
    }

    .yesno button[aria-pressed="true"][data-move="No"] {
      background: var(--minus);
      color: var(--on-minus);
      border-color: var(--minus)
    }

    .charcount {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      color: var(--mute);
      text-align: right;
      margin-top: 4px
    }

    /* ---------- confirm dialog ---------- */
    .dlg {
      position: fixed;
      inset: 0;
      z-index: 80;
      display: grid;
      place-items: center;
      padding: 22px;
      background: var(--scrim)
    }

    .dlg[hidden] {
      display: none
    }

    .dlgbox {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      max-width: 340px;
      width: 100%
    }

    .dlgbox p {
      margin: 0 0 16px;
      font-size: var(--fs-md);
      line-height: 1.45
    }

    /* ---------- game picker ---------- */
    .nowgame {
      display: flex;
      align-items: center;
      gap: 9px;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 9px 11px;
      margin: 10px 0
    }

    .nowgame .g1 {
      font-weight: 650;
      font-size: var(--fs-sm);
      line-height: 1.2
    }

    .nowgame .g2 {
      font-size: var(--fs-xs);
      color: var(--mute);
      line-height: 1.3
    }

    .nowgame .chev {
      margin-left: auto;
      color: var(--mute);
      font-size: var(--fs-lg);
      flex: none
    }

    /* Kickoff heading in the game picker. Was named .slot, which collided
       with the crew-row .slot label and pushed a 14px margin onto it. */
    .slothead {
      margin: 14px 0 6px;
      font-family: 'Bebas Neue', sans-serif;
      font-size: var(--fs-lg);
      letter-spacing: .04em;
      color: var(--primary)
    }

    .grow {
      display: flex;
      align-items: center;
      gap: 10px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 11px;
      margin: 6px 0
    }

    .grow.on {
      border-color: var(--primary);
      background: var(--primary-tint)
    }

    .grow.done {
      opacity: .55
    }

    .grow .body {
      flex: 1;
      min-width: 0
    }

    .grow .t1 {
      font-weight: 650;
      font-size: var(--fs-sm);
      line-height: 1.25
    }

    .grow .t2 {
      font-size: var(--fs-xs);
      color: var(--mute);
      line-height: 1.35;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .grow .meter {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      color: var(--mute);
      text-align: right;
      flex: none;
      line-height: 1.3
    }

    .grow .meter b {
      color: var(--plus)
    }

    .iconsm {
      flex: none;
      width: var(--tap);
      height: var(--tap);
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      display: grid;
      place-items: center;
      font-size: var(--fs-sm);
      color: var(--mute)
    }

    /* ---------- sheet (settings) ---------- */
    .scrim {
      position: fixed;
      inset: 0;
      z-index: 60;
      background: var(--scrim);
      backdrop-filter: blur(2px)
    }

    .scrim[hidden] {
      display: none
    }

    .sheet {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 61;
      max-width: 600px;
      margin: 0 auto;
      background: var(--bg);
      border-top: 1px solid var(--line);
      border-radius: 18px 18px 0 0;
      max-height: 88vh;
      /* dvh tracks the mobile browser bars; vh stays as the fallback */
      max-height: 88dvh;
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 6px var(--pad) calc(24px + env(safe-area-inset-bottom));
    }

    .sheet[hidden] {
      display: none
    }

    .grab {
      width: 40px;
      height: 4px;
      background: var(--line);
      border-radius: 2px;
      margin: 8px auto 4px
    }

    .sheethead {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 4px 0 6px
    }

    .sheethead h3 {
      font-family: 'Bebas Neue', sans-serif;
      font-size: var(--fs-xl);
      margin: 0;
      font-weight: 400;
      letter-spacing: .03em
    }

    .sheethead .spacer {
      flex: 1
    }

    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 10px;
      overflow: hidden
    }

    .seg button {
      flex: 1;
      padding: 9px 4px;
      min-height: var(--tap);
      font-weight: 600;
      background: var(--panel2);
      color: var(--mute);
      font-size: var(--fs-sm)
    }

    .seg button[aria-pressed="true"] {
      background: var(--primary);
      color: var(--on-primary)
    }

    .saved {
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 11px;
      margin: 8px 0;
      background: var(--panel)
    }

    .saved .sh {
      display: flex;
      gap: 8px;
      align-items: baseline
    }

    .saved .sh b {
      font-size: var(--fs-sm)
    }

    .saved .sh .spacer {
      flex: 1
    }

    .saved pre {
      white-space: pre-wrap;
      word-break: break-word;
      font-family: Inter, sans-serif;
      font-size: var(--fs-sm);
      color: var(--mute);
      margin: 8px 0 0
    }

    /* ---------- many fields ---------- */
    .fieldstrip {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: none
    }

    .fieldstrip::-webkit-scrollbar {
      display: none
    }

    /* ---------- import wizard ---------- */
    .stepper {
      display: flex;
      list-style: none;
      margin: 0 0 14px;
      padding: 0;
      gap: 6px;
      counter-reset: none;
    }

    .stepper li {
      flex: 1;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      color: var(--mute);
      font-size: var(--fs-xs);
      font-weight: 600;
      border-top: 3px solid var(--line);
      padding-top: 7px;
    }

    .stepper li.on {
      color: var(--ink);
      border-top-color: var(--primary)
    }

    .stepper li.done {
      border-top-color: var(--primary)
    }

    .stepper .sn {
      flex: none;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      background: var(--panel2);
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
    }

    .stepper li.on .sn {
      background: var(--primary);
      color: var(--on-primary)
    }

    .stepper li.done .sn {
      background: var(--plus);
      color: var(--on-plus)
    }

    .stepper .sl {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap
    }

    /* A <details> is the browser's own show/hide. Used here so the column
       mapping - ten dropdowns and a spreadsheet dump - stays out of the way
       unless it is actually needed. */
    .disclose {
      margin-top: 12px;
      border: 1px solid var(--line);
      border-radius: var(--r);
      background: var(--panel);
      padding: 0 var(--pad)
    }

    .disclose>summary {
      cursor: pointer;
      list-style: none;
      padding: 0 0 0 4px;
      min-height: var(--tap);
      display: flex;
      align-items: center;
      font-size: var(--fs-sm);
      font-weight: 600;
      color: var(--mute);
    }

    .disclose>summary::-webkit-details-marker {
      display: none
    }

    .disclose>summary::after {
      content: '\25BE';
      margin-left: auto;
      transition: transform .15s
    }

    .disclose[open]>summary::after {
      transform: rotate(180deg)
    }

    .disclose[open] {
      padding-bottom: var(--pad)
    }

    /* Destructive actions live behind one of these. Copy, Done and the rest are
       everyday taps; deleting a game or an evaluation of a named child is not,
       and it used to sit at equal weight right beside them. */
    .disclose.danger {
      border-style: dashed;
      background: none
    }

    .disclose.danger>summary {
      font-size: var(--fs-xs);
      font-weight: 600
    }

    .fchip {
      flex: none;
      border: 1px solid var(--line);
      background: var(--panel);
      border-radius: 10px;
      padding: 9px 12px;
      min-height: var(--tap);
      font-size: var(--fs-md);
      font-weight: 600;
      white-space: nowrap;
      color: var(--mute)
    }

    .fchip.on {
      border-color: var(--primary);
      background: var(--primary-strong);
      color: var(--ink)
    }

    .fchip .n {
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-xs);
      font-weight: 700;
      color: var(--plus)
    }

    .fchip .n.todo {
      color: var(--minus)
    }

    .cov {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: var(--fs-sm);
      color: var(--mute)
    }

    .cov b {
      color: var(--ink);
      font-family: 'JetBrains Mono', monospace;
      font-size: var(--fs-md)
    }

    /* ---------- import ---------- */
    .scrollx {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch
    }

    .tbl {
      border-collapse: collapse;
      font-size: var(--fs-xs);
      font-family: 'JetBrains Mono', monospace
    }

    .tbl th,
    .tbl td {
      border: 1px solid var(--line);
      padding: 4px 6px;
      text-align: left;
      white-space: nowrap;
      max-width: 120px;
      overflow: hidden;
      text-overflow: ellipsis
    }

    .tbl th {
      color: var(--primary);
      background: var(--panel2);
      font-weight: 700
    }

    .map2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 4px
    }

    .map2 label.f {
      margin: 0
    }

    .gamerow {
      display: flex;
      align-items: center;
      gap: 9px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 6px 0
    }

    .gamerow.off {
      opacity: .45
    }

    .gamerow input[type=checkbox] {
      /* The box itself is drawn at 26px, but the whole row is the label, so the
         real target is the full width of the card - see .gamerow below. */
      width: 26px;
      height: 26px;
      accent-color: var(--primary);
      flex: none
    }

    /* Making the row a <label> means a tap anywhere on it toggles the box.
       That turns a 26px target into a 358px one without changing the look. */
    label.gamerow {
      cursor: pointer;
      min-height: var(--tap)
    }

    .gamerow .g1 {
      font-weight: 650;
      font-size: var(--fs-sm);
      line-height: 1.2
    }

    .gamerow .g2 {
      font-size: var(--fs-xs);
      color: var(--mute);
      line-height: 1.3
    }

    .warn {
      background: var(--minus-tint);
      border: 1px solid var(--minus-line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: var(--fs-sm);
      margin: 8px 0
    }

    .okbox {
      background: var(--primary-tint);
      border: 1px solid var(--primary-line);
      border-radius: 10px;
      padding: 9px 11px;
      font-size: var(--fs-sm);
      margin: 8px 0
    }

    /* compact text button for per-pitch actions (Done / Delete) */
    .minibtn {
      flex: none;
      min-height: 34px;
      padding: 0 11px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: var(--panel2);
      font-size: var(--fs-sm);
      font-weight: 650;
      color: var(--ink)
    }

    .minibtn.danger {
      color: var(--minus);
      border-color: var(--minus-line)
    }

    details.more {
      margin-top: 12px
    }

    details.more summary {
      cursor: pointer;
      font-size: var(--fs-sm);
      color: var(--mute);
      padding: 6px 0
    }

    .sheet:focus {
      outline: none
    }

    /* stop the page behind an open sheet from scrolling under your thumb */
    body.locked {
      overflow: hidden
    }

    /* ---------- accounts ---------- */
    /* The avatar is the account. Signed out it shows a neutral person glyph;
       signed in it shows the mentor's initials. The status dot rides on it
       rather than on the settings cog, because that is where people look. */
    .avatar {
      flex: none;
      width: var(--tap);
      height: var(--tap);
      border-radius: 50%;
      border: 1px solid var(--line);
      background: var(--panel2);
      color: var(--mute);
      display: grid;
      place-items: center;
      font-size: var(--fs-sm);
      font-weight: 700;
      letter-spacing: .02em;
      position: relative;
    }

    .avatar .who {
      width: 22px;
      height: 22px;
      display: block;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round
    }

    .avatar[data-acct] {
      background: var(--primary);
      border-color: var(--primary);
      color: var(--on-primary)
    }

    .avatar[data-acct]::after {
      content: '';
      position: absolute;
      bottom: 1px;
      right: 1px;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: var(--plus);
      box-shadow: 0 0 0 2px var(--glass)
    }

    .avatar[data-acct="pending"] {
      background: var(--panel2);
      border-color: var(--minus-line);
      color: var(--minus)
    }

    .avatar[data-acct="pending"]::after {
      background: var(--minus)
    }

    .acctline {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      overflow-wrap: anywhere;
      margin-bottom: 6px
    }

    /* ---------- referee profiles ---------- */
    .histline {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2px 10px;
      align-items: center;
      font-size: var(--fs-sm);
      line-height: 1.35;
      background: var(--panel);
      border: 1px solid var(--line);
      border-left: 3px solid var(--primary);
      border-radius: 10px;
      padding: 8px 10px;
      margin: 8px 0
    }

    .histline>div {
      grid-column: 1;
      min-width: 0
    }

    .histline .minibtn {
      grid-column: 2;
      grid-row: 1 / span 2
    }

    .watching .minibtn {
      margin-left: auto
    }

    .refrow {
      display: block;
      width: 100%;
      text-align: left;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--r);
      padding: 10px 12px;
      margin: 6px 0
    }

    .refrow .rr1 {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: var(--fs-md)
    }

    .refrow .rr2,
    .refrow .rr3 {
      font-size: var(--fs-xs);
      color: var(--mute);
      margin-top: 2px
    }

    .refrow .rr3 {
      color: var(--minus)
    }

    .pill.low {
      background: var(--minus-tint);
      color: var(--minus)
    }

    .catrow {
      display: grid;

    }

    }

    }

    }

    }

      font-family: Inter, sans-serif;
      font-size: var(--fs-sm);
      color: var(--mute);
      margin: 8px 0 0
    }
  </style>
</head>

<body>

      <div class="brand">SIDE<span>LINE</span></div>

        aria-label="Switch to sunlight theme">&#9728;&#xFE0E;</button>

    </div>
    <div class="watching idle" id="watching" aria-live="polite">

  </main>

  <!-- Inline SVG, not emoji. Emoji carry their own colour, so the people and

    <button data-tab="saved"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5a2 2 0 012-2h3.2l2 2.5h7.8a2 2 0 012 2v9a2 2 0 01-2 2h-13a2 2 0 01-2-2z"/></svg>Saved</button>

  <div class="scrim" id="scrim" hidden></div>

      id="toastAct" hidden></button></div>

  <script>
    "use strict";
    /* ============================================================
       SIDELINE — field-side notes for LSSA referee evaluations
       ------------------------------------------------------------
       Mirrors the "Referee Evaluation" Google Form, but built around
       the actual job: one mentor watching several referees across two
       fields at the same time. Each referee is a separate form
       submission, so each referee owns their own notes, ratings,
       move-up answer and comments.
       ============================================================ */

    const FORM_URL = 'https://docs.google.com/forms/d/e/1FAIpQLSd-Hc5iO0ygjxnme1FirULuMauqI1JFCG_vYob_pYAfAZZPOg/viewform';

    /* ---------- mentor accounts (optional) ----------
       Fill in both values to switch on sign-in, shared evaluations and
       league-wide referee profiles. Leave either empty and Sideline stays
       the offline, single-device app it always was.
       Both values are PUBLIC by design: the database's access rules protect
       the data, not this key. Use the "publishable" key (sb_publishable_...).
       NEVER put a secret key (sb_secret_...) or the legacy service_role key
       here: those bypass every access rule. Setup steps: README.md.
       The admin console (admin/index.html) carries the same values; change
       both together. */
    const SUPABASE_URL = 'https://kgilrxcboicdxjbxldgw.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_VuoFX_hWHaODI-BBWa0uiQ_Uduxp-TQ';
    const ACCOUNTS_ON = !!(SUPABASE_URL && SUPABASE_PUBLISHABLE_KEY) && !/^sb_secret_/.test(SUPABASE_PUBLISHABLE_KEY);
    // Pinned with a Subresource Integrity hash: if the CDN ever serves
    // different bytes for this version, the browser refuses to run them.
    const SUPABASE_JS = {
      src: 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.116.0/dist/umd/supabase.js',
      integrity: 'sha384-iLddHTLokph6Omwoyid4XKxHaWa6w41BnoEj0q5oOrzmYPpHIKt1wyjReA7s//pP'
    };

    /* Field and division lists copied verbatim from the form's dropdowns,
       in the form's order. Matching exactly means the value you pick here
       is the value you pick there — no translating in your head at 9pm. */
    const FIELDS = ['Tigers - Field 1', 'Titans - Field 1', 'Broncos - Field 1', 'Field 2A', 'Field 2B',
      'Field 2C', 'Field 3A', 'Field 3B', 'Field 3C', 'Field 4', 'Field 5', 'Field 6', 'Field 7', 'Field 8',
      'Field 9', 'Field 10', 'Field 11A', 'Field 11B', 'Field 12A', 'Field 12B'];

    /* Field 1 is not one pitch - it is Tigers, Titans and Broncos. Same for the
       lettered complexes. When you are monitoring you cover every field with a
       game on it, so these groups exist to add a whole complex in one tap
       instead of picking sub-pitches one at a time. */
    const FIELD_GROUPS = [
      {label: 'Field 1', members: ['Tigers - Field 1', 'Titans - Field 1', 'Broncos - Field 1']},
      {label: 'Field 2', members: ['Field 2A', 'Field 2B', 'Field 2C']},
      {label: 'Field 3', members: ['Field 3A', 'Field 3B', 'Field 3C']},
      {label: 'Field 11', members: ['Field 11A', 'Field 11B']},
      {label: 'Field 12', members: ['Field 12A', 'Field 12B']},
    ];

    /* Chips and pitch headers need a short name: "Tigers - Field 1" reads as
       "Tigers", "Field 2A" as "2A". */
    /* Tigers, Titans and Broncos are each TWO pitches sharing one entry on the
       form's dropdown, with a single referee on each. So "Tigers - Field 1" at
       8:00 is two games and two centers, and the form has no way to say which
       pitch - both submissions carry the identical Field value.
    
       That is handled with a `sub` on each field entry: an internal A/B label
       used everywhere in the app and deliberately absent from the block you
       paste into the form. Default crew is 1, since each pitch has one official. */
    /* `offside` says whether the division plays offside at all. It tracks the
       crew size for a reason: offside arrives with the assistant referees who
       judge it, so the divisions refereed without ARs are the ones that do not
       play it. The form still wants a 1 in the offside box for those games -
       but a 1 there is a note about the division, not about the referee, and
       everything that averages or ranks referees has to know the difference.
       If the league enforces offside lower down than this, change it here: it
       is the only place the answer is written. */
    const DIVISION_RULES = [
      // Matched in order against the sheet's division name.
      // pitches:2 means two simultaneous games sharing one field, one official each.
      {re: /^pre-?k/i, form: 'PK', pitches: 2, crew: 1, offside: false},
      {re: /^kinder/i, form: 'Kindergarten', pitches: 2, crew: 1, offside: false},
      {re: /^1st/i, form: '1st', pitches: 1, crew: 2, offside: false},
      {re: /^2nd/i, form: '2nd', pitches: 1, crew: 2, offside: false},
      {re: /^3rd/i, form: '3rd', pitches: 1, crew: 3, offside: true},
      {re: /^4th/i, form: '4th', pitches: 1, crew: 3, offside: true},
      {re: /^5th/i, form: '5th', pitches: 1, crew: 3, offside: true},
      {re: /^6th/i, form: '6th', pitches: 1, crew: 3, offside: true},
      {re: /^middle\s*school/i, form: 'Middle School', pitches: 1, crew: 3, offside: true},
      {re: /^high\s*school/i, form: 'High School', pitches: 1, crew: 3, offside: true},
      {re: /^adult/i, form: 'Adult', pitches: 1, crew: 3, offside: true},
    ];
    /* The schedule fills CR 1 + CR 2 with no ARs for Pre-K, Kindergarten, 1st AND
       2nd grade - the rows are indistinguishable. Only the division says whether
       that means two pitches with one referee each (Pre-K, Kindergarten) or one
       game with a dual-referee crew (1st, 2nd). So splitting keys off division,
       never off "there are no ARs". */
    function divisionRule(v) {
      const t = String(v || '').trim();
      if (!t) return null;
      /* Two spellings reach this. The sheet's, which the patterns are written
         for ("Pre-K Girls"), and the form's own value, which is what normDiv
         stores and what every saved evaluation carries. Those are not always
         the same string: "Pre-K Girls" normalises to "PK", and /^pre-?k/ does
         not match "PK". Missing that made PK - the very youngest referees -
         the one division the offside rule failed to recognise. */
      return DIVISION_RULES.find(r => r.re.test(t))
        || DIVISION_RULES.find(r => r.form.toLowerCase() === t.toLowerCase())
        || null;
    }

    /* Does this division play offside? Anything we do not recognise - a blank
       division, a typo, a new age group - answers yes, which is how the app
       behaved before this existed. Guessing "no" would quietly delete a real
       offside rating from a referee's record, and that is the worse mistake. */
    function divisionHasOffside(division) {
      const r = divisionRule(division);
      return r ? r.offside !== false : true;
    }

    /* The categories a record can fairly be judged on. Offside drops out for
       divisions that do not play it, so a Kindergarten referee is averaged over
       the five things they were actually there to do. */
    function ratedFor(division) {
      return divisionHasOffside(division) ? RATED : RATED.filter(c => c.id !== 'offsides');
    }

    /* One evaluation can now cover several games, so a record carries every
       division it was written across. Records saved before that - and any
       single-game one - just have the one. */
    function recordDivisions(r) {
      if (!r) return [];
      if (Array.isArray(r.divisions) && r.divisions.length) return r.divisions;
      return r.division ? [r.division] : [];
    }

    /* Offside counted against this referee only if at least one of the games it
       covers actually played it. */
    function recordHasOffside(r) {
      const divs = recordDivisions(r);
      return divs.length ? divs.some(divisionHasOffside) : true;
    }

    function ratedForRecord(r) {
      return recordHasOffside(r) ? RATED : RATED.filter(c => c.id !== 'offsides');
    }

    const SUBS = ['A', 'B', 'C', 'D'];

    /* Compact kickoff for chips: "8a", "9:15a", "6p". Monitoring one pitch
       all morning puts the same field on the strip three or four times, so
       the chip has to carry the time or every chip reads "2A". */
    function shortTime(hm) {
      if (!hm) return '';
      let [h, m] = hm.split(':').map(Number);
      const suffix = h >= 12 ? 'p' : 'a';
      h = h % 12 || 12;
      return m ? `${h}:${String(m).padStart(2, '0')}${suffix}` : `${h}${suffix}`;
    }

    /* Only appends the time when that field actually appears more than once
       on the board - no point cluttering a chip that is already unique. */
    function fieldLabel(f) {
      const base = shortField(f.name);
      // Count distinct kickoffs for this name, not entries: the two Tigers pitches
      // at 8:00 are one group and must not make the chip read "Tigers 8a" twice.
      const kickoffs = new Set(S.fields.filter(x => x.name === f.name).map(groupKey)).size;
      return kickoffs > 1 && f.time ? `${base} ${shortTime(f.time)}` : base;
    }
    /* "Tigers A" for display, never for the form. */
    function pitchLabel(f) {
      return f.sub ? `${shortField(f.name)} ${f.sub}` : shortField(f.name);
    }

    /* The field the way the Google Form spells it, plus the internal A/B pitch
       letter when there is one. Rows with room use this; shortField's "2A" is
       for chips and the minimap, where there genuinely is not room. Before,
       one game could read "Tigers A" on the Fields tab, "2A" in the picker and
       "Field 2A" on the Score tab - three names for one pitch. */
    function fullPitchLabel(f) {
      if (!f.name) return 'Field not set';
      return f.sub ? `${f.name} ${f.sub}` : f.name;
    }

    function shortField(name) {
      if (!name) return 'Field';
      const t = name.match(/^(Tigers|Titans|Broncos)/i);
      return t ? t[1] : name.replace(/^Field\s*/i, '');
    }

    const DIVISIONS = ['PK', 'Kindergarten', '1st', '2nd', '3rd', '4th', '5th', '6th', 'Middle School', 'High School', 'Adult'];

    /* The six rated questions, in form order, plus a seventh bucket that
       feeds COMMENTS only. `rated:false` is what keeps "general" out of
       the 1-4 scoring UI while still letting it carry notes. */
    const CATS = [
      {id: 'appearance', label: 'Professional appearance', short: 'Appearance', rated: true},
      {id: 'workrate', label: 'Workrate - position/movement', short: 'Workrate', rated: true},
      {id: 'commands', label: 'Verbal and non-verbal commands', short: 'Commands', rated: true},
      {id: 'teamwork', label: 'Teamwork', short: 'Teamwork', rated: true},
      {id: 'fouls', label: 'Recognition of fouls', short: 'Fouls', rated: true},
      {id: 'offsides', label: 'Recognition of offsides', short: 'Offsides', rated: true},
      {id: 'general', label: 'Game management and other', short: 'General', rated: false},
    ];
    const RATED = CATS.filter(c => c.rated);

    /* The scale used to be four bare numbers with "bad" at one end and "good"
       at the other, in small grey type, so 2 and 3 meant whatever you could
       remember they meant. A word on each button says it outright. The NUMBER
       is still what goes on the Google Form - these words exist only here, to
       make the number you pick a considered choice rather than a guess. They
       are also deliberately kinder than "bad": these are written assessments of
       young referees, many of them children, and 1 means they need support,
       not that they are bad. */
    const RATING_WORDS = {1: 'Needs work', 2: 'Developing', 3: 'Solid', 4: 'Excellent'};

    /* Quick-tap observations. pol = polarity: +1 strength, -1 work on.
       `pos` restricts a chip to one role so an AR never has to scroll past
       eight center-referee chips to reach the flag ones. */
    const CHIPS = [
      // appearance
      ['appearance', 1, 'Looks confident, good posture'],
      ['appearance', -1, 'No coin for captains'],
      ['appearance', -1, 'Shirt untucked'],
      ['appearance', -1, 'Wrong socks'],
      ['appearance', -1, 'Wrong patch'],
      ['appearance', -1, 'Twirling whistle'],
      ['appearance', -1, 'Holding gamecards'],

      // workrate - CR
      ['workrate', 1, 'Good wide diagonal', 'CR'],
      ['workrate', 1, 'Close enough to ball', 'CR'],
      ['workrate', 1, 'Adjusted for the counterattack', 'CR'],
      ['workrate', 1, 'Good position on the corner kick', 'CR'],
      ['workrate', 1, 'Game ran behind', 'CR'],
      ['workrate', -1, 'Ball-watching from the center circle', 'CR'],
      ['workrate', -1, 'Too far from play', 'CR'],
      ['workrate', -1, 'Frequent walking', 'CR'],
      ['workrate', -1, 'Jogging when a sprint was needed', 'CR'],
      // workrate - AR
      ['workrate', 1, 'Even with the second-to-last defender', 'AR'],
      ['workrate', 1, 'Sprinted to the goal line on the shot', 'AR'],
      ['workrate', 1, 'Stayed off the touchline', 'AR'],
      ['workrate', -1, 'Trailing the second-to-last defender', 'AR'],
      ['workrate', -1, 'Drifted ahead of the line', 'AR'],
      ['workrate', -1, 'Stopped at the 18 on the breakaway', 'AR'],
      ['workrate', -1, 'Not square to the field', 'AR'],
      // commands
      ['commands', 1, 'Whistle strong'],
      ['commands', 1, 'Signals clear and long'],
      ['commands', 1, 'Talked players through restarts'],
      ['commands', 1, 'Good preventive talk'],
      ['commands', -1, 'Whistle too quiet'],
      ['commands', -1, 'Poor signals'],
      ['commands', -1, 'Infrequent signals'],
      ['commands', -1, 'Body language looked unsure'],
      ['commands', 1, 'Flag up straight and still', 'AR'],
      ['commands', 1, 'Mirrored the center correctly', 'AR'],
      ['commands', -1, 'Flag waved or bent', 'AR'],
      // teamwork
      ['teamwork', 1, 'Ran a real pregame with the crew'],
      ['teamwork', 1, 'Eye contact before restarts'],
      ['teamwork', 1, 'Backed the partner up'],
      ['teamwork', 1, 'Checked with the AR on a close call', 'CR'],
      ['teamwork', 1, 'Took more initiative than other ref', 'CR'],
      ['teamwork', -1, 'No pregame with the crew'],
      ['teamwork', -1, 'Ignored the flag', 'CR'],
      ['teamwork', -1, 'Waved the partner off in front of players'],
      ['teamwork', -1, 'No help on substitutions'],
      // fouls
      ['fouls', 1, 'Same standard for both teams'],
      ['fouls', 1, 'Good play-on / advantage'],
      ['fouls', 1, 'Correct restart spot'],
      ['fouls', 1, 'Handled persistent fouling'],
      ['fouls', 1, 'Card fit the offense'],
      ['fouls', -1, 'Does not call fouls'],
      ['fouls', -1, 'Missed an obvious foul'],
      ['fouls', -1, 'Wrong restart, direct vs indirect'],
      // offsides
      ['offsides', 1, 'Level with the second-to-last defender'],
      ['offsides', 1, 'Waited to judge involvement'],
      ['offsides', 1, 'Correct on the ball played backwards'],
      ['offsides', 1, 'Held the flag on the goal kick'],
      ['offsides', -1, 'Flagged late'],
      ['offsides', -1, 'Flagged early, player was level'],
      ['offsides', -1, 'Missed a clear offside'],
      ['offsides', -1, 'Flagged on a throw-in'],
      ['offsides', 1, 'Supported the AR on a close flag', 'CR'],
      ['offsides', -1, 'Overruled a correct flag', 'CR'],
      // general
      ['general', 1, 'Handled coach dissent calmly'],
      ['general', 1, 'Good pregame with the coaches'],
      ['general', 1, 'Managed the injury correctly'],
      ['general', 1, 'Kept accurate time'],
      ['general', 1, 'Recovered well after a mistake'],
      ['general', -1, 'Rattled by sideline pressure'],
      ['general', -1, 'Substitution procedure shaky'],
      ['general', -1, 'Clock or timing confusion'],
      ['general', -1, 'Needs to slow the decision down'],
      ['general', -1, 'Over-explaining to coaches'],
    ].map(([cat, pol, text, pos]) => ({cat, pol, text, pos: pos || null}));

    /* ============================================================
       STORAGE
       ------------------------------------------------------------
       localStorage is the browser's simple key/value box on disk,
       scoped to one origin (https://sideline.codeoverload.dev) and one browser.
       It survives closing the app, which is what we need: you should be
       able to lock your phone between games without losing a session.
    
       Why the try/catch and the in-memory fallback: localStorage throws
       rather than returns null in a few real situations - Safari private
       browsing, storage quota exceeded, and inside some embedded preview
       frames. An unhandled throw at startup would blank the whole app.
       The fallback keeps everything working for the current session and
       only loses data on reload, which is a survivable failure. This
       shape - one interface, swap the thing behind it - is what people
       mean by "adapter": callers never learn which one they got.
       ============================================================ */
    const mem = new Map();
    let persistent = true;
    const store = {
      get(k) {
        try {const v = localStorage.getItem(k); return v === null ? undefined : JSON.parse(v);}
        catch (e) {persistent = false; return mem.get(k);}
      },
      set(k, v) {
        try {localStorage.setItem(k, JSON.stringify(v));}
        catch (e) {persistent = false; mem.set(k, v);}
      }
    };

    const uid = () => Math.random().toString(36).slice(2, 9);
    /* Ids are written into HTML attributes unescaped (data-pick="..."), so one
       read back from a backup file has to be the plain kind uid() makes. A
       crafted file could otherwise inject markup into the page. */
    const safeId = (v) => (typeof v === 'string' && /^[A-Za-z0-9_-]{1,40}$/.test(v) ? v : uid());
    const $ = (s) => document.querySelector(s);
    const esc = (s) => String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

    function todayISO() {
      const d = new Date();
      return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
    }
    function nowHM() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }
    function prettyDate(iso) {
      if (!iso) return '';
      const [y, m, d] = iso.split('-');
      return `${Number(m)}/${Number(d)}/${y}`;        // form uses MM/DD/YYYY
    }
    function pretty12(hm) {
      if (!hm) return '';
      let [h, m] = hm.split(':').map(Number);
      const ap = h >= 12 ? 'PM' : 'AM';
      h = h % 12 || 12;
      return `${h}:${String(m).padStart(2, '0')} ${ap}`;
    }
    /* Epoch ms -> "10:42 AM", for stamping notes and saves. */
    function clockOf(ts) {
      const d = new Date(ts);
      return pretty12(`${d.getHours()}:${String(d.getMinutes()).padStart(2, '0')}`);
    }
    /* Epoch ms -> "today", "yesterday", "3 days ago", or a plain date. */
    function ago(ts) {
      const startOf = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
      const days = Math.round((startOf(new Date()) - startOf(new Date(ts))) / 864e5);
      if (days <= 0) return 'today';
      if (days === 1) return 'yesterday';
      if (days < 14) return `${days} days ago`;
      return new Date(ts).toLocaleDateString();
    }

    /* ---------- theme ----------
       'dark' is the original look, 'light' the sunlight theme, 'auto' follows
       the phone. The script in <head> already set data-theme before first
       paint; this keeps it, the status-bar color and the header toggle in step. */
    const THEMES = [['dark', 'Dark'], ['light', 'Sunlight'], ['auto', 'Match phone']];
    const darkQuery = window.matchMedia ? matchMedia('(prefers-color-scheme: dark)') : null;
    let themeMode = store.get('sideline:theme') || 'dark';
    function isLight() {
      return themeMode === 'light' || (themeMode === 'auto' && !(darkQuery && darkQuery.matches));
    }
    function applyTheme() {
      const light = isLight();
      document.documentElement.setAttribute('data-theme', light ? 'light' : 'dark');
      const meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', light ? '#eef2f5' : '#0b0d10');
      const btn = document.getElementById('themeToggle');
      if (btn) {
        const label = light ? 'Switch to dark theme' : 'Switch to sunlight theme';
        btn.innerHTML = light ? '&#9790;&#xFE0E;' : '&#9728;&#xFE0E;';
        btn.title = label; btn.setAttribute('aria-label', label);
      }
    }
    function setTheme(mode) {
      themeMode = THEMES.some(([k]) => k === mode) ? mode : 'dark';
      store.set('sideline:theme', themeMode);
      applyTheme();
    }
    if (darkQuery && darkQuery.addEventListener) {
      darkQuery.addEventListener('change', () => {if (themeMode === 'auto') applyTheme();});
    }

    /* ============================================================
       STATE
       ------------------------------------------------------------
       One session = one date, one mentor, up to three fields. A field
       holds its own crew. A crew member ("ref") holds
       everything that becomes one Google Form submission.
       ============================================================ */
    function newRef(slot, role) {
      return {
        id: uid(), slot, role,            // slot = CR/AR1/AR2 label, role = CR or AR for the form
        name: '', notes: [],
        ratings: Object.fromEntries(RATED.map(c => [c.id, null])),
        noOffsides: false, moveUp: null,
        comments: '', commentsEdited: false, submitted: false
      };
    }
    function newField(name) {
      return {
        // Kickoff starts EMPTY, not nowHM(). A made-up time is indistinguishable
        // from a real one, which broke import matching (a hand-added field looked
        // like it kicked off whenever you opened the app, so importing that same
        // game could not match it and created a duplicate instead).
        id: uid(), name: name || '', sub: '', division: '', time: '', crewSize: 3, done: false,
        refs: [newRef('CR', 'CR'), newRef('AR1', 'AR'), newRef('AR2', 'AR')]
      };
    }
    function blankUI() {
      return {tab: 'fields', cat: 'workrate', pol: 1, draftText: '', fieldId: null, showDone: false, keepDate: null};
    }
    function blankSession() {
      return {
        mentor: store.get('sideline:mentor') || '',
        date: todayISO(),
        // No placeholder game. A blank one made Settings read "Games (1)" and
        // put a ghost "Field - no division" row on Observe, while the Fields
        // tab correctly showed its first-run card: three screens disagreeing
        // about whether the app was empty.
        fields: [],
        activeRefId: null,
        ui: blankUI()
      };
    }

    let S = store.get('sideline:session') || blankSession();
    /* A saved evaluation as the rest of the app expects it. Records from a
       backup file are only checked for a ratings object, and a number where a
       date or name belongs threw in the Saved list and the CSV, while a bad
       savedAt threw in toISOString and stopped every upload, not just its own. */
    function tidyRecord(h) {
      const r = {...h, id: safeId(h.id)};
      ['mentor', 'date', 'field', 'sub', 'time', 'division', 'referee', 'comments']
        .forEach(k => {if (typeof r[k] !== 'string') r[k] = r[k] == null ? '' : String(r[k]);});
      if (r.position !== 'AR') r.position = 'CR';
      if (r.moveUp !== 'Yes' && r.moveUp !== 'No') r.moveUp = null;
      const rt = r.ratings && typeof r.ratings === 'object' ? r.ratings : {};
      r.ratings = Object.fromEntries(RATED.map(c => [c.id, [1, 2, 3, 4].includes(rt[c.id]) ? rt[c.id] : null]));
      r.notes = Array.isArray(r.notes) ? r.notes.filter(n => n && typeof n === 'object') : [];
      const t = Number(r.savedAt);
      r.savedAt = Number.isFinite(t) && t > 0 && t < 8.64e15 ? t : Date.now();
      return r;
    }
    let HIST = store.get('sideline:history') || [];
    if (!Array.isArray(HIST)) HIST = [];
    HIST = HIST.filter(h => h && typeof h === 'object').map(tidyRecord);

    /* Migration guard: if a stored session predates a field added later,
       fill the gap rather than crash on undefined. Cheap insurance for an
       app whose data lives on your phone across versions - and it is also
       the gate every restored backup passes through, since a backup file
       may come from an older build. */
    function normalize() {
      if (!S || typeof S !== 'object') S = blankSession();
      S.ui = {...blankUI(), ...(S.ui || {})};
      // Also restored from backup files. An unknown tab hid every tab, and the
      // category is written into the page unescaped (data-chip).
      const ui0 = blankUI();
      if (!['fields', 'observe', 'score', 'refs', 'saved'].includes(S.ui.tab)) S.ui.tab = ui0.tab;
      if (!CATS.some(c => c.id === S.ui.cat)) S.ui.cat = ui0.cat;
      if (![1, -1, 2].includes(S.ui.pol)) S.ui.pol = ui0.pol;
      if (typeof S.ui.draftText !== 'string') S.ui.draftText = '';
      if (typeof S.mentor !== 'string') S.mentor = store.get('sideline:mentor') || '';
      if (!/^\d{4}-\d{2}-\d{2}$/.test(S.date || '')) S.date = todayISO();
      if (!Array.isArray(S.fields)) S.fields = [];
      S.fields = S.fields.filter(f => f && typeof f === 'object');
      S.fields.forEach(f => {
        f.id = safeId(f.id);
        ['name', 'sub', 'division', 'time'].forEach(k => {if (typeof f[k] !== 'string') f[k] = '';});
        if (!Array.isArray(f.refs)) f.refs = [];
        f.refs = f.refs.filter(r => r && typeof r === 'object');
        f.refs.forEach(r => {
          r.id = safeId(r.id);
          r.ratings = {...Object.fromEntries(RATED.map(c => [c.id, null])), ...(r.ratings || {})};
          if (!Array.isArray(r.notes)) r.notes = [];
          r.notes = r.notes.filter(n => n && typeof n === 'object');
          r.notes.forEach(n => {n.id = safeId(n.id);});
          if (typeof r.name !== 'string') r.name = '';
          if (typeof r.comments !== 'string') r.comments = '';
        });
        relabelSlots(f);
      });
    }
    normalize();

    /* A session restored from storage keeps the date it was created on, so the
       next Saturday the import's "today only" filter matched nothing and new
       saves carried last week's date. An empty session just rolls forward; one
       holding games gets a banner on the Fields tab asking what to do. */
    function sessionHasData() {
      return S.fields.some(f => f.name || f.refs.some(r => r.name.trim() || r.notes.length));
    }
    if (S.date !== todayISO() && !sessionHasData()) S.date = todayISO();

    let saveTimer = null;
    function writeState() {
      clearTimeout(saveTimer); saveTimer = null;
      store.set('sideline:session', S);
      store.set('sideline:history', HIST);
      if (S.mentor) store.set('sideline:mentor', S.mentor);
    }
    function save() {
      // Debounce: typing a name fires an input event per keystroke, and
      // JSON.stringify + a disk write on every one is wasteful. Collapse
      // bursts into a single write 250ms after you stop.
      clearTimeout(saveTimer);
      saveTimer = setTimeout(writeState, 250);
    }
    /* A phone freezes or closes the app as soon as it leaves the screen, and a
       write still waiting out the debounce went with it: a chip tapped just
       before locking the phone was gone next time. Leaving the screen writes
       immediately. */
    function flushSave() {if (saveTimer) writeState();}
    window.addEventListener('pagehide', flushSave);
    document.addEventListener('visibilitychange', () => {if (document.visibilityState === 'hidden') flushSave();});

    /* Adds one pitch, reusing a blank placeholder if there is one. */
    function addFieldEntry(name, sub, crewSize) {
      if (S.fields.some(f => f.name === name && (f.sub || '') === (sub || ''))) return null;
      const empty = S.fields.find(f => !f.name && !f.refs.some(r => r.name || r.notes.length));
      const f = empty || newField('');
      f.name = name; f.sub = sub || '';
      const want = Math.min(Math.max(crewSize || 3, 1), 3);
      const labels = want === 1 ? ['CR'] : want === 2 ? ['CR', 'AR1'] : ['CR', 'AR1', 'AR2'];
      f.refs = labels.map(l => newRef(l, l.startsWith('AR') ? 'AR' : 'CR'));
      f.crewSize = want;
      relabelSlots(f);
      if (!empty) S.fields.push(f);
      return f;
    }

    /* Deleting a game is now always available, guarded by a dialog rather than
       by hiding the button. Hiding it was the old "hardcoded limiter" - you
       could not clear a finished game without emptying it by hand first. */
    function deleteGame(fid, after) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      const notes = f.refs.reduce((a, r) => a + r.notes.length, 0);
      const named = f.refs.filter(r => r.name.trim()).length;
      const what = `${pitchLabel(f) || 'This game'}${f.time ? ' at ' + pretty12(f.time) : ''}`;
      const detail = notes ? ` It has ${notes} note${notes === 1 ? '' : 's'} on ${named} referee${named === 1 ? '' : 's'}.`
        : '';
      askConfirm(`Delete ${what}?${detail} Evaluations you already saved are kept.`, 'Delete', () => {
        S.fields = S.fields.filter(x => x.id !== fid);
        if (!activePair()) S.activeRefId = null;
        if (!S.fields.some(x => x.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0] ? S.fields[0].id : null;
        save();
        if (after) after(); else renderAll();
        flash('Game deleted');
      });
    }
    function toggleDone(fid) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      f.done = !f.done;
      save(); renderAll();
      flash(f.done ? 'Marked done' : 'Back on the list');
    }
    function gameSummary(f) {
      const refs = f.refs;
      const notes = refs.reduce((a, r) => a + r.notes.length, 0);
      const rated = refs.filter(r => RATED.every(c => r.ratings[c.id] != null)).length;
      const names = refs.map(r => r.name.trim()).filter(Boolean);
      return {
        notes, rated, names, total: refs.length,
        complete: refs.length > 0 && refs.every(r => r.submitted)
      };
    }

    /* ---------- lookups ---------- */
    function allRefs() {return S.fields.flatMap(f => f.refs.map(r => ({field: f, ref: r})));}
    function activePair() {return allRefs().find(x => x.ref.id === S.activeRefId) || null;}

    /* ---------- the day group ----------
       The league takes ONE evaluation per referee per day, not one per game.
       A referee who works 8:00 on 2A and 9:00 on 2B is one submission covering
       both, so everything that scores or files a referee works on this group
       rather than on a single pitch entry.

       Membership is by name, through nameKey, which already folds "Ruiz, Ana"
       and accents together for the referee profiles. An entry with no name yet
       is only ever itself: blank names must not all collapse into one person. */
    function dayGroupFor(ref) {
      if (!ref) return [];
      const all = allRefs();
      const key = nameKey(ref.name);
      const mine = key
        ? all.filter(x => nameKey(x.ref.name) === key)
        : all.filter(x => x.ref.id === ref.id);
      const idx = (n) => {const i = FIELDS.indexOf(n); return i < 0 ? 999 : i;};
      return mine.sort((a, b) =>
        (a.field.time || '99:99').localeCompare(b.field.time || '99:99')
        || idx(a.field.name) - idx(b.field.name)
        || (a.field.sub || '').localeCompare(b.field.sub || ''));
    }

    /* The entry whose game answers the form's single Field / Time / Division
       questions. The others are named in the comments and in the block.

       Normally that is the earliest kickoff. When the day mixes divisions it is
       the earliest that PLAYS offside, and that is not cosmetic: only the lead's
       division is uploaded, so a day of Kindergarten at 8:00 and 4th grade at
       9:00 filed under "Kindergarten" would come back from the league looking
       like a day with no offside, and a real offside rating would be dropped
       from the referee's average. Naming the 4th-grade game keeps the copy
       other mentors see consistent with the one on this phone. */
    function dayLead(g) {
      if (!g || !g.length) return null;
      return g.find(x => x.field.division && divisionHasOffside(x.field.division)) || g[0];
    }
    const dayIds = (g) => g.map(x => x.ref.id);
    const dayNotes = (g) => g.flatMap(x => x.ref.notes || []);
    const dayDivisions = (g) => [...new Set(g.map(x => x.field.division).filter(Boolean))];

    /* Offside counts for the day if ANY game that day played it. A referee who
       did Kindergarten at 8:00 and 4th grade at 9:00 did face offside, so their
       offside rating is real and belongs in their average. */
    const dayHasOffside = (g) => {
      const divs = dayDivisions(g);
      return divs.length ? divs.some(divisionHasOffside) : true;
    };

    /* One set of answers for the day, written to every entry in the group. The
       per-game copies are what the pitch markers, the crew rows and the picker's
       "4/6 rated" read, so they have to agree with what the Score tab shows. */
    function applyToDay(g, patch) {
      g.forEach(x => {
        if (patch.ratings) x.ref.ratings = {...x.ref.ratings, ...patch.ratings};
        if ('moveUp' in patch) x.ref.moveUp = patch.moveUp;
        if ('comments' in patch) x.ref.comments = patch.comments;
        if ('commentsEdited' in patch) x.ref.commentsEdited = patch.commentsEdited;
        if ('noOffsides' in patch) x.ref.noOffsides = patch.noOffsides;
        if ('submitted' in patch) x.ref.submitted = patch.submitted;
      });
    }

    /* Bring a group into step. Two games rated separately before the second was
       named would otherwise disagree; take the lead's answer where it has one
       and the earliest other answer where it does not, so no work is thrown
       away by two entries becoming one person. */
    function reconcileDay(g) {
      if (g.length < 2) return false;
      const lead = dayLead(g).ref;
      const pick = (get) => {
        const v = get(lead);
        if (v != null && v !== '') return v;
        for (const x of g) {const o = get(x.ref); if (o != null && o !== '') return o;}
        return v;
      };
      const ratings = {};
      RATED.forEach(c => {ratings[c.id] = pick(r => r.ratings[c.id]);});
      const moveUp = pick(r => r.moveUp);
      const comments = pick(r => r.comments);
      const before = JSON.stringify(g.map(x => [x.ref.ratings, x.ref.moveUp, x.ref.comments]));
      applyToDay(g, {
        ratings, moveUp: moveUp || null, comments: comments || '',
        commentsEdited: g.some(x => x.ref.commentsEdited),
        noOffsides: g.some(x => x.ref.noOffsides)
      });
