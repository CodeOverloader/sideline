      return before !== JSON.stringify(g.map(x => [x.ref.ratings, x.ref.moveUp, x.ref.comments]));
    }

    /* A referee can centre one game and run the line in the next, so the day
       has more than one role even though the form has a single Position box.
       The heading says both; the form gets the lead's, and every game's slot is
       listed in the comments. */
    function dayRoles(g) {
      const roles = [...new Set(g.map(x => x.ref.role).filter(Boolean))];
      return roles.length ? roles.join(' and ') : '';
    }

    /* "Field 2A 8:00 AM (Kindergarten, CR)" - how a game reads in the list on
       the Score tab when a referee worked more than one. */
    function dayGameLabel(x) {
      const bits = [fullPitchLabel(x.field)];
      if (x.field.time) bits.push(pretty12(x.field.time));
      const inner = [x.field.division, x.ref.slot].filter(Boolean).join(', ');
      return bits.join(' ') + (inner ? ` (${inner})` : '');
    }
    function refDisplay(r) {return r.name.trim() || `Unnamed ${r.slot}`;}

    /* ---------- crew size ----------
       Rebuilding the crew must never silently delete notes you already
       took, so shrinking keeps the extra slots' data until you confirm.
       Slot roles default to the common setup and stay editable: 2-man is
       sometimes CR + AR and sometimes dual CR, and the form only offers
       CR or AR, so the role is what gets submitted. */
    /* Slot labels are derived, never stored as truth: the label has to
       follow the role or the pitch map lies to you. A dual-referee 2-man
       crew reads CR1 / CR2, a standard crew reads CR / AR1 / AR2, and a
       lone AR is just AR. Called after anything that changes roles. */
    function relabelSlots(f) {
      let cr = 0, ar = 0;
      const crTotal = f.refs.filter(r => r.role === 'CR').length;
      const arTotal = f.refs.filter(r => r.role === 'AR').length;
      f.refs.forEach(r => {
        if (r.role === 'CR') {cr++; r.slot = crTotal > 1 ? 'CR' + cr : 'CR';}
        else {ar++; r.slot = arTotal > 1 ? 'AR' + ar : 'AR';}
      });
    }

    function setCrewSize(fid, n) {
      const f = S.fields.find(x => x.id === fid); if (!f) return;
      // Tapping the size already chosen used to rebuild the crew anyway, which
      // turned a dual-referee pair (CR + CR) back into CR + AR.
      if (n === f.refs.length) return;
      const doomed = f.refs.slice(n).filter(r => r.notes.length || r.name.trim());
      if (doomed.length) {
        askConfirm(`Dropping to ${n} official${n === 1 ? '' : 's'} removes ${doomed.length} referee(s) with data on them.`,
          'Remove', () => {applyCrewSize(f, n); renderSheet();});
        return;
      }
      applyCrewSize(f, n);
    }
    function applyCrewSize(f, n) {
      const labels = n === 1 ? ['CR'] : n === 2 ? ['CR', 'AR1'] : ['CR', 'AR1', 'AR2'];
      const kept = f.refs.slice(0, n);
      while (kept.length < n) kept.push(newRef(labels[kept.length], labels[kept.length].startsWith('AR') ? 'AR' : 'CR'));
      kept.forEach((r, i) => {r.role = labels[i].startsWith('AR') ? 'AR' : 'CR';});
      f.refs = kept; f.crewSize = n;
      relabelSlots(f);
      if (!activePair()) S.activeRefId = null;
      save(); renderAll();
    }

    /* ============================================================
       PITCH MAP
       ------------------------------------------------------------
       Drawn as inline SVG rather than an image so the markers can be
       real, tappable, labelled elements that recolor with state.
       viewBox is a coordinate system, not pixels: everything below is
       drawn in a fixed 320x210 space and the browser scales it to
       whatever width the phone has. That is why this works on any
       screen without a single media query.
    
       Marker geometry follows ROLE, not slot number, because that is
       what is physically true: an AR stands on the touchline in one
       half, a center works the middle. A dual-referee 2-man crew gets
       two diagonal interior markers automatically.
       ============================================================ */
    const AR_SPOTS = [[100, 26], [220, 182], [226, 26], [94, 182]];   // touchlines, alternating halves
    const CR_SPOTS_1 = [[160, 104]];
    const CR_SPOTS_2 = [[106, 146], [214, 62]];                   // opposite diagonals, clear of the center circle

    function layoutCrew(field) {
      const crs = [], ars = [];
      field.refs.forEach((r, i) => (r.role === 'AR' ? ars : crs).push({r, i}));
      const crSpots = crs.length >= 2 ? CR_SPOTS_2 : CR_SPOTS_1;
      const out = [];
      crs.forEach((x, k) => out.push({...x, xy: crSpots[k % crSpots.length]}));
      ars.forEach((x, k) => out.push({...x, xy: AR_SPOTS[k % AR_SPOTS.length]}));
      return out;
    }

    function marker(ref, x, y) {
      const on = ref.id === S.activeRefId;
      const n = ref.notes.length;
      const first = (ref.name.trim().split(/\s+/)[0] || '').slice(0, 10);
      const cls = `mk${on ? ' on' : ''}${ref.name.trim() ? '' : ' unnamed'}`;
      const nameY = y > 150 ? y - 24 : y + 30;
      return `<g class="${cls}" data-pick="${ref.id}" role="button" tabindex="0"
             aria-label="Take notes on ${esc(refDisplay(ref))}">
    <circle cx="${x}" cy="${y}" r="27" fill="transparent"></circle>
    <circle class="mkbg" cx="${x}" cy="${y}" r="17"></circle>
    <text class="mklabel" x="${x}" y="${y + 4}">${esc(ref.slot)}</text>
    ${first ? `<text class="mkname" x="${x}" y="${nameY}">${esc(first)}</text>` : ''}
    ${n ? `<circle class="cntbg" cx="${x + 14}" cy="${y - 14}" r="8"></circle>
           <text class="cnt" x="${x + 14}" y="${y - 11}">${n}</text>` : ''}
  </g>`;
    }

    function pitchSVG(field) {
      const marks = layoutCrew(field).map(({r, xy}) => marker(r, xy[0], xy[1])).join('');
      return `<svg class="pitch" viewBox="0 0 320 210" xmlns="http://www.w3.org/2000/svg" aria-label="Pitch map">
    <g stroke="var(--chalk)" stroke-width="1.4" fill="none">
      <rect x="16" y="26" width="288" height="156" rx="2"></rect>
      <line x1="160" y1="26" x2="160" y2="182"></line>
      <circle cx="160" cy="104" r="26"></circle>
      <rect x="16" y="60" width="40" height="88"></rect>
      <rect x="264" y="60" width="40" height="88"></rect>
      <rect x="16" y="82" width="15" height="44"></rect>
      <rect x="289" y="82" width="15" height="44"></rect>
    </g>
    <circle cx="160" cy="104" r="2" fill="var(--chalk)"></circle>
    <rect x="10" y="90" width="6" height="28" fill="var(--chalk)"></rect>
    <rect x="304" y="90" width="6" height="28" fill="var(--chalk)"></rect>
    ${marks}
  </svg>`;
    }

    function refProgress(r) {
      const done = RATED.filter(c => r.ratings[c.id] != null).length;
      return {notes: r.notes.length, done, total: RATED.length, ready: done === RATED.length && r.moveUp && r.comments.trim()};
    }

    /* A group is every pitch that shares a field name and kickoff - i.e. the two
       Tigers games at 8:00. The strip shows one chip per group and the view shows
       all of its pitches, instead of eight near-identical chips for one morning. */
    function groupKey(f) {return (f.name || '') + '|' + (f.time || '');}
    function fieldGroups() {
      const m = new Map();
      S.fields.forEach(f => {
        const k = groupKey(f);
        if (!m.has(k)) m.set(k, []);
        m.get(k).push(f);
      });
      return [...m.values()].map(list =>
        list.slice().sort((a, b) => (a.sub || '').localeCompare(b.sub || '')));
    }
    function groupOf(field) {
      return fieldGroups().find(g => g.some(x => x.id === field.id)) || [field];
    }

    function selectedField() {
      if (!S.fields.some(f => f.id === S.ui.fieldId)) S.ui.fieldId = S.fields[0] ? S.fields[0].id : null;
      return S.fields.find(f => f.id === S.ui.fieldId) || null;
    }

    /* With one or two fields you can stack every pitch. Monitoring a full
       slate is eight or ten, and stacking those means scrolling past six
       pitches to reach the one in front of you. So: a strip of every field
       across the top, one pitch shown at a time, and a coverage line that
       answers the question you actually have at 10am - who have I not
       watched yet. */
    /* The horizontal strip failed in use: thirteen chips with near-identical
       names and times, most off-screen, and rebuilding it with innerHTML reset
       its scroll to the far left on every tap - which is why selecting a 1pm
       game threw you back to 8am. Replaced by a full-screen picker grouped by
       kickoff, where each row carries the division and the referee names, i.e.
       the things that actually tell two games apart. Nothing scrolls sideways. */
    function visibleGames() {
      return S.fields.filter(f => S.ui.showDone || !f.done);
    }
    /* The two lines that identify a game everywhere it is listed. One helper,
       so an edit in Settings can refresh every visible copy in place. */
    function gameHeadHTML(f, withTime) {
      const g = gameSummary(f);
      const when = withTime && f.time ? ' &middot; ' + esc(pretty12(f.time)) : '';
      return `<div class="t1">${esc(fullPitchLabel(f))}${when}${f.done ? ' &check;' : ''}</div>
      <div class="t2">${esc(f.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no referees named'}</div>`;
    }
    function gameRow(f, opts) {
      const g = gameSummary(f);
      const on = f.id === S.ui.fieldId;
      const doneLabel = f.done ? 'Put back on the list' : 'Mark done';
      return `<div class="grow${on ? ' on' : ''}${f.done ? ' done' : ''}">
    <button style="flex:1;min-width:0;text-align:left;background:none" data-game="${f.id}" data-gamehead="${f.id}">
      ${gameHeadHTML(f, false)}
    </button>
    <div class="meter">${g.notes ? `<b>${g.notes}</b> note${g.notes === 1 ? '' : 's'}` : 'no notes'}<br>${g.rated}/${g.total} rated</div>
    ${opts && opts.actions ? `
      <button class="minibtn" data-done="${f.id}" aria-label="${doneLabel}">${f.done ? 'Reopen' : '&check; Done'}</button>` : ''}
  </div>`;
    }

    function renderPicker() {
      const games = visibleGames();
      const doneCount = S.fields.filter(f => f.done).length;
      const slots = new Map();
      games.forEach(f => {
        const k = f.time || '';
        if (!slots.has(k)) slots.set(k, []);
        slots.get(k).push(f);
      });
      const fieldIdx = (n) => {const i = FIELDS.indexOf(n); return i < 0 ? 999 : i;};
      const body = [...slots.entries()].sort((a, b) => (a[0] || '99:99').localeCompare(b[0] || '99:99'))
        .map(([time, list]) => {
          list.sort((a, b) => fieldIdx(a.name) - fieldIdx(b.name) || (a.sub || '').localeCompare(b.sub || ''));
          return `<div class="slothead">${time ? esc(pretty12(time)) : 'No kickoff set'}</div>
        ${list.map(f => gameRow(f, {actions: true})).join('')}`;
        }).join('');

      $('#sheetBody').innerHTML = `
    ${games.length ? body : `<div class="empty">${doneCount ? 'Every game is marked done.'
          : 'Nothing to show. Import the day\'s schedule to get started.'}</div>`}
    ${doneCount ? `<button class="btn sm ghost" id="toggleDone" style="margin-top:14px">
      ${S.ui.showDone ? 'Hide' : 'Show'} ${doneCount} finished game${doneCount === 1 ? '' : 's'}</button>` : ''}
    <div class="row" style="margin-top:10px">
      <button class="btn sm primary" id="openImport">Import schedule</button>
      <button class="btn sm ghost" id="openSettings2">Settings</button>
    </div>`;
    }

    /* The bar that opens the picker, shown on both working tabs. */
    function nowGameBar() {
      const f = selectedField();
      if (!f) return '';
      const g = gameSummary(f);
      // data-openpicker, not id="openPicker": this bar is rendered on two tabs at
      // once (hidden tabs keep their markup) and the header button owns that id.
      return `<button class="nowgame" data-openpicker="1" aria-haspopup="dialog">
    <div style="min-width:0">
      <div class="g1">${esc(fullPitchLabel(f))}${f.time ? ' &middot; ' + esc(pretty12(f.time)) : ''}</div>
      <div class="g2">${esc(f.division || 'no division')} &mdash; ${g.names.length ? esc(g.names.join(', ')) : 'no referees named'}</div>
    </div>
    <span class="chev">&#9662;</span>
  </button>`;
    }

    function renderFields() {
      const f = selectedField();
      /* First run (or a cleared session) used to draw a blank "Field not set"
         pitch and pop Settings open on every launch. A setup card asks for the
         two things that matter instead: your name and the schedule. */
      if (!f || !sessionHasData()) {
        $('#fieldsWrap').innerHTML = `${staleDateBanner()}
    <div class="card" style="margin-top:14px">
      <h2 class="sec" style="margin-top:0">Set up today</h2>
      <p class="hint">Import the schedule and every field, kickoff and referee name comes in at once.</p>
      <label class="f"><span>Your name, as it goes on the form</span>
        <input type="text" data-mentor value="${esc(S.mentor)}" placeholder="Mentor/Monitor name" autocomplete="name" /></label>
      <button class="btn primary" id="openImport" style="margin-top:12px">Import the schedule</button>
      <div class="row" style="margin-top:8px">
        <button class="btn sm" id="openSettings2">Add a game by hand</button>
        <button class="btn sm ghost" data-tab="saved">Restore a backup</button>
      </div>
    </div>`;
        return;
      }
      const group = groupOf(f);
      const refs = allRefs();
      const named = refs.filter(x => x.ref.name.trim());
      const withNotes = refs.filter(x => x.ref.notes.length);
      const fullyRated = refs.filter(x => RATED.every(c => x.ref.ratings[c.id] != null));
      // Finished games are off the list, so their referees should not nag here.
      /* This used to print "Tigers B CR, 2A CR, 2A AR1, 2A AR2, 2B CR, ..." -
         a wall of abbreviations you had to decode one at a time. Names are what
         a mentor actually recognises, so lead with those. */
      const pend = named.filter(x => !x.ref.notes.length && !x.field.done);
      const dupe = new Map();
      pend.forEach(x => dupe.set(x.ref.name.trim(), (dupe.get(x.ref.name.trim()) || 0) + 1));
      const unwatched = pend.map(x => {
        const n = x.ref.name.trim();
        return dupe.get(n) > 1 ? `${n} (${pitchLabel(x.field)})` : n;
      });

      // Every pitch at this field and kickoff, each with its own crew.
      // Two Tigers pitches means two small pitch maps, one above the other, so
      // you can see the whole area you are standing in front of.
      const blocks = group.map(pf => {
        const crew = pf.refs.map(r => {
          const done = RATED.filter(c => r.ratings[c.id] != null).length;
          return `<div class="crewrow${r.id === S.activeRefId ? ' on' : ''}">
        <span class="slot">${esc(r.slot)}</span>
        <input type="text" placeholder="Referee name" value="${esc(r.name)}" data-name="${r.id}" />
        <span class="prog">${r.notes.length} note${r.notes.length === 1 ? '' : 's'}<br>${done}/${RATED.length} rated</span>
        <button class="go" data-open="${r.id}">Notes</button>
      </div>`;
        }).join('');
        /* Done / Delete live on each pitch. They used to sit once at the bottom
           and acted only on the selected pitch, even with two pitches shown. */
        return `<div class="fieldblock">
      <div class="fieldhead">
        <div class="fname">${esc(fullPitchLabel(pf))}</div>
        ${pf.done ? '<span class="pill">done</span>' : ''}
        <div class="spacer"></div>
        <button class="minibtn" data-done="${pf.id}">${pf.done ? 'Reopen' : '&check; Done'}</button>
      </div>
      ${pitchSVG(pf)}
      <div class="crew">${crew}</div>
    </div>`;
      }).join('');

      const meta = [f.name, f.division, pretty12(f.time)].filter(Boolean).join(', ');

      $('#fieldsWrap').innerHTML = `
    ${staleDateBanner()}
    ${nowGameBar()}
    <div class="card" style="margin-top:2px">
      <div class="cov">
        <span><b>${named.length}</b> referees</span>
        <span><b>${withNotes.length}</b> with notes</span>
        <span><b>${fullyRated.length}</b> fully rated</span>
      </div>
      ${unwatched.length ? `<div class="hint" style="margin:8px 0 0">Not watched yet:
        ${esc(unwatched.slice(0, 8).join(', '))}${unwatched.length > 8 ? ` and ${unwatched.length - 8} more` : ''}</div>` : ''}
    </div>
    <div class="hint" style="margin:10px 0 0">${esc(meta || 'Field not set')}${group.length > 1
          ? ` &mdash; ${group.length} pitches, one referee each` : ''}</div>
    ${blocks}
    <div class="hint" style="margin-top:6px">Tap a position on the pitch to switch who you are watching.
      Every note goes to whoever is named in the blue bar at the top.</div>`;
    }

    function staleDateBanner() {
      if (S.date === todayISO() || S.ui.keepDate === todayISO()) return '';
      return `<div class="warn" style="margin-top:12px">
      <b>This session is dated ${esc(prettyDate(S.date))}</b>, but today is ${esc(prettyDate(todayISO()))}.
      Saved evaluations and the import's date filter use the session date.
      <button class="btn sm primary" id="dateFresh" style="margin-top:8px">Clear it and start today</button>
      <div class="row" style="margin-top:6px">
        <button class="btn sm" id="dateToday">Keep games, use today</button>
        <button class="btn sm ghost" id="dateKeep">Keep ${esc(prettyDate(S.date))}</button>
      </div>
    </div>`;
    }

    /* ============================================================
       HEADER + OBSERVE
       ============================================================ */
    function renderWatching() {
      const p = activePair();
      const box = $('#watching');
      const tab = S.ui.tab;
      // Only where notes can land on the wrong person.
      box.hidden = (tab === 'refs' || tab === 'saved');
      if (box.hidden) return;
      if (!p) {
        box.className = 'watching idle';
        box.innerHTML = `<div style="min-width:0"><div class="who">No referee selected</div>
      <div class="sub">Tap a position on a field to start</div></div>`;
        return;
      }
      box.className = 'watching';
      // One tap from the referee you are watching to what earlier mentors said.
      const past = pastEvaluations(p.ref);
      box.innerHTML = `<span class="rolechip">${esc(p.ref.role)}</span>
    <div style="min-width:0">
      <div class="who">${esc(refDisplay(p.ref))}</div>
      <div class="sub">${esc(p.field.name || 'field not set')}${p.field.sub ? ' ' + esc(p.field.sub) : ''} &nbsp;&middot;&nbsp; ${esc(p.ref.slot)}</div>
    </div>
    ${past ? `<button class="minibtn" data-profile="${esc(past.g.key)}"
      aria-label="${esc(past.g.name)}: ${plural(past.past.length, 'earlier evaluation')}">History ${past.past.length}</button>` : ''}
`;
    }

    /* Two rows: every field, then just the selected field's crew. A single
       flat list of every official across ten fields is a horizontal scroll
       nobody can hit accurately while watching a game. */
    function renderMinimap() {
      const p = activePair();
      const fid = p ? p.field.id : S.ui.fieldId;
      const f = S.fields.find(x => x.id === fid);
      const group = f ? groupOf(f) : [];
      const crew = group.flatMap(pf => pf.refs.map(r => {
        const on = r.id === S.activeRefId;
        return `<button class="mini${on ? ' on' : ''}" data-pick="${r.id}">
      <span class="m1">${esc(r.slot)}${pf.sub ? '&middot;' + esc(pf.sub) : ''}</span> ${esc(refDisplay(r).split(/\s+/)[0])}
      ${r.notes.length ? `<span style="color:var(--plus);font-weight:700"> ${r.notes.length}</span>` : ''}
    </button>`;
      })).join('');
      $('#minimap').innerHTML = `${nowGameBar()}<div class="minimap" style="padding-top:0">${crew}</div>`;
    }

    function renderObserve() {
      const p = activePair();
      if (!p) {
        /* Two different empty states. With no games at all, "pick a referee
           above" points at nothing - the next step is the schedule. */
        $('#observeBody').innerHTML = S.fields.length
          ? `<div class="empty">Pick a referee above, or tap a position on the
      Fields tab. Notes always attach to the referee in the blue bar.</div>`
          : `<div class="card" style="margin-top:14px">
      <h2 class="sec" style="margin-top:0">No games yet</h2>
      <p class="hint">Import the day's schedule and every field, kickoff and referee
        name comes in at once. Then tap a referee to start taking notes.</p>
      <button class="btn primary" id="openImport" style="margin-top:4px">Import the schedule</button>
      <button class="btn sm ghost" id="openSettings2" style="margin-top:8px">Add a game by hand</button>
    </div>`;
        return;
      }
      const {field, ref} = p;
      const catRow = CATS.map(c => {
        const n = ref.notes.filter(x => x.cat === c.id).length;
        return `<button class="cat${S.ui.cat === c.id ? ' on' : ''}" data-cat="${c.id}"
      aria-pressed="${S.ui.cat === c.id}"
      aria-label="${esc(c.label)}${n ? `, ${n} note${n === 1 ? '' : 's'}` : ''}">
      ${esc(c.short)}${n ? `<span class="n">${n}</span>` : ''}</button>`;
      }).join('');

      // Role filter: a chip with pos:'AR' is hidden from a center referee
      // and vice versa. Fewer wrong taps when you are watching live.
      const improving = S.ui.pol === 2;
      const chips = CHIPS.filter(c => c.cat === S.ui.cat && (!c.pos || c.pos === ref.role))
        .map((c, i) => {
          const cls = improving ? 'b' : c.pol > 0 ? 'p' : 'm-';
          const mark = improving ? '\u2191' : c.pol > 0 ? '+' : '\u2212';
          return `<button class="chip ${cls}" data-chip="${S.ui.cat}|${i}">
        <span class="m">${mark}</span><span>${esc(c.text)}</span></button>`;
        }).join('');

      const notes = ref.notes.slice().reverse().map(n => {
        const cat = CATS.find(c => c.id === n.cat);
        const cls = n.pol === 1 ? 'p' : n.pol === -1 ? 'n' : n.pol === 2 ? 'b' : 'o';
        // The time each note was taken was always recorded and never shown.
        const meta = [cat ? cat.short : '', n.at ? clockOf(n.at) : ''].filter(Boolean).join(' \u00b7 ');
        return `<div class="nrow ${cls}">
      <span class="mk2">${POL[n.pol] ? POL[n.pol].mark : '\u00b7'}</span>
      <span class="bd">${esc(n.text)}<span class="cn">${esc(meta)}</span></span>
      ${n.pol === -1 ? `<button class="del" data-better="${n.id}"
        title="They fixed this after halftime" aria-label="Mark improved">&uarr;</button>` : ''}
      <button class="del" data-del="${n.id}" title="Delete note" aria-label="Delete note">&times;</button>
    </div>`;
      }).join('');

      const placeholder = improving ? 'What improved?' : S.ui.pol === -1 ? 'Something to work on' : 'A strength';
      $('#observeBody').innerHTML = `
    ${historyLine(ref)}
    <div class="cats">${catRow}</div>
    ${improving ? `<div class="hint" style="margin:0 0 8px">&uarr; is on: every note you add now logs as
      <b>improved after halftime</b>.</div>` : ''}
    <div class="chipgrid">${chips || '<div class="hint">No quick notes for this role. Type one below.</div>'}</div>
    <div class="noteadd">
      <div class="polset" role="group" aria-label="Note type">
        <button data-pol="1"  aria-pressed="${S.ui.pol === 1}" title="Strength" aria-label="Strength">+</button>
        <button data-pol="-1" aria-pressed="${S.ui.pol === -1}" title="To work on" aria-label="To work on">&minus;</button>
        <button data-pol="2"  aria-pressed="${S.ui.pol === 2}" title="Improved after halftime"
          aria-label="Improved after halftime">&uarr;</button>
      </div>
      <input type="text" id="noteText" placeholder="${placeholder}" aria-label="Note text" value="${esc(S.ui.draftText)}"
             enterkeyhint="done" autocapitalize="sentences" />
      <button class="btn primary" style="width:auto;padding:11px 15px" id="addNote">Add</button>
    </div>
    <div class="timeline">${notes || '<div class="empty">No notes on this referee yet.</div>'}</div>
    ${ref.notes.length ? `<button class="btn ghost sm" id="toScore" style="margin-top:10px">Rate ${esc(refDisplay(ref))} &rarr;</button>` : ''}
  `;
    }

    function addNote(cat, pol, text) {
      const p = activePair(); if (!p || !text.trim()) return;
      // Clear the draft BEFORE rendering. renderObserve rebuilds the input
      // from S.ui.draftText, so clearing it afterwards would reprint the
      // text you just submitted.
      S.ui.draftText = '';
      const note = {id: uid(), cat, pol, text: text.trim(), at: Date.now()};
      const ref = p.ref;
      ref.notes.push(note);
      // Blanking an unedited draft marks it stale; the Score tab rebuilds it
      // on arrival. If you have already typed your own comments, they stand.
      if (!ref.commentsEdited) ref.comments = '';
      save(); renderAll();
      // A mis-tapped chip while watching live is the most common slip, so every
      // add can be taken back from the toast without hunting for the note.
      flash('Added to ' + refDisplay(ref), {label: 'Undo', run: () => dropNote(ref, note.id)});
    }

    function dropNote(ref, id) {
      ref.notes = ref.notes.filter(n => n.id !== id);
      if (!ref.commentsEdited) ref.comments = '';
      save(); renderAll();
    }

    /* ============================================================
       SCORE TAB
       ------------------------------------------------------------
       The ratings are yours to set - the app never scores for you. It
       only shows what your own notes said about each category, because
       after two hours and six referees the notes are more reliable than
       memory.
       ============================================================ */
    // Takes a notes array, so it can tally one game or a whole day's games.
    function catTally(notes, catId) {
      const ns = (notes || []).filter(n => n.cat === catId);
      return {
        n: ns.length, plus: ns.filter(n => n.pol === 1).length,
        minus: ns.filter(n => n.pol === -1).length, better: ns.filter(n => n.pol === 2).length
      };
    }

    /* Build the COMMENTS paragraph from the notes.
       Duplicates collapse with a count, so three late flags read as
       "flagged late (x3)" instead of padding the paragraph. */
    const POL = {
      1: {mark: '+', word: 'Strengths'}, '-1': {mark: '\u2212', word: 'To work on'},
      2: {mark: '\u2191', word: 'Improved after halftime'}
    };

    function buildComments(g) {
      const lead = dayLead(g);
      if (!lead) return '';
      const {ref, field} = lead;
      const notes = dayNotes(g);
      const group = (pol) => {
        const out = [];
        CATS.forEach(c => {
          const counts = new Map();
          notes.filter(n => n.cat === c.id && n.pol === pol).forEach(n => {
            const key = n.text;
            const cur = counts.get(key) || {text: n.text, n: 0};
            cur.n++; counts.set(key, cur);
          });
          counts.forEach(v => {
            let s = v.text.charAt(0).toLowerCase() + v.text.slice(1);
            if (v.n > 1) s += ` (x${v.n})`;
            out.push(s);
          });
        });
        return out;
      };
      /* Only the feedback. This used to open with a list of the games worked
         and close with a sentence explaining why offside was scored 1. Both
         were about how the app works rather than about the referee, and the
         referee is the only one who reads this. The games are on screen on the
         Score tab, and the offside 1 is the form's own instruction. */
      const good = group(1), work = group(-1), better = group(2);
      const parts = [];
      if (good.length) parts.push('Strengths: ' + good.join('; ') + '.');
      if (work.length) parts.push('To work on: ' + work.join('; ') + '.');
      // The halftime story: what you corrected at the break and they fixed after.
      if (better.length) parts.push('Improved after halftime: ' + better.join('; ') + '.');
      if (!parts.length) parts.push(`Watched ${refDisplay(ref)} at ${field.name || 'the field'}. `);
      return parts.join(' ');
    }

    function renderScore() {
      const p = activePair();
      if (!p) {$('#scoreBody').innerHTML = '<div class="empty">Pick a referee first.</div>'; return;}

      /* One evaluation per referee per day, so everything below is the whole
         day: every game they worked, their notes pooled, rated once. */
      const g = dayGroupFor(p.ref);
      const lead = dayLead(g) || p;
      const {field, ref} = lead;
      const notes = dayNotes(g);
      let dirty = reconcileDay(g);

      /* In divisions that do not play offside, the form still wants a 1 in that
         box. Fill it in and say why, rather than leaving the mentor to find the
         checkbox and do it by hand every single game. Nothing here counts
         towards the referee's average - see ratedForRecord(). Across a day this
         applies only when NONE of their games played offside. */
      const noOffsideDivision = !!dayDivisions(g).length && !dayHasOffside(g);
      if (noOffsideDivision && ref.ratings.offsides !== 1) {
        applyToDay(g, {ratings: {offsides: 1}});
        dirty = true;
      }

      if (!ref.comments && !ref.commentsEdited) {
        applyToDay(g, {comments: buildComments(g)});
        dirty = true;
      }
      if (dirty) save();

      const scales = RATED.map(c => {
        const t = catTally(notes, c.id);
        const locked = c.id === 'offsides' && (ref.noOffsides || noOffsideDivision);
        const bits = [];
        if (t.plus) bits.push(`${t.plus} strength${t.plus === 1 ? '' : 's'}`);
        if (t.minus) bits.push(`${t.minus} to work on`);
        if (t.better) bits.push(`${t.better} improved`);
        const hint = t.n ? `${t.n} note${t.n === 1 ? '' : 's'}: ${bits.join(', ')}` : 'no notes taken';
        /* In a division with no offside, the form's 1 would otherwise sit there
           labelled "Needs work" - the exact thing this whole rule exists to
           stop the app saying about a referee. It reads "Not played" instead. */
        const wordFor = (v) => (c.id === 'offsides' && noOffsideDivision && v === 1)
          ? 'Not played' : RATING_WORDS[v];
        const nums = [1, 2, 3, 4].map(v => `<button data-rate="${c.id}|${v}"
      aria-pressed="${ref.ratings[c.id] === v}"
      aria-label="${v} - ${esc(wordFor(v))}" ${locked ? 'disabled style="opacity:.45"' : ''}>
      <span class="rn">${v}</span><span class="rw">${esc(wordFor(v))}</span></button>`).join('');
        return `<div class="ratewrap">
      <div class="rlabel">${esc(c.label)}</div>
      <div class="rhint">${esc(hint)}${c.id === 'offsides' && !noOffsideDivision
          ? ' &middot; form says put 1 if there were no offsides' : ''}</div>
      <div class="scale"><div class="nums">${nums}</div></div>
      ${c.id !== 'offsides' ? '' : noOffsideDivision
          ? `<div class="okbox" style="margin-top:8px">${esc(field.division)} does not play offside, so the
        form's 1 is filled in for you. It is not counted against ${esc(refDisplay(ref))}.</div>`
          : `<label class="switchrow"><input type="checkbox" id="noOff" ${ref.noOffsides ? 'checked' : ''} />
        No offside situations this game</label>`}
    </div>`;
      }).join('');

      $('#scoreBody').innerHTML = `
    <h2 class="sec">${esc(refDisplay(ref))} &mdash; ${esc(dayRoles(g))}</h2>
    ${g.length > 1 ? `<div class="okbox" style="margin:6px 0 10px">
      <b>${esc(refDisplay(ref))} worked ${plural(g.length, 'game')} today.</b>
      This is one evaluation covering all of them - the league takes one per referee per day.
      <ul class="daygames">${g.map(x => `<li${x.ref.id === lead.ref.id ? ' class="on"' : ''}>${esc(dayGameLabel(x))}
        ${x.ref.notes.length ? `<span class="muted">${plural(x.ref.notes.length, 'note')}</span>` : '<span class="muted">no notes</span>'}</li>`).join('')}</ul>
      <div class="hint" style="margin:6px 0 0">The form only has room for one game, so it gets the one in
        bold. Every game is listed in the comments.</div></div>`
          : `<p class="hint">${esc(field.name || 'field not set')}${field.division ? ', ' + esc(field.division) : ''}${field.time ? ', ' + esc(pretty12(field.time)) : ''}</p>`}
    ${historyLine(ref)}
    <div class="card">${scales}</div>
    <div class="card">
      <div class="rlabel" style="font-size:14px;font-weight:600;margin-bottom:8px">Should they move up</div>
      <div class="yesno">
        <button data-move="Yes" aria-pressed="${ref.moveUp === 'Yes'}">Yes</button>
        <button data-move="No"  aria-pressed="${ref.moveUp === 'No'}">No</button>
      </div>
    </div>
    <div class="card">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
        <div class="rlabel" style="font-size:14px;font-weight:600">Comments</div>
        <div class="spacer" style="flex:1"></div>
        <button class="btn sm ghost" style="width:auto" id="rebuild">Rewrite from notes</button>
      </div>
      <textarea id="comments" rows="7" aria-label="Comments" placeholder="Built from your notes; edit freely.">${esc(ref.comments)}</textarea>
      <div class="charcount" id="charCount">${charCountText(ref.comments)}</div>
      <button class="btn sm" id="copyComments" style="margin-top:8px">Copy comments</button>
    </div>
    <div id="readyBox">${readyHTML(g)}</div>

    <h2 class="sec">Send it in</h2>
    <ol class="finish">
      <li><span class="fn">1</span><div>
        <button class="btn primary" id="copyAll">Copy everything in form order</button>
        <div class="hint">Puts the whole block on the clipboard.</div></div></li>
      <li><span class="fn">2</span><div>
        <button class="btn" id="openForm2">Open the form</button>
        <div class="hint">Paste into COMMENTS. Everything above the comments is short
          enough to tap straight in while the copied block is on screen.</div></div></li>
      <li><span class="fn">3</span><div>
        <button class="btn" id="saveEval">Save this referee</button>
        <div class="hint" id="saveHint" hidden></div>
        <div class="hint">Keeps a copy here, for the referee's profile and your backup.</div></div></li>
    </ol>
  `;
      paintSaveState(g);
    }

    /* What the form still needs, shown beside the copy button so a half-rated
       referee gets noticed before you are standing in the parking lot. */
    /* Checked against the game that answers the form's questions - the day's
       lead - because that is the one whose field, time and division get typed
       in. The ratings and comments are the day's and shared by every entry. */
    function missingFor(g) {
      const lead = dayLead(g); if (!lead) return ['a referee'];
      const {field, ref} = lead;
      const out = [];
      if (!S.mentor.trim()) out.push('your name (account button, top left)');
      // A name the import could not match is kept as the sheet wrote it, but
      // the form's Field question only takes one of its own choices.
      if (!field.name) out.push('field');
      else if (!FIELDS.includes(field.name)) out.push('a field from the form\'s list (Settings)');
      if (!field.time) out.push('kickoff');
      if (!field.division) out.push('division');
      if (!ref.name.trim()) out.push('referee name');
      RATED.forEach(c => {if (ref.ratings[c.id] == null) out.push(c.short);});
      if (!ref.moveUp) out.push('move up');
      if (!ref.comments.trim()) out.push('comments');
      return out;
    }
    function readyHTML(g) {
      const miss = missingFor(g);
      return miss.length
        ? `<div class="warn"><b>Still missing:</b> ${esc(miss.join(', '))}</div>`
        : `<div class="okbox">&check; Everything the form asks for is filled in.</div>`;
    }
    function charCountText(s) {return `${s.length} character${s.length === 1 ? '' : 's'}`;}

    /* ---------- text assembly for the clipboard ----------
       recordFor() is the one place a live referee becomes a plain record, and
       formText() the one place a record becomes the form-order block. The
       Score tab, the Saved list and the "changed since saving" check all go
       through them, so they cannot drift apart. */
    /* The form's Field, Time, Division and Position come from the day's lead
       game; `games` and `divisions` carry the rest, so the referee's profile and
       the offside rule can see everywhere they worked. A single-game day looks
       exactly like it always did, one entry long. */
    function recordFor(g) {
      const lead = dayLead(g); if (!lead) return null;
      const {field, ref} = lead;
      return {
        mentor: S.mentor, date: S.date, field: field.name, sub: field.sub || '', time: field.time,
        division: field.division, referee: ref.name, position: ref.role,
        ratings: {...ref.ratings}, moveUp: ref.moveUp, comments: ref.comments,
        notes: dayNotes(g).map(n => ({...n})),
        games: g.map(x => ({field: x.field.name, sub: x.field.sub || '', time: x.field.time,
          division: x.field.division, position: x.ref.role, slot: x.ref.slot})),
        divisions: dayDivisions(g)
      };
    }
    function formText(r) {
      // The block is what gets typed and pasted into the form, so it holds what
      // the form asks for and nothing else. Which games an evaluation covers is
      // on the Score tab and on the saved card; it is not a form question.
      return [
        `Mentor/Monitor name: ${r.mentor}`, `Date: ${prettyDate(r.date)}`, `Field: ${r.field}`,
        `Time: ${pretty12(r.time)}`, `Division: ${r.division}`, `Referee being mentored: ${r.referee}`,
        `Position: ${r.position}`, '',
        ...RATED.map(c => `${c.label}: ${r.ratings[c.id] == null ? '-' : r.ratings[c.id]}`),
        `Should they move up: ${r.moveUp || '-'}`, '', 'COMMENTS:', r.comments
      ].join('\n');
    }
    function formBlock(g) {return formText(recordFor(g));}

    /* EVERY saved record this day covers, not just the first.

       There is usually one, but there can be more: records written per game
       before evaluations became per day, and records whose entry ids no longer
       exist because the session was cleared and the schedule re-imported. Both
       are the same referee on the same date, which the league counts once, so
       saving has to fold them together rather than update one and leave the
       others behind looking like extra evaluations.

       Matched two ways: by the entry ids the record was saved from, and by
       referee name plus date, which survives the ids changing. */
    function savedRecordsFor(g) {
      const lead = dayLead(g); if (!lead) return [];
      const ids = dayIds(g);
      const key = nameKey(lead.ref.name);
      return HIST.filter(h =>
        ids.includes(h.refId)
        || (Array.isArray(h.refIds) && h.refIds.some(id => ids.includes(id)))
        || (!!key && nameKey(h.referee) === key && h.date === S.date));
    }
    function savedRecordFor(g) {return savedRecordsFor(g)[0] || null;}
    /* The save button says whether this referee is saved, and whether they
       have changed since - so a late edit is not silently left out of the record. */
    function paintSaveState(g) {
      const b = $('#saveEval'), h = $('#saveHint'); if (!b || !h) return;
      const saved = savedRecordFor(g);
      const current = !!saved && formText(saved) === formText(recordFor(g));
      b.innerHTML = saved ? (current ? 'Saved &check;' : 'Update saved copy') : 'Save this referee';
      b.classList.toggle('primary', !!saved && !current);
      h.hidden = !saved;
      h.textContent = saved ? `${current ? 'Saved at' : 'Changed since the save at'} ${clockOf(saved.savedAt)}` : '';
    }

    async function copyText(t, label) {
      // navigator.clipboard needs a "secure context": https or localhost.
      // GitHub Pages is https so this is the happy path. Opening the file
      // straight off disk (file://) is not secure, so the old execCommand
      // route is kept as a fallback rather than failing silently.
      try {
        await navigator.clipboard.writeText(t);
        flash(label + ' copied');
        return true;
      } catch (e) {
        const ta = document.createElement('textarea');
        ta.value = t; ta.setAttribute('readonly', ''); ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta);
        // iOS ignores select() on its own; it needs an explicit selection range.
        ta.select(); ta.setSelectionRange(0, t.length);
        const ok = document.execCommand('copy');
        ta.remove();
        flash(ok ? label + ' copied' : 'Copy blocked - select the text manually');
        return ok;
      }
    }

    /* ============================================================
       SAVED + EXPORT
       ============================================================ */
    function saveEval() {
      const p = activePair(); if (!p) return;
      const g = dayGroupFor(p.ref);
      const lead = dayLead(g); if (!lead) return;
      if (!lead.ref.name.trim()) {flash('Add the referee name first'); return;}

      /* One record for the referee's whole day. refIds lists every entry it
         covers so selecting them from any of their games finds it again; refId
         stays as the lead's, which is what older records and the uploader use.
         Saving the same referee again updates their record instead of stacking
         a duplicate (which also listed them twice in the CSV). */
      /* Keep the oldest matching record's id so the league updates its copy
         rather than gaining a second one, and clear away any others this day
         now covers - including from the server, if they ever got there. */
      const prevAll = savedRecordsFor(g).sort((a, b) => (a.savedAt || 0) - (b.savedAt || 0));
      const prev = prevAll[0] || null;
      const rec = {
        id: prev ? prev.id : uid(), refId: lead.ref.id, refIds: dayIds(g),
        savedAt: Date.now(), ...recordFor(g)
      };
      const folded = prevAll.slice(1);
      if (folded.length) {
        folded.forEach(queueRemoteDelete);
        const drop = new Set(folded.map(x => x.id));
        HIST = HIST.filter(x => !drop.has(x.id));
      }
      if (prev) HIST[HIST.indexOf(prev)] = rec; else HIST.unshift(rec);

      // Every game this evaluation covers is filed, not just the one on screen.
      applyToDay(g, {submitted: true});
      /* Once every official on a pitch is filed, the game is finished - retire
         it from the picker automatically instead of making you tidy up later.
         Check every pitch the day touched, since one save can finish two. */
      const newlyDone = [];
      [...new Set(g.map(x => x.field))].forEach(f => {
        if (!f.done && f.refs.every(r => r.submitted)) {f.done = true; newlyDone.push(f);}
      });
      histChanged();
      save(); renderAll(); requestPersistence(); syncNow();
      const sharing = isApproved() && uploadConsent() === true;
      const covered = g.length > 1 ? ` (${plural(g.length, 'game')})` : '';
      const merged = folded.length ? ` ${plural(folded.length, 'duplicate')} folded in.` : '';
      flash((prev ? (sharing ? `Saved copy updated${covered}; uploading` : `Saved copy updated${covered}`)
        : newlyDone.length ? `Saved${covered}. ${plural(newlyDone.length, 'game')} marked done.`
          : sharing ? `Saved${covered}; uploading for other mentors` : `Saved${covered} to this device`) + merged);
    }

    function csvCell(v) {
      let s = String(v == null ? '' : v);
      // A cell that starts like a formula gets a leading ' so Excel and Sheets
      // show it as text instead of running it ("=HYPERLINK(...)" in a comment,
      // or in a restored backup). The admin console's export does the same.
      if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
      // RFC 4180: wrap in quotes if the value contains a comma, quote or
      // newline, and double any internal quotes. Comments will contain
      // semicolons and sometimes commas, so this is not optional.
      return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function exportCSV() {
      if (!HIST.length) {flash('Nothing saved yet'); return;}
      // Pitch is in the CSV because it is your own record and two Tigers rows would
      // otherwise look identical. It is deliberately absent from the form block:
      // the form has no pitch question and the Field value must match its dropdown.
      /* One row per evaluation, and an evaluation can now cover a referee's
         whole day, so "Games covered" spells out what the single Field, Pitch,
         Time and Division columns cannot. It reads "1" for an ordinary row. */
      const head = ['Mentor', 'Date', 'Field', 'Pitch', 'Time', 'Division', 'Referee', 'Position',
        'Games covered', 'All games', ...RATED.map(c => c.label), 'Move up', 'Comments'];
      const gamesOf = (r) => (Array.isArray(r.games) && r.games.length ? r.games : null);
      const rows = HIST.map(r => {
        const gs = gamesOf(r);
        return [r.mentor, prettyDate(r.date), r.field, r.sub || '', pretty12(r.time), r.division,
          r.referee, r.position,
          gs ? gs.length : 1,
          gs ? gs.map(x => `${[x.field, x.sub].filter(Boolean).join(' ')}` +
            `${x.time ? ' ' + pretty12(x.time) : ''}` +
            `${[x.division, x.slot].filter(Boolean).length ? ' (' + [x.division, x.slot].filter(Boolean).join(', ') + ')' : ''}`).join('; ')
            : [[r.field, r.sub].filter(Boolean).join(' '), pretty12(r.time)].filter(Boolean).join(' '),
          ...RATED.map(c => r.ratings[c.id] ?? ''), r.moveUp || '', r.comments];
      });
      const csv = [head, ...rows].map(r => r.map(csvCell).join(',')).join('\r\n');
      // The byte-order mark makes Excel read the file as UTF-8, so accented
      // names do not turn into mojibake.
      saveFile(`referee-evaluations-${S.date}.csv`, '﻿' + csv, 'text/csv');
    }

    /* Touch devices get the share sheet (Save to Files, Drive, email...),
       because a download link lands somewhere hard to find on a phone and does
       nothing at all inside the Android app's WebView. Desktops, and anything
       that cannot share this file type, fall back to an ordinary download.
       Resolves true unless the person cancelled. */
    async function saveFile(name, text, mime) {
      const blob = new Blob([text], {type: mime + ';charset=utf-8'});
      const touch = window.matchMedia && matchMedia('(pointer: coarse)').matches;
      if (touch && navigator.canShare && typeof File === 'function') {
        const file = new File([blob], name, {type: mime});
        if (navigator.canShare({files: [file]})) {
          try {await navigator.share({files: [file], title: name}); return true;}
          catch (e) {if (e.name === 'AbortError') return false; /* otherwise fall back to a download */}
        }
      }
      // A Blob is just an in-memory file. createObjectURL hands back a
      // temporary URL pointing at it, which a normal link can "download".
      // Revoking afterwards releases the memory.
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1500);
      flash('Downloaded ' + name);
      return true;
    }

    /* ============================================================
       BACKUP + RESTORE
       ------------------------------------------------------------
       Everything lives in this one browser, and browsers do lose it: a
       reset or replaced phone, cleared site data, and Safari in a normal
       tab wipes script storage for sites you have not opened in seven
       days - about one weekend off. The CSV is a report and cannot be
       read back in. This JSON file can, on any device, which covers
       carrying data between phone and laptop without needing accounts.
       ============================================================ */
    const BACKUP_KEYS = ['sideline:mentor', 'sideline:sheet', 'sideline:map', 'sideline:myfields', 'sideline:theme'];

    function backupText() {
      const prefs = {};
      BACKUP_KEYS.forEach(k => {const v = store.get(k); if (v !== undefined) prefs[k] = v;});
      return JSON.stringify({app: 'sideline', version: 1, exportedAt: new Date().toISOString(),
        session: S, history: HIST, prefs});
    }
    function markBackedUp() {
      store.set('sideline:lastBackup', Date.now());
      if (S.ui.tab === 'saved') renderSaved();
    }

    function restoreBackup(text) {
      let data = null;
      try {data = JSON.parse(String(text || '').trim());} catch (e) { /* reported below */}
      if (!data || data.app !== 'sideline' || !data.session || !Array.isArray(data.session.fields)
        || !Array.isArray(data.history)) {
        flash('That is not a Sideline backup'); return;
      }
      const have = new Set(HIST.map(h => h.id));
      const fresh = data.history.filter(h => h && h.id && h.ratings && typeof h.ratings === 'object' && !have.has(h.id))
        .map(tidyRecord);
      const games = data.session.fields.filter(f => f && f.name).length;
      const when = data.exportedAt ? new Date(data.exportedAt).toLocaleString() : 'an unknown date';
      const plural = (n, w) => `${n} ${w}${n === 1 ? '' : 's'}`;
      askConfirm(`Restore the backup from ${when}? Its ${plural(games, 'game')} replace the games and ` +
        `in-progress notes on this device, and ${plural(fresh.length, 'saved evaluation')} not already here ` +
        `get added. Saved evaluations on this device are kept.`, 'Restore', () => {
          HIST = HIST.concat(fresh).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0));
          histChanged();
          const localMentor = S.mentor;
          S = data.session; normalize();
          if (!S.mentor) S.mentor = localMentor;
          Object.entries(data.prefs || {}).forEach(([k, v]) => {if (BACKUP_KEYS.includes(k)) store.set(k, v);});
          if (data.prefs && data.prefs['sideline:theme']) setTheme(data.prefs['sideline:theme']);
          save(); setTab('fields'); flash('Backup restored');
        });
    }

    /* Asks the browser to exempt this site from storage eviction. Chrome grants
       it quietly for installed or regularly used apps; elsewhere it is a no-op.
       Called after a save, once there is something worth keeping. */
    function requestPersistence() {
      try {
        if (navigator.storage && navigator.storage.persist) {
          navigator.storage.persisted().then(p => p || navigator.storage.persist()).catch(() => { });
        }
      } catch (e) { }
    }

    /* ============================================================
       ACCOUNTS
       ------------------------------------------------------------
       Optional, and kept away from note-taking on purpose. Signing in only
       ADDS things: uploading saved evaluations, and reading other mentors'
       evaluations for referee profiles. Nothing on the Fields, Observe or
       Score tabs waits on the network or on a login, because the network
       is exactly what a youth soccer field does not have.

       ACCT.status is one of:
         off        accounts are not configured in this build
         signedOut  configured, but nobody is signed in on this device
         pending    signed in, waiting for an admin to approve
         mentor     approved
         admin      approved, and can use the admin console (admin/)
       It is cached so the right UI shows offline. The server enforces every
       rule regardless of what this cache claims.
       ============================================================ */
    const ACCT_BLANK = {status: 'signedOut', id: '', email: '', name: ''};
    let ACCT = ACCOUNTS_ON ? {...ACCT_BLANK, ...(store.get('sideline:acct') || {})}
      : {...ACCT_BLANK, status: 'off'};
    const acctUI = {step: 'email', email: '', code: '', busy: false, error: '', notice: '', offline: false, sentAt: 0};
    let sb = null, sbLoading = null, acctStarted = false, mentorLoading = null;

    const isApproved = () => ACCT.status === 'mentor' || ACCT.status === 'admin';
    const plural = (n, word) => `${n} ${word}${n === 1 ? '' : 's'}`;

    /* The library is only fetched when accounts are configured, so the
       offline single-device build never downloads it. */
    function loadSupabase() {
      if (window.supabase && window.supabase.createClient) return Promise.resolve();
      if (sbLoading) return sbLoading;
      sbLoading = new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = SUPABASE_JS.src;
        s.integrity = SUPABASE_JS.integrity;
        s.crossOrigin = 'anonymous';
        s.onload = () => resolve();
        s.onerror = () => {
          sbLoading = null; s.remove();
          reject(new Error('Could not load the sign-in library. Check your connection.'));
        };
        document.head.appendChild(s);
      });
      return sbLoading;
    }
    function sbc() {
      if (sb || !ACCOUNTS_ON || !window.supabase || !window.supabase.createClient) return sb;
      sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
        auth: {
          persistSession: true, autoRefreshToken: true, detectSessionInUrl: false,
          // The "sideline:" prefix matters: the schedule import's browser-cache
          // scan skips those keys, so a login token is never offered as a schedule.
          storageKey: 'sideline:auth'
        }
      });
      return sb;
    }

    function isNetErr(e) {
      const m = String((e && (e.message || e)) || '');
      return !navigator.onLine || /failed to fetch|networkerror|network request|load failed|timed? ?out/i.test(m);
    }
    function friendly(e) {
      if (isNetErr(e)) return 'No connection. It will try again when you are back online.';
      const m = String((e && (e.message || e)) || 'Something went wrong');
      if (e && e.code === '42501') return 'Your account is not approved for that.';
      if (/rate limit|too many/i.test(m)) return 'Too many attempts. Wait a minute, then try again.';
      if (/otp|token/i.test(m) && /expired|invalid/i.test(m)) return 'That code is wrong or has expired. Send a new one.';
      return m;
    }

    /* Background work (sync, profile refresh, token refresh) must never
       rebuild a tab under someone's thumb, so it re-renders only when no
       text field on the page has focus. The next user action catches up. */
    function renderQuietly() {
      const a = document.activeElement;
      const typing = a && (a.tagName === 'TEXTAREA' ||
        (a.tagName === 'INPUT' && !['checkbox', 'radio', 'button', 'file'].includes(a.type)));
      if (typing && !$('#sheet').contains(a)) {renderWatching(); return;}
      renderAll();
    }

    async function initAccounts() {
      if (!ACCOUNTS_ON || acctStarted) return;
      if (isApproved()) loadLeagueCache().then(renderQuietly);
      else idb.del('league');   // nothing from other mentors stays on a device that is not approved
      try {await loadSupabase();} catch (e) {return;}   // offline first launch: keep the cached status
      const c = sbc();
      if (!c || acctStarted) return;
      acctStarted = true;
      c.auth.onAuthStateChange((event, session) => {
        // Supabase warns against awaiting its own calls inside this callback,
        // so the work moves to the next tick.
        setTimeout(() => handleSession(event, session), 0);
      });
    }

    /* Whether supabase-js still holds a login on this device. */
    function storedLogin() {
      try {return !!localStorage.getItem('sideline:auth');} catch (e) {return false;}
    }

    async function handleSession(event, session) {
      if (!session) {
        // A stored login that could not be refreshed for want of a connection
        // still counts. supabase-js reports "no session" then but keeps the
        // login, and navigator.onLine is no guide: it says true on one bar or
        // on a Wi-Fi with no internet behind it. Signing out there also deleted
        // the league cache the mentor was relying on at the field. When the
        // server really refuses the login, supabase-js deletes it and says
        // SIGNED_OUT, so only that - or no stored login at all - ends it.
        if (event !== 'SIGNED_OUT' && ACCT.status !== 'signedOut' && storedLogin()) {
          acctUI.offline = true; paintAcctCard(false);
          return;
        }
        if (ACCT.status !== 'signedOut') setAcct({status: 'signedOut'});
        return;
      }
      // A refresh that finally got through after a spell without signal is the
      // moment to catch up: re-check approval, upload, pull.
      if (event === 'TOKEN_REFRESHED' && ACCT.id === session.user.id && !acctUI.offline) return;
      if (ACCT.id !== session.user.id) {
        clearLeague();
        setAcct({status: 'pending', id: session.user.id, email: session.user.email || ''});
      }
      await refreshMentor();
    }

    function refreshMentor() {
      const c = sbc();
      if (!c) return Promise.resolve();
      if (mentorLoading) return mentorLoading;
      // Next tick, for the same reason as syncNow().
      mentorLoading = Promise.resolve().then(async () => {
        try {
          const {data: {session}} = await c.auth.getSession();
          if (!session) return;
          const {data, error} = await c.from('mentors')
            .select('id,email,display_name,role').eq('id', session.user.id).maybeSingle();
          if (error) throw error;
          const row = data || {id: session.user.id, email: session.user.email, display_name: '', role: 'pending'};
          acctUI.offline = false;
          setAcct({status: row.role, id: row.id, email: row.email || session.user.email || '', name: row.display_name || ''});
          // A new phone takes the account's name; otherwise the account takes
          // the name typed here.
          if (row.display_name && !S.mentor.trim()) {S.mentor = row.display_name; save(); renderQuietly();}
          else pushMentorName();
          if (isApproved()) {offerFirstUpload(); syncNow(); pullLeague();}
        } catch (e) {
          // Offline, or the project is paused: keep the cached status.
          acctUI.offline = isNetErr(e);
        } finally {
          mentorLoading = null;
        }
      });
      return mentorLoading;
    }

    /* The server credits every uploaded evaluation to the account's name, so
       the account's name follows the name typed in the app. It refuses a name
       another account already has; the Account sheet then says so. */
    let nameTimer = null;
    function pushMentorName(delay) {
      clearTimeout(nameTimer);
      nameTimer = setTimeout(async () => {
        const c = sbc(), want = clip(S.mentor.trim(), 80);
        if (!c || ACCT.status === 'signedOut' || !ACCT.id || !want || want === ACCT.name) return;
        let error = null;
        try {({error} = await c.from('mentors').update({display_name: want}).eq('id', ACCT.id));} catch (e) {error = e;}
        if (error) {
          if (!isNetErr(error)) {acctUI.error = friendly(error); paintAcctCard(true);}
          return;
        }
        ACCT = {...ACCT, name: want};
        store.set('sideline:acct', ACCT);
        if (acctUI.error) {acctUI.error = ''; paintAcctCard(true);}
      }, delay || 0);
    }

    function setAcct(next) {
      const wasApproved = isApproved();
      ACCT = {...ACCT_BLANK, ...next};
      store.set('sideline:acct', ACCT);
      if (wasApproved && !isApproved()) clearLeague();
      if (!wasApproved && isApproved()) loadLeagueCache().then(renderQuietly);
      invalidateProfiles();
      paintAccount();
    }

    /* Two letters from the mentor's name, the way every app builds a fallback
       avatar: "Pat Delgado" -> PD, "Cher" -> CH. Falls back to the email when
       the name has not been filled in yet. */
    function initialsFor(name, email) {
      const parts = String(name || '').trim().split(/\s+/).filter(Boolean);
      if (parts.length >= 2) return (parts[0][0] + parts[parts.length - 1][0]).toUpperCase();
      if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
      const e = String(email || '').trim();
      return e ? e.slice(0, 2).toUpperCase() : '';
    }

    function paintAvatar() {
      const av = $('header #openAccount'), ini = $('#avatarInitials');
      if (!av || !ini) return;
      const on = ACCOUNTS_ON && ACCT.status !== 'signedOut';
      if (on) av.setAttribute('data-acct', ACCT.status); else av.removeAttribute('data-acct');
      // Signed out, the avatar is the generic person glyph every app uses for
      // "sign in"; local initials there read as if someone were signed in.
      // Signed in, or with accounts off, it shows the mentor's initials.
      const who = ACCOUNTS_ON && !on ? '' : initialsFor(ACCT.name || S.mentor, on ? ACCT.email : '');
      if (who) ini.textContent = who;
      else ini.innerHTML = '<svg class="who" viewBox="0 0 24 24" aria-hidden="true">' +
        '<circle cx="12" cy="8.5" r="3.8"/><path d="M4.5 20.5c0-4 3.4-6.6 7.5-6.6s7.5 2.6 7.5 6.6"/></svg>';
      const label = !ACCOUNTS_ON ? 'Your name and this device'
        : !on ? 'Account - not signed in'
          : ACCT.status === 'pending' ? 'Account - waiting for approval'
            : `Account - signed in as ${ACCT.email}`;
      av.title = label; av.setAttribute('aria-label', label);
    }

    /* Only the account card is repainted inside an open Account sheet, never
       the whole sheet: rebuilding it took the name field out from under the
       keyboard after every letter typed. */
    function paintAccount() {
      paintAvatar();
      paintAcctCard(false);
      renderQuietly();
    }

    /* The account sheet: what used to be the third card inside Settings, now a
       destination of its own that the avatar opens from any tab. */
    function renderAccountSheet() {
      const body = $('#sheetBody'); if (!body) return;
      if (!ACCOUNTS_ON) {
        body.innerHTML = `<div class="card">
        <label class="f"><span>Your name, as it goes on the form</span>
          <input type="text" data-mentor value="${esc(S.mentor)}" placeholder="Your name" autocomplete="name" /></label>
        <p class="hint" style="margin:10px 0 0">Sharing between mentors is switched off in this build,
          so everything stays on this device.</p></div>`;
        return;
      }
      body.innerHTML = `<div class="card">
      <label class="f"><span>Your name, as it goes on the form</span>
        <input type="text" data-mentor value="${esc(S.mentor)}" placeholder="Your name" autocomplete="name" /></label>
    </div>
    <div class="card" id="acctCard">${accountCardInner()}</div>`;
    }

    async function sendCode() {
      const email = acctUI.email.trim().toLowerCase();
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
        acctUI.error = 'Enter a valid email address.'; paintAcctCard(true); return;
      }
      acctUI.busy = true; acctUI.error = ''; paintAcctCard(true);
      try {
        await loadSupabase();
        const c = sbc(); if (!c) throw new Error('Sign-in is not available right now.');
        initAccounts();
        const {error} = await c.auth.signInWithOtp({email, options: {shouldCreateUser: true}});
        if (error) throw error;
        Object.assign(acctUI, {step: 'code', code: '', email, sentAt: Date.now(),
          notice: `We emailed a code to ${email}. It can take a minute to arrive; check spam too.`});
        tickResend();
      } catch (e) {
        acctUI.error = friendly(e);
      }
      acctUI.busy = false; paintAcctCard(true);
      if (acctUI.step === 'code') {const i = $('#acctCode'); if (i) i.focus();}
    }

    async function verifyCode() {
      const token = acctUI.code.replace(/\s+/g, '');
      if (!/^\d{6,10}$/.test(token)) {acctUI.error = 'Enter the code from the email.'; paintAcctCard(true); return;}
      acctUI.busy = true; acctUI.error = ''; paintAcctCard(true);
      try {
        const c = sbc(); if (!c) throw new Error('Sign-in is not available right now.');
        const {error} = await c.auth.verifyOtp({email: acctUI.email.trim().toLowerCase(), token, type: 'email'});
        if (error) throw error;
        Object.assign(acctUI, {step: 'email', code: '', notice: '', error: ''});
        flash('Signed in');   // onAuthStateChange(SIGNED_IN) loads the account
      } catch (e) {
        acctUI.error = friendly(e);
      }
      acctUI.busy = false; paintAcctCard(true);
    }

    function signOut() {
      askConfirm('Sign out on this device? Other mentors’ evaluations are removed from this device until ' +
        'you sign in again. Your notes and saved evaluations stay.', 'Sign out', async () => {
          try {const c = sbc(); if (c) await c.auth.signOut({scope: 'local'});} catch (e) { }
          setAcct({status: 'signedOut'});
          flash('Signed out');
        });
    }

    /* For a lost or stolen phone: ends this account's login on every device,
       this one included. The lost phone keeps working until its current token
       runs out (an hour at most), because the server then refuses a new one. */
    function signOutEverywhere() {
      askConfirm('Sign out on every phone and computer signed in to this account? Use this if a phone was lost. ' +
        'Your notes and saved evaluations on this device stay.', 'Sign out everywhere', async () => {
          try {
            const c = sbc(); if (!c) throw new Error('Sign-in is not available right now.');
            const {error} = await c.auth.signOut({scope: 'global'});
            if (error) throw error;
          } catch (e) {
            acctUI.error = friendly(e); paintAcctCard(true);
            return;
          }
          setAcct({status: 'signedOut'});
          flash('Signed out on every device');
        });
    }

    function accountCardInner() {
      // No heading: this renders inside the Account sheet, which is already
      // titled "Account". Repeating it was pure noise.
      const head = '';
      const err = acctUI.error ? `<div class="warn">${esc(acctUI.error)}</div>` : '';
      const s = ACCT.status;
      if (s === 'signedOut') {
        if (acctUI.step === 'code') {
          return `${head}
        <p class="hint" style="margin-top:0">${esc(acctUI.notice)}</p>
        <label class="f"><span>Sign-in code</span>
          <input type="text" id="acctCode" inputmode="numeric" autocomplete="one-time-code" maxlength="10"
            value="${esc(acctUI.code)}" placeholder="123456" /></label>
        <button class="btn sm primary" id="acctVerify" style="margin-top:10px" ${acctUI.busy ? 'disabled' : ''}>
          ${acctUI.busy ? 'Checking&hellip;' : 'Sign in'}</button>
        <div class="row" style="margin-top:8px">
          <button class="btn sm ghost" id="acctResend" ${acctUI.busy || resendWait() ? 'disabled' : ''}>${resendLabel()}</button>
          <button class="btn sm ghost" id="acctBack">Different email</button>
        </div>${err}`;
        }
        return `${head}
        <p class="hint" style="margin-top:0">Sign in to share your saved evaluations with other mentors and see
          league-wide referee profiles. Taking notes never needs an account.</p>
        <label class="f"><span>Email</span>
          <input type="email" id="acctEmail" autocomplete="email" inputmode="email" autocapitalize="off"
            spellcheck="false" value="${esc(acctUI.email)}" placeholder="you@example.com" /></label>
        <button class="btn sm primary" id="acctSend" style="margin-top:10px" ${acctUI.busy ? 'disabled' : ''}>
          ${acctUI.busy ? 'Sending&hellip;' : 'Email me a sign-in code'}</button>${err}`;
      }
      const role = s === 'admin' ? 'Admin' : s === 'mentor' ? 'Mentor' : 'Waiting for approval';
      const body = s === 'pending'
        ? `<div class="warn">An admin has to approve this account before it can upload or read shared evaluations.
          Ask your assignor or a league admin to approve <b>${esc(ACCT.email)}</b>.</div>
        <button class="btn sm" id="acctCheck">Check again</button>`
        : `<label class="switchrow"><input type="checkbox" id="acctUpload" ${uploadConsent() === true ? 'checked' : ''} />
          Upload my saved evaluations</label>
        <div class="hint" style="margin:0 0 8px">${esc(syncSummaryText())}</div>
        ${s === 'admin' ? `<a class="btn sm" href="admin/" target="_blank" rel="noopener">Open the admin console</a>
        <div class="hint" style="margin:6px 0 0">Approving mentors, league reports and referee clean-up are there,
          best on a computer.</div>` : ''}`;
      return `${head}
        <div class="acctline"><b>${esc(ACCT.email)}</b><span class="pill">${role}</span>
          ${acctUI.offline ? '<span class="pill">offline</span>' : ''}</div>
        ${body}${err}
        <div class="row" style="margin-top:8px">
          <button class="btn sm ghost" id="acctSignOut">Sign out</button>
          <button class="btn sm ghost" id="acctSignOutAll">Sign out on all devices</button>
        </div>`;
    }

    /* Supabase sends one code per address a minute, so "Send a new code"
       waits that minute out instead of answering with an error. */
    const RESEND_MS = 60000;
    let resendTick = null;
    const resendWait = () => Math.max(0, Math.ceil((acctUI.sentAt + RESEND_MS - Date.now()) / 1000));
    const resendLabel = () => (resendWait() ? `Send a new code (${resendWait()}s)` : 'Send a new code');
    function tickResend() {
      clearInterval(resendTick);
      resendTick = setInterval(() => {
        const b = $('#acctResend');
        if (b) {b.disabled = acctUI.busy || resendWait() > 0; b.textContent = resendLabel();}
        if (!resendWait()) clearInterval(resendTick);
      }, 1000);
    }
    function paintAcctCard(force) {
      const box = $('#acctCard');
      if (!box || $('#sheet').hidden) return;
      const a = document.activeElement;
      if (!force && a && box.contains(a) && a.tagName === 'INPUT' && a.type !== 'checkbox') return;
      box.innerHTML = accountCardInner();
    }

    /* Admin work - approving mentors, merging referees, deletion requests and
       league reports - lives in the admin console (admin/), not here. This
       app stays the same for an admin as for any mentor, apart from the link
       to the console on the Account sheet. */

    /* ============================================================
       UPLOADING SAVED EVALUATIONS
       ------------------------------------------------------------
       Only saved evaluations travel; games and notes in progress stay on
       the phone. Each HIST record remembers when, and for which account,
       it was last uploaded (syncedAt / syncedBy). saveEval() replaces the
       record, which clears both, so an edited evaluation goes up again.
       The server matches on the record's own id, so repeats and restored
       backups update in place instead of duplicating.
       ============================================================ */
    const SYNC = {running: null, again: false, error: '', retryTimer: null, backoff: 0, lastOk: store.get('sideline:lastSync') || 0};

    function uploadConsent() {
      const m = store.get('sideline:uploadConsent') || {};
      return m[ACCT.id];
    }
    function setUploadConsent(v) {
      const m = store.get('sideline:uploadConsent') || {};
      m[ACCT.id] = v;
      store.set('sideline:uploadConsent', m);
    }
    const unsynced = (r) => !!(r.referee && r.referee.trim()) && (!r.syncedAt || r.syncedBy !== ACCT.id);
    /* Why a record cannot go up as saved, or '' if it can. The server's reason
       is kept against the version it refused, so that version is not resent on
       every sync; saving the evaluation again makes a new version to try. */
    function uploadProblem(r) {
      if (!unsynced(r)) return '';
      if (!nameKey(r.referee)) return 'The referee name needs at least one letter or number.';
      const e = r.uploadError;
      return e && e.by === ACCT.id && e.savedAt === r.savedAt ? String(e.msg || 'Refused by the server.') : '';
    }
    const needsUpload = (r) => unsynced(r) && !uploadProblem(r);
    const pendingDeletes = () => (store.get('sideline:pendingDeletes') || []).filter(d => d && d.id && d.by);

    /* slice() counts UTF-16 units. Cutting between the two halves of an emoji
       leaves half a character, and the database refuses the whole upload. */
    const clip = (s, n) => (s.length > n && /[\ud800-\udbff]/.test(s[n - 1]) ? s.slice(0, n - 1) : s.slice(0, n));

    function toPayload(r) {
      const cut = (v, n) => clip(String(v == null ? '' : v).trim(), n);
      const out = {
        client_id: r.id,
        referee_name: cut(r.referee, 120),
        mentor_name: cut(r.mentor, 80),
        eval_date: /^\d{4}-\d{2}-\d{2}$/.test(r.date || '') ? r.date : '',
        field: cut(r.field, 80),
        pitch: cut(r.sub, 8),
        kickoff: /^\d{2}:\d{2}$/.test(r.time || '') ? r.time : '',
        division: cut(r.division, 40),
        position: r.position === 'AR' ? 'AR' : 'CR',
        move_up: r.moveUp === 'Yes' || r.moveUp === 'No' ? r.moveUp : '',
        comments: clip(String(r.comments || ''), 20000),
        notes: (r.notes || []).slice(0, 500).map(n => ({
          cat: n.cat, pol: n.pol, text: clip(String(n.text || ''), 500), at: n.at || 0
        })),
        saved_at: new Date(r.savedAt || Date.now()).toISOString()
      };
      // The rated category ids are the column names.
      RATED.forEach(c => {
        const v = r.ratings && r.ratings[c.id];
        out[c.id] = [1, 2, 3, 4].includes(v) ? v : null;
      });
      return out;
    }

    /* A deleted record might already be on the server - or be on its way,
       if an upload was in flight - so the delete is queued either way.
       Deleting a row that does not exist is harmless. */
    function queueRemoteDelete(rec) {
      const by = rec.syncedBy || (isApproved() && uploadConsent() === true ? ACCT.id : '');
      if (!by) return;
      store.set('sideline:pendingDeletes', pendingDeletes().concat([{id: rec.id, by}]));
    }

    let offeredUpload = false;
    function offerFirstUpload() {
      if (offeredUpload || !isApproved() || uploadConsent() !== undefined) return;
      const n = HIST.filter(needsUpload).length;
      if (!n) {setUploadConsent(true); return;}
      if (!$('#dlg').hidden) return;   // never stack on another question; asked again next time
      offeredUpload = true;
      askConfirm(`Upload ${plural(n, 'saved evaluation')} from this device? Every approved mentor will be able ` +
        `to read ${n === 1 ? 'it' : 'them'}. New saves upload automatically; you can turn this off under the account button.`,
        'Upload', () => {setUploadConsent(true); syncNow(); paintSync();},
        {tone: 'primary', noLabel: 'Not now', onNo: () => {setUploadConsent(false); paintSync();}});
    }

    function syncNow() {
      const c = sbc();
      if (!c || !isApproved()) return Promise.resolve();
      // Deleting is not uploading: an evaluation deleted after uploading was
      // switched off still has to leave the server, as the delete dialog says.
      if (uploadConsent() !== true && !pendingDeletes().some(d => d.by === ACCT.id)) return Promise.resolve();
      // A save or delete made while a pass is running missed that pass's list,
      // so ask for one more pass when it ends instead of waiting for the next
      // time the app comes to the front.
      if (SYNC.running) {SYNC.again = true; return SYNC.running;}
      clearTimeout(SYNC.retryTimer);
      SYNC.again = false;
      let resaved = false;
      // Started on the next tick, never inline: with nothing to send, the body
      // finishes without awaiting, and its `finally` (which clears
      // SYNC.running) would then run BEFORE this assignment - leaving a
      // finished promise parked in SYNC.running and every later sync skipped.
      SYNC.running = Promise.resolve().then(async () => {
        const me = ACCT.id;
        try {
          const mine = pendingDeletes().filter(d => d.by === me);
          if (mine.length) {
            const ids = mine.map(d => d.id);
            const {error} = await c.from('evaluations').delete().eq('mentor_id', me).in('client_id', ids);
            if (error) throw error;
            store.set('sideline:pendingDeletes', pendingDeletes().filter(d => !(d.by === me && ids.includes(d.id))));
          }
          const todo = uploadConsent() === true ? HIST.filter(needsUpload) : [];
          for (let i = 0; i < todo.length; i += 50) {
            const batch = todo.slice(i, i + 50);
            const sent = new Map(batch.map(r => [r.id, r.savedAt]));
            const {data, error} = await c.rpc('save_evaluations', {p_items: batch.map(toPayload)});
            if (error) throw error;
            (data || []).forEach(row => {
              const r = HIST.find(h => h.id === row.out_client_id);
              if (!r) return;
              // Saved again while this batch was on its way: the newer version goes next pass.
              if (r.savedAt !== sent.get(r.id)) {resaved = true; return;}
              // The server refused this one and saved the rest of the batch.
              if (row.out_error) {r.uploadError = {msg: row.out_error, savedAt: r.savedAt, by: me}; return;}
              delete r.uploadError;
              r.syncedAt = Date.now(); r.syncedBy = me; r.serverRefereeId = row.out_referee_id;
            });
            histChanged(); save();
          }
          SYNC.error = ''; SYNC.backoff = 0;
          SYNC.lastOk = Date.now(); store.set('sideline:lastSync', SYNC.lastOk);
          if (todo.length || mine.length) pullLeague('force');
        } catch (e) {
          SYNC.error = friendly(e);
          SYNC.backoff = Math.min((SYNC.backoff || 15000) * 2, 10 * 60000);
          if (navigator.onLine) SYNC.retryTimer = setTimeout(syncNow, SYNC.backoff);
        } finally {
          SYNC.running = null;
          if ((resaved || SYNC.again) && !SYNC.error) setTimeout(syncNow, 500);
          paintSync();
        }
      });
      paintSync();
      return SYNC.running;
    }

    function paintSync() {
      paintAcctCard(false);
      if (S.ui.tab === 'saved') renderQuietly();
    }
    const refusedCount = () => HIST.filter(uploadProblem).length;
    const refusedText = (n) => `${plural(n, 'saved evaluation')} could not be uploaded; the reason is on the Saved tab.`;
    function syncSummaryText() {
      if (uploadConsent() !== true) return 'Uploading is off on this device.';
      const waiting = HIST.filter(needsUpload).length, refused = refusedCount();
      if (SYNC.running) return 'Uploading…';
      if (waiting) return `${plural(waiting, 'saved evaluation')} waiting to upload.${SYNC.error ? ' ' + SYNC.error : ''}`;
      if (refused) return refusedText(refused);
      return 'All saved evaluations are uploaded.';
    }
    function syncStatusHTML() {
      if (!ACCOUNTS_ON) return '';
      const s = ACCT.status;
      if (s === 'signedOut') {
        return `<p class="hint">Not signed in, so these stay on this device. Sharing them with other
      mentors is under the account button, top left.</p>`;
      }
      if (s === 'pending') return '<div class="warn">Your account is waiting for approval. Saved evaluations upload once an admin approves it.</div>';
      if (uploadConsent() !== true) {
        return `<div class="warn">Uploading is off on this device, so other mentors cannot see these.
